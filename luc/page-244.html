entre de sa mère.</em> Car , comme dit saint Ambroise , où se trouve l'esprit de grâce , là il ne peut rien manquer ; & celui dans le cœur duquel le Saint-Esprit a été répandu est vraiment <em>rempli</em>, puisqu'il a la plénitude de toutes sortes de vertus.", "marges": ["Cyprian. ep. 76."]}, {"versets": [], "texte": "Ce fut par la force de cet Esprit saint qui le remplit dès le ventre de sa mère , qu'il <em>convertit plusieurs des enfans d'Israël au Seigneur leur Dieu</em> ; c'est-à-dire , qu'il procura à un grand nombre de Juifs la connoissance de JESUS-CHRIST , en les envoyant à lui , comme au Messie & au Seigneur d'Israël. Car c'est de lui visiblement qu'il est parlé en ce lieu ; puisque dans le temps que le Fils de Dieu se fit homme, les Juifs n'étoient plus comme avant la captivité de Babylone , engagés dans l'idolâtrie. Ainsi cette <em>conversion</em> de plusieurs d'entre les enfans d'Israël , ne consistoit pas à renoncer aux idoles qu'ils n'adoroient plus , mais à reconnoître pour leur Seigneur celui qui ayant été prédit par les Prophètes , paroissoit alors au milieu d'eux comme l'un d'entre eux , revêtu de l'infirmité de notre nature, quoiqu'il fût le Dieu de tout l'Univers. Saint Jean fut donc vraiment", "marges": []}], "texteGeneral": []}};
