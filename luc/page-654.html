 sa personne ses membres foibles pour leur consolation. « Je ne trouve donc rien, s'écrie saint Ambroise, qui me donne plus de lieu d'admirer, & la bonté & la majesté de mon Sauveur, que cette tristesse & cette agonie. Car il m'auroit moins donné de témoignages de son amour, s'il ne s'étoit revêtu de mes sentimens aussi-bien que de ma nature. Il a donc senti de la tristesse pour moi, lui qui n'avoit nul sujet de s'attrister pour lui-même. Et se dépouillant volontairement du plaisir suprême qui accompagnoit sa divinité, il choisit de se plonger dans toute l'amertume que put lui causer la foiblesse de ma nature » : <em>Minus enim contulerat mihi, nisi meum suscepisset affectum. Ergo pro me doluit, quia pro se nihil habuit quod doleret ; & sequestratâ delectatione divinitatis æternæ, tædio meæ infirmitatis afficitur.</em> Ce n'est donc point, comme le remarque le même Père, une douleur feinte & une tristesse apparente, que celle de J. C. dont il est parlé ici. Il a été véritablement dans la tristesse, comme il a souffert véritablement la mort de la croix. Car il n'a pas pris seulement l'apparence, mais la vérité de notre chair. Il a donc dû s'assujettir aussi à la douleur, afin", "marges": ["Ambr. in hunc loc."]}], "texteGeneral": []}};
