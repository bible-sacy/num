        {
          "texte": "Le Fils de Dieu connoissoit tout ce qui étoit dans le cœur des hommes, & il n'avoit nul besoin, selon qu'il est dit ailleurs , que personne lui rendit témoignage d'aucun homme, pour le connoître. Il savoit donc que ces Pharisiens , & sur-tout les premiers d'entre eux avoient le cœur plein de fiel & d'amertume contre lui; & que lors même qu'ils l'invitoient à manger chez eux, c'étoit ordinairement avec quelque mauvais dessein. Aussi il est dit que d'abord qu'il fut entré chez le Pharisien qui l'invita à dîner , <em>ils l'observoient</em> , c'est-à-dire, qu'ils se rendoient attentifs pour tâcher de découvrir quelque chose qu'ils pussent reprendre dans ses actions ou dans ses paroles. J. C. voyoit en eux cette plaie secrète mieux qu'eux-mêmes. Cependant cette connoissance qu'il avoit de la mauvaise disposition de leur cœur , ne l'empêchoit point d'aller chez eux lorsqu'il étoit invité à y manger. Il ménageoit même toutes les occasions qui se présentoient pour les porter à sentir leur mal , & il les rendoit tout-à-fait inexcusables dans leur orgueil, puisqu'en même-temps qu'il leur découvroit leur maladie, il leur donnoit lieu de juger , qu'il étoit lui-même le médecin qui étoit venu pour les guérir, s'ils avoient voulu se soumettre à ses préceptes.",

        {
          "texte": "Cet <em>homme hydropique</em> qui se présenta à J. C. dans la maison du Pharisien pour être guéri , étoit peut-être de la maison même, ou bien il y vint dans le moment qu'il apprit que le Sauveur y étoit ; si ce n'est qu'on veuille croire ce qu'ont dit quelques Auteurs , que ce furent les Pharisiens mêmes qui firent ensorte qu'il s'y trouvât, pour tenter celui dont <em>ils observoient</em> maligne<a class=\"page-inline\" href=\"page-517.html\" title=\"p. 517\">‖</a>ment toute la conduite, & pour voir s'il le guériroit le jour du sabbat. Comme il pénétroit toutes leurs pensées, il voulut les prévenir sur la guérison de ce malade, en leur demandant <em>s'il étoit permis de</em> lui <em>rendre la santé un jour</em> comme étoit celui <em>du sabbat.</em> Ce n'est pas qu'il en doutât, lui qui étoit l'instituteur du sabbat, aussi-bien que le créateur de l'homme : mais c'est qu'il vouloit les obliger de s'expliquer sur cela, & de déclarer si cette œuvre de charité étoit défendue par la loi de Dieu en un tel jour. Ils n'osèrent lui répondre , craignant sans doute de contribuer à sa gloire s'ils disoient que cela étoit permis, & même de se priver d'une occasion favorable de décrier sa conduite; mais craignant encore plus s'ils le nioient, de s'attirer quelque confusion par sa réponse , comme ils l'avoient éprouvé déjà tant de fois. Alors JESUS commença par guérir cet homme , <em>en le prenant par la main</em> , & lui rendant aussitôt une parfaite santé par l'attouchement de sa chair sacrée, dont il sortoit une vertu toute divine pour la guérison des maladies. Car il ne crut pas être obligé de leur prouver qu'il lui étoit permis de guérir cet hydropique le jour du sabbat. Et il vouloit même que le miracle de sa guérison leur servit de preuve de ce qu'il leur avoit demandé.",

          "marges": [],

        {
          "texte": "J. C. vouloit guérir l'orgueil de ces Juifs, & sur-tout de ces Pharisiens , qui se regardant comme élevés au-dessus des autres <a class=\"page-inline\" href=\"page-518.html\" title=\"p. 518\">‖</a>par une profession de vie plus sainte , croyoient que les places les plus honorables leur étoient dues. Comme donc ils observoient avec un esprit & un œil malin les paroles & les œuvres du Fils de Dieu , le Fils de Dieu observoit aussi, mais dans un esprit de charité, & comme le vrai médecin de leurs ames, toute leur conduite , & leurs maladies, pour y apporter les remèdes les plus propres à les guerir. Etant invité, comme on l'a dit, à manger chez ce Pharisien, qui étoit un des principaux d'entre eux, il considéra l'ambition & la vanité avec laquelle chacun de ceux qui y étoient conviés, comme lui, s'empressoit <em>d'avoir les premières places.</em> Pour les détromper sur ce sujet, & pour les instruire en même-temps des véritables dispositions où ils devoient être , il ne voulut pas les reprendre en termes exprès de ce qu'il leur voyoit faire contre les règles de l'humilité , & même de l'honnêteté , de peur qu'une reprehension trop forte servît seulement à les choquer. Mais il établit une règle en général , de la manière dont on devoit se conduire dans tous les festins des noces où l'on étoit invité : & c'est-là ce que saint Luc appelle ici <em>une parabole</em> , c'est-à-dire , une image ou une figure, sous laquelle il leur faisoit voir la faute qu'ils commettoient actuellement , & la manière d'y remédier. Peut-être même que ces Pharisiens & ces autres Juifs ne faisoient pas si ouvertement paroître leur vanité dans le désir de ces préséances ; mais que JESUS-CHRIST , qui <em>considéroit</em> le fond de leur cœur , y vit par sa divine lumière cette secrète ambition qui les animoit. Et ainsi en leur proposant , comme il fit , cette parabole , il leur donnoit d'autant plus de lieu de rentrer en eux , & de l'écouter comme le vrai CHRIST , qu'ils demeuroie         {

      "fr": "Un de ceux qui étoient à table ayant entendu ces paroles , lui <a class=\"page-inline\" href=\"page-514.html\" title=\"p. 514\">‖</a>dit: Heureux celui qui mangera du pain dans le royaume de Dieu.",
      "note": [

          "marges": [],
          "p": 521
        },
        {
          "texte": "Ce que J. C. venoit de dire de la récompense que recevroient dans le ciel ceux qui auroient invité les pauvres & les misérables à manger chez eux , frappa un de ceux qui étoient présens, & il s'écria : <em>Heureux celui qui mangera du pain dans le royaume de Dieu !</em> C'est-à-dire, Heureux celui qui méritera d'être admis dans le céleste banquet , où Dieu même nourrira ses Saints d'une manière ineffable , & où il <em>les comblera de ces biens</em> incompréhensibles <a class=\"page-inline\" href=\"page-522.html\" title=\"p. 522\">‖</a>dont parle David , en les <em>faisant boire dans le torrent des plaisirs</em> tout spirituels <em>& divins</em> , qu'il tient en réserve dans <em>sa maison</em> pour ses élus ! Car le mot de <em>pain</em> , dont il est parlé ici, signifie dans le langage du Texte sacré , toute sorte de nourriture. Et le pain des Saints dans le ciel , sera Dieu même ; car ils seront tout remplis de Dieu , qui étant la source de tous les biens , <em>rassasiera</em> éternellement <em>la faim & la soif qu'ils ont eue de la justice</em> , selon qu'il le leur promet dans saint Matthieu. Rien n'étoit donc plus solide , que le sujet de l'exclamation que fit devant tout le monde l'un des conviés , qui pouvoit être un des disciples du Sauveur. Et le Fils de Dieu n'avoit garde de le contredire. Mais il prit occasion seulement de ce qu'il disoit , pour faire entendre à tous ceux qui étoient présens , que quelque grand que dut être le bonheur de ceux qui mangeoient à sa table dans son royaume , il y en avoit très-peu qui songeassent à s'en rendre dignes. C'est dans cette vue qu'il leur propose une nouvelle parabole , dont on a déjà expliqué une partie dans saint Matthieu.",

      "n": 18,

      "lat": "Et cœperunt simul omnes excusare. Primus dixit ei : Villam emi , & necesse habeo exire , & videre illam : rogo te habe me excusatum.",
      "fr": "Mais tous comme de concert, commencèrent à s'excuser. Le premier lui dit : J'ai acheté une terre , & il faut nécessairement que je l'aille voir : je vous supplie de m'excuser.",
      "note": [
        {
          "texte": "<em>Le premier lui dit : J'ai acheté une terre , & il faut nécessairement que je l'aille voir : je vous supplie de m'excuser. Le second lui dit : J'ai acheté cinq couples de bœufs , & je m'en vais les éprouver..... Et le troisième lui dit : J'ai épousé une femme , &c.</em>",
          "marges": [],
          "p": 522
        },
        {
          "texte": "C'est une chose qui paroît contre toute sorte de raison , & contre les règles les plus communes du commerce de la vie civile , que des gens qui ont été invités à un grand festin par une personne de considération , & qui d'abord ne s'en sont point excusés , refusent ensuite d'y venir sur des prétextes aussi légers que ceux dont il est parlé ici. On peut dire même , que les hommes ne sont point ordinairement si extravagans. Et c'est ce qui fait juger que le Fils de Dieu a voulu , en proposant aux Pharisiens & aux autres Juifs cette parabole , leur donner lieu de s'appliquer tout-d'un-coup à eux-mêmes la vérité de ce qu'elle leur marquoit ; étant rare qu'on vit arriver la chose selon le sens littéral de la figure. Nous ne nous arrêtons point à faire voir ce que peuvent signifier , selon un sens plus spirituel , ces prétextes <em>d'une terre</em> nouvellement <em>achetée</em> , qu'on se fait <em>une nécessité d'aller voir</em> ; de ces <em>cinq couples de bœufs qu'on est obligé d'aller éprouver</em> ; & de cette <em>femme avec laquelle on s'est marié depuis peu.</em> Il suffit d'entendre par là tous les différens obstacles qui empêchèrent les Juifs de recevoir la grâce de l'Evangile , & de participer au festin des noces de l'Epoux sacré de l'Eglise , qu'un Ancien appelle , <em>vitæ æternæ saturitatem</em> ; & qui empêchent encore aujour<a class=\"page-inline\" href=\"page-523.html\" title=\"p. 523\">‖</a>d'hui un grand nombre de Chrétiens invités à la table auguste , où J. C. est lui-même la nourriture des conviés , de se rendre dignes de ce céleste banquet. Ce sont toutes les attaches à la vie présente , les vaines inquiétudes pour les richesses , & la sensualité des plaisirs charnels : <em>Abierunt</em> , dit Tertullien , <em>in iis quæ concupierunt corde suo malo.</em>",
          "marges": [
            "Tertull. adverf. Marcion. l. 4. c. 31."
          ],
          "p": 522
        },
        {
          "texte": "<em>Le temps est court</em> , dit saint Paul. <em>Ce qui reste donc à faire , est que ceux mêmes qui ont des femmes soient comme n'en ayant point</em> , lorsqu'il s'agit de préférer leurs femmes à Dieu. <em>Que ceux qui achètent</em> se conduisent <em>comme ne possédant point</em> ; c'est-à-dire , que leur cœur ne soit point lui-même possédé des biens qu'ils achètent : & qu'enfin <em>ceux qui usent de ce monde soient comme n'en usant point</em> ; c'est-à-dire , qu'ils ne soient point attachés à l'usage même du monde qui leur est permis , y passant , pour le dire ainsi , sans s'y arrêter. Sur ce grand principe de saint Paul , il est aisé de juger de la cause véritable qui empêcha tous ces Juifs de participer aux noces de la nouvelle alliance , où ils étoient invités depuis tant de siècles par les promesses de Dieu & les oracles de tous les Prophètes ; & qui détourne encore à présent tant de Chrétiens de se préparer pour le festin auquel J. C. , les Apôtres & leurs successeurs les ont toujours invités. Ils ont honte apparemment de voir dans la parabole , qu'une <em>terre</em> , que quelques <em>bœufs</em> , & qu'une <em>femme</em> ayant eu la force sur l'esprit de ces conviés de les faire manquer à leur promesse , lorsqu'un très-petit délai leur auroit fait recouvrer sans aucune perte ce qu'ils désiroient. Mais ils ne s'aperçoivent pas que c'est d'eux-mêmes dont il s'agit , & que s'ils vouloient se priver pour peu de temps de ce qui s'oppose à leur vrai bonheur , ils ne seroient pas éternellement exclus du banquet céleste , auquel ils avoient été conviés.",

    {
      "n": 21,
      "p": 514,
      "lat": "Et reversus servus nuntiavit hæc domino suo. Tunc iratus paterfamilias, dixit servo suo : Exi citò in plateas & vicos civitatis , & pauperes ac debiles, & cœcos , & claudos introduc hùc.",
      "fr": "Le serviteur étant revenu rapporta tout ceci à son maître. Alors le père de famille se mit en colère , & dit à son serviteur : Allez vous-en vîtement dans les places & dans les rues de la ville, & amenez ici les pauvres, les estropiés, les aveugles, & les boiteux.",
      "note": [
        {
          "texte": "<em>Alors le père de famille se mit en colère , & dit à son serviteur : Allez-vous-en vîtement dans les places & dans les rues de la ville , & amenez ici les pauvres , les estropiés , &c.</em>",
          "marges": [],
          "p": 523
        },
        {
          "texte": "Saint Augustin & saint Grégoire le Grand ont regardé dans ces paroles , premièrement la vocation des plus pauvres d'entre les Juifs , & ensuite celle des Gentils. Dieu qui nous est figuré par ce <em>père de famille</em> , a abandonné les premiers d'entre son peuple , les Pharisiens , les Prêtres & les Docteurs de la loi , à cause de cet orgueil qui leur avoit inspiré du dégoût pour son festin : <em>Quia venire superbi renuunt , pauperes eliguntur</em> ; & c'est en cela que consiste <em>la colère</em> où il est dit <em>qu'il entra.</em> Car la colère de Dieu n'est point comme dans les hommes , un mouvement de passion , <a class=\"page-inline\" href=\"page-524.html\" title=\"p. 524\">‖</a>mais un effet très-équitable de sa justice, qui ne nous punit jamais en ce monde d'une manière plus redoutable , que lorsqu'il nous abandonne. Il laisse donc tous ces grands , tous ces savans , & tous ces faux justes dans l'illusion de leur fausse piété : <em>& il envoie son serviteur</em> ; c'est-à-dire , comme on peut l'entendre avec quelques Interprètes , & comme il semble que l'a entendu Tertullien , J. C. même , qui <em>s'est volontairement anéanti , jusqu'à prendre la forme & la nature de serviteur.</em> Mais saint Grégoire l'a expliqué des Apôtres & de tous les Prédicateurs évangéliques. Il sembloit que les Pharisiens , les Prêtres , les Docteurs & tous les premiers des Juifs devoient plutôt reconnoître le Messie , étant élevés au-dessus des autres par leur dignité , par leur science dans les Ecritures , & par cette piété dont ils faisoient une particulière profession ; car c'est en cela qu'ils étoient plus particulièrement conviés. Mais sur le refus que fait leur orgueil de reconnoître la visite du Seigneur , JESUS-CHRIST s'attache lui-même principalement à instruire les plus pauvres d'entre le peuple : <em>pauperes evangelizantur.</em> Et ensuite les Apôtres , & tous les autres disciples invitèrent à la grâce de l'Evangile , soit dans <em>la ville</em> même de Jérusalem , où ils prêchoient <em>dans les places & dans les rues</em> , soit dans le reste de la Judée , tous <em>les pauvres , les estropiés , les aveugles & les boiteux</em> ; c'est-à-dire , les pécheurs d'entre le peuple figurés par toutes ces sortes de malades ; parce que , comme dit saint Grégoire le Grand , les plus petits , & ceux que le monde méprise le plus , écoutent souvent d'autant plutôt la voix du Seigneur , qu'ils trouvent moins de plaisirs qui les attachent au monde.",

          ],
          "p": 523
        },

          "marges": [
            "Rom. 11. 25."
          ],
          "p": 524
        },
        {
          "texte": "Il est remarquable que le serviteur est averti de <em>forcer</em> ces sortes de gens <em>d'entrer.</em> Mais entre-t-on donc dans le service de J. C. malgré soi ? Et a-t-il fallu user de violence envers les Gentils pour les faire entrer dans la salle du festin ? Le Fils de Dieu dit ailleurs : Que <em>le royaume des cieux se prend par violence , & que ce sont les violens qui l'emportent.</em> Que fait donc la grâce de l'Evangile ? Elle force en quelque sorte les pécheurs <em>à entrer</em> dans ce royaume , non en contraignant leur volonté , mais en les portant par un effet de l'amour de Dieu qui commence à les animer , à se faire tous les jours une sainte violence à eux-mêmes , pour rompre leurs mauvaises habitudes , & tous les liens par lesquels le monde , le péché , & le démon s'efforcent de les retenir. Car ni les Gentils qui sont entrés au commencement dans l'Eglise , ni ceux d'entre les Chrétiens qui reviennent du péché à J. C. par la pénitence , ne l'ont pu faire autrefois , & ne peuvent point le faire encore , qu'en usant d'une grande violence contre eux-mêmes : ce qui a fait dire auparavant au Sauveur du monde : <em>Faites effort pour entre par la porte étroite</em> ; parce que c'est une chose difficile , & qu'on n'obtient pas sans beaucoup de peine.",
          "marges": [
            "Matt. 11. 12.",
            "Luc. 13. 24."
          ],
          "p": 525
        },
        {
          "texte": "Mais saint Grégoire explique d'une autre manière cet ordre que le père de famille donna à son serviteur , de <em>forcer d'entrer</em> ceux qu'il trouveroit dans les chemins , & le long des haies. Car il dit , qu'il y en a quelques-uns qui sont appelés de telle sorte , qu'on peut dire qu'ils sont forcés : <em>Quidam verò sic vocantur , ut etiam compellantur.</em> Et ce sont ceux à l'égard desquels Dieu use de différentes afflictions , pour les détacher du monde , & de leurs plaisirs , qu'ils aiment avec trop d'ardeur. Il les frappe , pour parler avec saint Grégoire , par l'adversité ; il s'oppose à la jouissance de ce qu'ils recherchent ; & les arrachant en quelque façon au monde qu'il rend contraire à tous leurs désirs , il les oblige de revenir avec confusion & avec humilité à leur Créateur , dont ils s'étoient éloignés par leur orgueil pour se joindre à son ennemi. Saul ne fut-il pas <em>forcé</em> , pour le dire ainsi , lorsqu'étant plein de menaces , & ne respirant que le sang des disciples du Seigneur , il fut frappé tout-d'un-coup d'une lumière du ciel , & renversé par terre ; & que tout tremblant & effrayé par la voix qui lui dit : <em>Je suis</em> JESUS <em>que vous persécutez , il vous est dur de regimber contre l'aiguillon</em> ; il témoigna au Seigneur qu'il étoit prêt de faire ce qu'il voudroit ? On peut dire encore , qu'il a comme <em>forcé</em> les Gentils <em>d'entrer</em> dans l'Eglise , par la multi<a class=\"page-inline\" href=\"page-526.html\" title=\"p. 526\">‖</a>tude des miracles qui acquirent une si grande autorité aux Apôtres & aux autres Prédicateurs apostoliques des premiers siècles ; par cette foule de Martyrs qui versoient leur sang pour la foi aussi gaiement que s'ils eussent été invités aux noces ; & par la force admirable des apologies des saints Docteurs , qui confondoient en mille manières l'aveuglement du paganisme.",
          "marges": [

          "p": 525
        },
        {
          "texte": "Mais qui ne craindra , entendant prononcer au père de famille cette dernière parole : <em>Je vous assure que nul de ces hommes que j'avois conviés , ne goûtera de mon souper ?</em> C'est-à-dire , nul de ces hommes superbes , de ces Pharisiens , de ces Prêtres , de ces Docteurs de la loi , qui <em>ont rejeté le conseil de Dieu sur eux</em> , & méprisé de venir à moi lorsque je les appelois , ne participera aux <em>biens que j'ai préparés à ceux qui m'aiment , & que ni l'œil n'a point vus , ni l'oreille n'a point entendus , ni le cœur de l'homme n'a jamais conçus.</em> Ainsi que personne ne méprise la voix du Seigneur , dit saint Grégoire , de peur que si étant appelé il s'excuse de venir , il ne veuille entrer un jour , & qu'il ne le puisse pas : <em>Nemo contemnat , ne dum vocatus excusat , cùm voluerit intrare , non valeat.</em>",

      "fr": "Car qui est celui d'entre vous , qui voulant bâtir une tour, ne suppure auparavant en repos & à loisir la dépense qui y sera nécessaire , <em>pour voir</em> s'il aura de quoi l'achever ?",
      "note": [
        {
          "texte": "<em>Car qui est celui d'entre vous , qui voulant bâtir une tour , ne suppute auparavant en repos & à loisir la dépense qui y sera nécessaire , pour voir s'il aura de quoi l'achever ?</em>",
          "marges": [],
          "p": 526
        },
        {
          "texte": "Le Fils de Dieu a déclaré dans les versets précédens , que pour être son disciple , il falloit <em>haïr son père & sa mère , sa femme & ses enfans , & sa propre vie</em> ; c'est-à-dire , comme l'explique saint Matthieu , qu'il falloit aimer J. C. , plus que ses proches , & ce qu'on a de plus cher au monde qui est la vie ; & être prêt de renoncer à toutes ces choses , s'il est nécessaire , pour ne se pas éloigner de son Créateur. Il propose maintenant deux comparaisons ou deux paraboles , qui servent à appuyer une doctrine si opposée à notre amour propre. Or dans ces comparaisons , il ne faut pas , selon la remarque des Interprètes , s'attacher trop à trouver un entier rapport entre les parties de la figure & celles de la vérité qu'elles représentent : mais il suffit d'envisager principalement la fin pour laquelle chaque parabole est proposée. Ce que J. C. nous veut faire regarder en celles-ci , est l'imprudence d'une personne qui s'engage légérement dans quelque entreprise , sans en avoir bien examiné auparavant toutes les suites. Ainsi , il est ridicule qu'un homme entreprenne de faire un grand bâtiment , comme est celui <em>d'une tour</em> , sans avoir compté ce qu'il a d'argent , & s'il sera en état de fournir à cette dépense ; puisqu'il passera pour fou , s'il <em>commence cette tour sans</em> <a class=\"page-inline\" href=\"page-527.html\" title=\"p. 527\">‖</a>la pouvoir achever.</em> Il en est de même d'un Prince qui s'engage à faire la guerre à un autre. Il faut qu'il sache , avant toutes choses, quelles sont les forces de son ennemi ; & qu'il n'entreprenne pas de l'aller combattre avec des troupes trop inégales.",

        },
        {
          "texte": "On a déjà vu l'explication de ces paroles de J. C. dans saint Matthieu , où il les adresse particulièrement aux Apôtres , qui devoient être par leur sagesse , par leur doctrine , & par l'exemple de leur piété , comme le sel de la terre. Mais il paroît par ce qui précède , & qui regarde généralement tous les Chrétiens , que ce qu'il dit en ce lieu du <em>sel</em> , se doit aussi appliquer à tous les fidelles. C'est une sentence fort commune , que ce qui est excellent venant à être corrompu , sa corruption est la plus grande de toutes : <em>Corruptio optimi pessima.</em> Le sel tant qu'il conserve sa nature de sel , est une chose excellente. Mais s'il change de nature il devient pire que <em>la terre</em> & que <em>le fumier.</em> Ainsi il n'est rien de plus excellent ni de plus grand qu'un Chrétien , quand sa vie répond à sa profession. Mais il n'y a rien de pire , ni qui soit plus criminel que ce Chrétien même , s'il l'est seulement de nom , & si sa vie est indigne du nom qu'il porte. Un Chrétien doit vivre de telle sorte , que ceux mêmes qui sont hors l'Eglise soient édifiés de sa conduite : & c'est en cela qu'il est un sel. Combien donc est-il coupable , lorsqu'au lieu de les édifier , il les porte même à blasphémer le Seigneur qu'il sert ? Ainsi David , ce grand serviteur de Dieu , étant tombé dans deux crimes très-énormes , dans un adultère & un homicide , un Prophète lui prononça cet arrêt : Que l'enfant qui lui étoit né de son adultère , & qu'il aimoit tendrement , mourroit sans rémission , à cause qu'il avoit fait blasphémer les ennemis du Seigneur. Si donc <em>le sel perd sa force</em> , dit JESUS-CHRIST , <em>avec quoi l'assaisonnera-t-on</em> lui-même , & à quoi peut-il être bon ; puisqu'il <em>n'est propre ni pour la terre</em> , qu'il rend stérile par sa nature , <em>ni pour</em> être au moins mêlé avec <em>le fumier</em> , puisqu'il ne pourroit que le gâter en l'empêchant d'engraisser la terre ? Ainsi il ne reste plus que de <em>le j
