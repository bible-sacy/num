e lorsque vous y avez obéi; votre indignité & la vue de vos péchés qui vous effrayent présentement, ne pourront aussi empêcher l'effet de votre vocation. Vous êtes pécheur, comme vous le dites; & vous faites bien de reconnoître ce que vous êtes par vous-même: mais je vous ferai devenir par ma grâce <em>pécheur d'hommes</em>, de pêcheur que vous êtes de poissons: Et ce sera, non pour les tuer, mais pour leur donner la vie, & une vie de grâce & de foi, que vous les prendrez dans vos filets.", "marges": []}, {"versets": [], "texte": "J. C. en lui parlant de la sorte, ne l'appela pas encore, mais l'assura seulement de l'emploi auquel il le destinoit. Car quoique saint Luc ajoute aussitôt, Que Pierre & André, Jacque & Jean <em>ayant ramené leurs barques à bord, quittèrent tout & le suivirent</em>, il est visible par saint Matthieu & par saint Marc, qu'ils n'abandonnèrent toutes choses pour suivre le Fils de Dieu, que lorsqu'il les appela d'une manière plus particulière, & leur commanda effectivement de le suivre. Ainsi saint Luc a passé cette circonstance, ayant rapporté tout-d'un-coup ce qu'ils ne firent que depuis, soit le même jour, ou plutôt quelques jours après.", "marges": []}, {"versets": [16], "texte": "<em>Mais il se retiroit dans le désert, & il y prioit.</em>", "marges": []}], "texteGeneral": []}};
