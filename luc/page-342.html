gustin, & d'autres encore plus anciens qu'eux, est celui-ci; que Mathan descendu de Salomon mourut, ayant eu un fils nommé Jacob; que la veuve de Mathan fut épousée par Melchi, qui en eut un fils nommé <em>Héli</em>, lequel est celui dont parle saint Luc: Qu'Héli étant mort sans enfans, Jacob qui étoit son frère utérin épousa sa femme, selon l'ordonnance de la loi, qui vouloit qu'un frère suscitât un héritier à son frère en épousant sa veuve, & en eut <em>Joseph</em>, l'époux de la sainte Vierge, qui fut appelé le fils d'Héli, selon la coutume légale, quoiqu'il fût véritablement, selon la nature, le fils de Jacob. Ainsi saint Luc appelle Joseph <em>fils d'Héli</em>, parce qu'il l'étoit selon l'ordonnance & l'usage de la loi; & saint Matthieu l'appelle fils de Jacob, parce qu'il l'étoit par la voie de la génération.", "marges": ["Ambr. in Luc. l. 3. initio.", "Euseb. hist. l. 1. c. 7.", "Ambr. in Luc. c. 3. v. 14. to. 3. col. 45.", "August. Retract. l. 2. c. 7.", "Hieron. in Matt. n. 1.", "Deut. 25. 5."]}, {"versets": [31], "texte": "<em>Qui fut</em> fils <em>de Nathan, qui fut</em> fils <em>de David.</em>", "marges": []}, {"versets": [], "texte": "On peut remarquer avec saint Ambroise, que les ancêtres de J. C. sont différens jusques ici dans la généalogie rapportée par saint Matthieu, & dans celle de saint Luc, parce que l'un a nommé les descendans de Nathan, & l'autre les descendans de", "marges": ["Ambr. ut supr."]}], "texteGeneral": []}};
