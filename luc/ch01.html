ent donc, & ils s'en abstiennent en effet, mais avec le secours du Seigneur. Car ce qui est impossible à la nature de l'homme par elle-même, lui <a class=\"page-inline\" href=\"page-238.html\" title=\"p. 238\">‖</a>devient possible par la grâce de son Dieu, qui la rend pure & exempte de ces taches criminelles.",

          "texte": "Que si l'on demande en quoi consistoit la <em>justice</em> de Zacharie & d'Elisabeth, saint Luc l'explique, lorsqu'il ajoute : Qu'ils <em>marchoient dans tous les commandemens & les ordonnances du Seigneur, d'une manière irrépréhensible.</em> Le premier de ces commandemens étoit celui qui les obligeoit d'aimer Dieu de tout leur cœur, & sans lequel ils n'auroient pu observer utilement tous les autres. Ainsi puisqu'ils marchoient dans tous les divins préceptes, qui pouvoient <em>les rendre justes</em> devant Dieu, il s'ensuit qu'ils marchoient, comme l'ordonne saint Paul, dans la charité & dans l'amour. Ils <em>marchoient</em> donc dans tous ces commandemens, c'est-à-dire, qu'ils ne s'arrêtoient point ; mais qu'ils s'avançoient toujours, en <em>devenant justes</em> de plus en plus par la pratique fidelle , non pas seulement de quelques-uns de ces préceptes, mais <em>de tous</em> ; parce que, comme dit saint Jacques, <em>Quiconque viole la loi en un seul point, quand il l'auroit gardée dans tout le reste , devient coupable comme l'ayant toute violée.</em> Il ne faut pas néanmoins s'imaginer que ces deux personnes fussent <em>justes devant Dieu</em> d'une justice si parfaite qu'elles ne commissent aucun péché. Car , comme dit saint Augustin sur ce sujet même, il n'y a aucun fidelle dans l'Eglise, quelque avancé qu'il puisse être dans la voie de la justice, qui ose dire , Qu'il n'a pas besoin d'adresser à Dieu cette prière, <em>Pardonnez-nous nos péchés</em> ; & qui puisse se persuader qu'il est exempt de tout péché ; parce qu'il se séduiroit visiblement, & que la vérité ne feroit point dans son cœur , ni dans sa bouche, selon que l'a déclaré celui de tous les Apôtres que J. C. témoignoit aimer le mieux , & qui paroissoit aussi le plus plein de son amour. Lors donc qu'il est dit du père & de la mère du saint Précurseur, Qu'ils marchoient dans tous les commandemens du Seigneur <em>d'une manière irrépréhensible</em> ; on doit entendre avec le même S. Augustin, qu'ils étoient exempts , non de toutes sortes de péché , où l'humaine fragilité expose même les plus justes, mais des péchés considérables, dont les justes sont exempts. En effet , comme il dit encore , Zacharie étant du nombre des Prêtres de Dieu , étoit obligé par la loi d'offrir au Seigneur le sacrifice, premièrement pour ses péchés propres , & ensuite pour ceux du peuple ; & par conséquent , les sacrifices des victimes des animaux qu'il leur étoit ordonné d'offrir pour eux-mêmes , devoient les convaincre qu'ils n'étoient point sans péché : <em>Per sacrificia victimarum animalium convincebantur sacerdotes sine peccato non esse, qui pro suis peccatis jubebantur offerre.</em>",

    {

      "note": [
        {
          "texte": "<em>Et un Ange du Seigneur lui apparut , se tenant debout à la droite de l'autel des parfums. Zacharie le voyant en fut tout troublé , & la frayeur le saisit. Mais l'Ange lui dit : Ne craignez point , &c.</em>",
          "marges": [],
          "p": 240
        },
        {
          "texte": "Cet Ange dont il est parlé ici , étoit saint Gabriel. Et les Anciens ont regardé comme une gloire toute singulière de S. Jean-Baptiste , de ce qu'il fut promis à son père dans sa vieillesse, & à sa mère , nonobstant sa stérilité & son grand âge , par le même Ange qui fut envoyé à la sainte Vierge , pour lui annoncer la conception & la naissance du Seigneur. <em>Il s'apparut</em> tout-d'un-coup à Zacharie ; c'est-à-dire , que celui qui par sa nature toute spirituelle est invisible aux yeux du corps , se fit voir sous une forme extérieure à ce saint Prêtre. Car il n'est pas en notre puissance de voir ces esprits célestes , quand nous le voulons ; mais ils peuvent nous apparoître lorsque Dieu le leur permet ou le leur ordonne. Cet Ange apparoît à Zacharie , <em>à la droite de l'autel des parfums</em> , pour marquer , selon la pensée de saint Ambroise , qu'il lui apportoit une nouvelle avantageuse , & qui devoit être pour lui comme un gage de la divine miséricorde. Car <em>la droite</em> nous figure dans les livres saints , quelque chose de favorable. <em>Le Seigneur est à ma droite</em> , disoit autrefois le roi Prophète , <em>afin que je ne sois point ébranlé.</em> Nous ne devons point douter , comme dit encore le même Saint , que les Anges n'assistent aussi , quoique d'une manière invisible , près de nos autels , lorsque l'on n'y offre pas seulement des parfums , mais que J. C. même y est immolé. Et il seroit à souhaiter , qu'on y put voir le profond respect avec lequel ces esprits célestes assistent à cette immolation du divin Agneau : l'on seroit sans doute étonné du peu de foi des peuples fidelles , qui ont l'avantage d'en approcher ; sur-tout si l'on se souvient , que l'ancien peuple d'Israël n'osoit même entrer dans la partie du temple où étoit placé l'autel des parfums , quoiqu'il ne fut qu'une foible image de la sainteté de l'autel où se fait l'immolation Eucharistique.",

        {
          "texte": "Le <em>trouble</em> extraordinaire & la <em>frayeur</em> que la vue de l'Ange causa au saint Prêtre dont nous parlons , put bien venir en partie selon quelques-uns , de la pensée qu'avoient les Juifs , qu'on devoit mourir quand avoit vu un Ange , fondés sur cette parole que Dieu avoit dite à Moyse leur législateur : Que <em>l'homme qui l'auroit vu ne vivroit point.</em> Mais l'exemple de Daniel , qui étant seul vit aussi un Ange sous la figure d'un homme tout éclatant de lumière , fait connoître combien ces sortes d'apparitions des puissances supérieures sont capables par elles-mêmes de nous effrayer , <a class=\"page-inline\" href=\"page-241.html\" title=\"p. 241\">‖</a>effrayer. Car ce Prophète témoigne que la vue de l'Ange le saisit de telle sorte , que son visage en fut tout changé, qu'il ne lui resta aucune force , & qu'il demeura couché par terre.",

          "texte": "Mais d'où vient que Dieu envoie l'Ange Gabriel à Zacharie pour lui annoncer la naissance miraculeuse de saint Jean ? Et pourquoi ne fait-il point ce grand miracle, de rendre mère Elisabeth malgré sa stérilité & sa vieillesse , sans faire apparoître un Ange, auquel même Zacharie ne devoit point ajouter de foi ? C'est qu'il s'agissoit de faire voir les premiers signes de l'accomplissement des promesses que Dieu avoit faites aux Patriarches & des anciennes prédictions touchant le Messie. Ainsi il falloit que la naissance de son Précurseur fut annoncée ; & qu'elle le fut avec de telles circonstances , que tout y parut miraculeux , & que l'incrédulité de Zacharie servît même, comme on le verra ensuite , à relever davantage aux yeux du peuple une si grande merveille ; afin qu'ils y fissent plus d'attention , ou qu'au moins ils fussent plus inexcusables s'ils ne vouloient pas connoître à de tels signes les approches de la délivrance d'Israël.",

        },

          "texte": "Le saint Prophète Daniel ayant été tout consterné par la vue de l'Ange dont on a parlé , cet Ange lui dit de ne point craindre, parce que dès le premier jour qu'il avoit appliqué son cœur à connoître la volonté de son Dieu , & à s'affliger en sa présence, ses prières avoient été exaucées. La même chose arrive ici maintenant à l'égard de Zacharie. Car au milieu de son trouble & de sa frayeur , l'Ange lui dit : <em>Ne craignez point , Zacharie, parce que votre prière a été exaucée.</em> Ce saint homme avoit demandé à Dieu avec instance , qu'il bénit son mariage & qu'il lui donnât un fils. Il crut sans doute que le Seigneur avoit rejeté sa prière , puisque sa femme , aussi-bien que lui, étoit avancée en âge , & hors d'état d'avoir des enfans. Cependant il est vrai de dire de lui, comme du prophète Daniel , que dès le premier jour qu'il avoit appliqué son cœur pour s'affliger en la présence de Dieu , <em>sa prière avoit été exaucée</em>, quoiqu'il n'en vît pas alors l'accomplissement. Car Dieu a ses temps & ses momens , selon qu'il est dit dans l'Evangile ; & ils ne s'accordent pas toujours avec ceux des hommes, dont il est même bien-aise de guérir la précipitation & l'impatience par l'humble soumission avec laquelle il veut qu'ils attendent l'exécution de ses volontés. Ainsi tel prie qui est exaucé , quoiqu'il ne croie pas ; parce que sa prière , bien qu'exaucée, ne doit avoir son effet que dans son temps , qui n'est pas souvent celui du désir de l'homme, mais infailliblement celui de la volonté de Dieu.",

        },
        {

          "p": 242

        {
          "texte": "Saint Augustin , avec plusieurs Interprètes anciens & nouveaux, explique encore d'une autre manière ce qui est dit en ce lieu de la prière de Zacharie , qui fut exaucée. Il dit qu'il ne paroît point vraisemblable, que dans le temps que ce Prêtre devoit offrir ses prières pour les péchés de tout le peuple , ou pour son salut & sa rédemption , il ait pu , étant juste comme il étoit , & dans un âge si avancé , & ayant sa femme avancée en âge aussi-bien que lui, négliger en quelque sorte ce qui regardoit les vœux publics , & prier pour son intérêt particulier , afin d'avoir des enfans. Et il ajoute que cela est d'autant moins croyable, que nul ne prie pour recevoir ce qu'il n'a nulle espérance d'obtenir : comme il paroît en effet qu'il étoit alors si absolument éloigné d'espérer d'avoir des enfans , qu'il refusa même d'ajouter foi à la promesse que lui en fit l'Ange. Ainsi lorsqu'on lui déclare que <em>sa prière est exaucée</em> , il faut entendre , dit saint Augustin , la prière qu'il avoit faite pour le peuple. Et comme ce peuple ne pouvoit attendre son salut, sa rédemption , & la rémission de ses péchés, que du CHRIST , on annonçoit à Zacharie la naissance d'un fils qui devoit être le précurseur de ce CHRIST & de ce Sauveur d'Israël.",

          "texte": "<em>La joie</em> que l'on promettoit à Zacharie à cause de la naissance d'un fils, n'étoit pas pour lui seulement, mais encore pour <em>beaucoup</em> d'autres ; parce que ce fils devant être un grand Prophète, & le précurseur du <em>Prophète</em> par excellence que Moyse avoit promis à son peuple, tout Israël avoit intérêt à sa naissance, qui lui feroit un gage assuré de son salut. On doit se réjouir, dit S. Ambroise, de la naissance des Saints, parce qu'ils sont remplis de grâces, pour les répandre sur les autres, & pour devenir une source de salut pour plusieurs. Combien donc a dû être dans la joie tout Israël, mais dans une joie spirituelle, & éloignée des dissolutions du siècle, lorsqu'après avoir été si long-temps dans les ténèbres & dans l'ombre de la mort, ils virent enfin luire dans la naissance du saint Précurseur de J. C. les prémices d'une lumière, qui, comme l'aurore, précédoit le lever du divin Soleil de justice ? L'Evangéliste rendant la raison de cette joie extraordinaire que devoit causer la naissance de saint Jean, ajoute : <em>Car il sera grand devant le Seigneur.</em> Et saint Ambroise nous explique en quoi consistoit cette grandeur, lorsqu'il dit, Que <em>c'est être grand devant le Seigneur</em>, de renoncer à la vaine grandeur du siècle, à ses plaisirs & à ses pompes ; d'avoir un cœur grand pour Dieu & pour la vertu , & resserré pour le monde ; d'avoir l'esprit & les sens, non d'un enfant, mais d'un homme parfait, qui ne juge pas des choses selon l'idée basse de l'enfance , mais selon la vérité, & qui ne se laisse point séduire par toutes les illusions de la chair & du démon.",

        {
          "texte": "Il devoit dans tout le cours de sa vie s'abstenir du vin & de toute autre liqueur qui peut enivrer, selon que les Pères ont entendu ces paroles : <em>Vinum & siceram non bibet.</em> Et en cela sa parfaite consécration au Seigneur , & sa rigoureuse abstinence étoient fort bien désignées. Car c'est ainsi que les vrais Nazaréens étoient obligés, par la loi de Dieu, d'en user dans tout le temps qu'ils s'étoient voués & consacrés au Seigneur. Et Dieu <a class=\"page-inline\" href=\"page-244.html\" title=\"p. 244\">‖</a>faisoit voir ainsi par l'exemple de saint Jean , que la pénitence ne contribuoit pas peu à rendre un homme <em>grand</em> devant lui ; puisqu'en mortifiant sa chair , elle servoit à purifier davantage son esprit, & à le rendre plus digne d'approcher de lui. Mais saint Luc en ajoutant qu'il <em>seroit rempli du Saint-Esprit dès le ventre de sa mère</em>, nous dit en un mot quel a été le principe de sa sainteté & de sa grandeur. Car comment celui que le Saint-Esprit remplissoit , lorsqu'il étoit encore renfermé dans le ventre de sa mère , auroit-il vécu ensuite par l'esprit du monde ? Il avoit , dit saint Ambroise , l'esprit de grâce, avant presque que d'avoir l'esprit de vie ; puisqu'on ne vit qu'à demi avant que de naître à la lumière du monde. Saint Cyprien & plusieurs Pères ont entendu , comme saint Ambroise , que Jean-Baptiste fut rempli du Saint-Esprit, avant même qu'il fût né : & il est visible qu'on ne peut point expliquer , comme ont fait quelques Interprètes, ces paroles de l'Evangile, <em>Adhuc ex utero matris suæ</em> , aussitôt qu'il fut sorti du sein de sa mère ; le mot <em>adhuc</em> déterminant tout-à-fait le sens que l'on a marqué. Ainsi , quoique saint Augustin ait dit au sujet de Jérémie, comme on l'a marqué en l'expliquant, que nul ne renaît véritablement à la grâce, qui ne soit auparavant né dans le monde ; il a pu sans doute excepter de cette règle générale celui que Dieu même en a excepté , lorsqu'il a dit par la bouche de son Ange : <em>Il sera rempli du Saint-Esprit dès le ventre de sa mère.</em> Car , comme dit saint Ambroise , où se trouve l'esprit de grâce , là il ne peut rien manquer ; & celui dans le cœur duquel le Saint-Esprit a été répandu est vraiment <em>rempli</em>, puisqu'il a la plénitude de toutes sortes de vertus.",

          "texte": "On pourroit d'abord s'imaginer , selon que les hérétiques l'ont soutenu , qu'il y avoit quelque défiance dans ces paroles de la sainte Vierge , & qu'elle tomba dans la même faute que Zacharie père de saint Jean , n'ayant pas cru l'Ange non plus que lui , lorsqu'il parloit de la part de Dieu. Mais à les bien considérer , dit saint Ambroise , on trouvera une extrême différence entre sa réponse & celle de Zacharie. Celui-ci ne crut point l'Ange , parce qu'il envisagea plus son grand âge & la vieillesse de sa femme , que la volonté & la puissance de Dieu. La Vierge au contraire étant revenue de son premier trouble , après avoir reconnu que c'étoit un Ange qui lui parloit , ne douta point de la <a class=\"page-inline\" href=\"page-259.html\" title=\"p. 259\">‖</a>vérité de sa parole , mais elle voulut seulement savoir la manière dont s'accompliroit le grand mystère qu'on lui annonçoit. Car ayant vécu , & voulant vivre à l'avenir avec Joseph son époux , comme si elle n'avoit pas été mariée , il lui étoit important & nécessaire de connoître de quelle sorte elle <em>concevroit ce fils</em> qu'on lui promettoit , qui devoit être <em>le Fils du Très-haut</em> , le <em>Roi</em> & le <em>Sauveur</em> de son peuple : <em>Non est Virginis Mariæ diffidentia</em> , dit saint Augustin. <em>Quod enim futurum esse certa erat , modum quâ fieret inquirebat.</em> Elle ne douta donc pas de l'effet , mais du moyen. Car une conception aussi incroyable & aussi inouie que celle de J. C. , a dû sans doute être expliquée avant que d'être crue par une vierge : <em>Incredibilis & inaudita generatio antè audiri debuit , ut crederetur. Virginem parere divini est signum mysterii , non humani.</em> Il avoit été prédit par un Prophète , Qu'<em>une Vierge concevroit & enfanteroit un Fils</em> ; ce que Marie pouvoit bien y avoir lu : mais elle n'y avoit pas lu comment cela se feroit , parce qu'il n'avoit point été révélé à ce Prophète , quoique si grand & si éclairé. C'étoit un mystère élevé au-dessus de l'homme , & réservé à être éclairci par un Ange.",

          "texte": "C'est le sentiment de toute l'antiquité , que le moment même auquel Marie consentit à l'opération de ce grand mystère en elle , fut celui de la conception de J. C. Et Tertullien comparant le premier Adam avec le second , Eve avec Marie , & le serpent avec l'ange Gabriel , dit : Que comme la terre de laquelle le premier Adam fut formé par les mains de Dieu , étoit encore vierge , le second Adam qui est J. C. fut formé de même dans ce moment de la terre , c'est-à-dire , de la chair d'une vierge , par la vertu toute-puissante du Seigneur. « Et Dieu voulut , continue-t-il , recouvrer son image & sa ressemblance » par les mêmes voies par lesquelles le démon s'en étoit rendu » le maître. Car comme une parole étant entrée dans Eve » lorsqu'elle étoit encore vierge , lui avoit donné la mort , il » falloit aussi qu'une parole , mais une parole divine , entrât » dans Marie toujours vierge , pour être en elle une source & » un principe de vie , afin que le sexe qui avoit servi pour perdre les hommes , servît de même pour les sauver. Eve avoit » cru au serpent : & Marie crut à Gabriel. Mais ce qui fut un » effet funeste de la crédulité de l'un , fut effacé par la foi salutaire de l'autre. Au lieu donc que la parole du démon ne fit » concevoir à Eve que les douleurs de l'enfantement , & un enfant fratricide , la parole du Seigneur fit concevoir à Marie » celui qui devoit sauver un jour son propre frère selon la » chair , c'est-à-dire Israël , devenu son meurtrier ».",

        },
        {
          "texte": "« Mais quelle est donc cette humilité si sublime & si divine , » s'écrie saint Bernard , qui ne se laisse point emporter par les <a class=\"page-inline\" href=\"page-264.html\" title=\"p. 264\">‖</a>» honneurs , & à qui la gloire n'est point un sujet d'élèvement ? » Marie entend dire qu'elle est choisie pour être la mère de » Dieu : & elle se nomme sa servante. Ce n'est pas une grande » vertu d'être humble dans l'abaissement. Mais c'en est une » très-grande & très-rare de conserver l'humilité dans les honneurs. Il ajoute : Si l'Eglise trompée peut-être par quelque » apparence de vertu qu'elle voit en moi , jette les yeux sur » un homme aussi misérable que je suis , pour m'élever à quelque petit degré d'honneur , Dieu le permettant ainsi à cause » de mes péchés , ou de ceux des personnes qu'il soumet à ma » conduite ; dans l'instant je perds de vue ce que j'ai été , pour » ne me plus regarder que selon l'idée avantageuse qu'en ont » les hommes , qui ne voient pas le fond de mon cœur. Ecoutons donc , nous tous qui sommes sujets à cette foiblesse , ce » que répondit alors celle qui se voyant élevée à la dignité de » Mère de Dieu , étant toujours également humble , dit à l'Ange : Qu'elle <em>étoit la servante du Seigneur : Qu'il me soit fait</em> , » ajoute-t-elle , <em>selon votre parole</em> ; c'est-à-dire , Que <em>le Verbe » qui étoit en Dieu au commencement</em> , se fasse chair de ma chair : » <em>Verbum quod erat in principio apud Deum , fiat caro de carne » mea</em> ».",
          "marges": [

          "p": 263
        },
        {
          "texte": "Qu'on ne dise pas que la sainte Vierge en donnant son consentement pour l'Incarnation du Verbe n'a rien fait de grand & de difficile , puisqu'il lui étoit si glorieux d'entrer ainsi tout-d'un-coup dans cette divine alliance. C'est en juger , selon la lumière de l'homme superbe , qui par lui-même se porte toujours à ce qu'il y a de plus élevé. Car plus cette dignité de Mère de Dieu qu'on présentoit à Marie , étoit élevée au-dessus de tout ce qu'il y avoit de plus grand dans l'Univers , plus l'humilité dans laquelle le Seigneur l'avoit affermie , à proportion de cette gloire éminente qu'il lui destinoit , la porta à s'anéantir dans la vue de sa propre indignité. Ainsi le comble de la gloire de la sainte Vierge a été , pour parler ainsi , comme la mesure de l'humilité la plus profonde où elle entra pour toujours. Et il fallut que sa foi & l'obéissance très-parfaite qu'elle rendoit au Seigneur lui fit une espèce de violence pour consentir , étant aussi humble qu'elle étoit , à recevoir cette qualité de Mère de Dieu , lorsqu'elle se regardoit véritablement comme <em>sa servante.</em> C'est pourquoi on ne doit pas s'étonner si quelques Saints ont relevé avec tant d'éloges ce consentement qu'elle donna à la fin à l'Ange : O Vierge bienheureuse , s'écrie saint Bernard , pourquoi tardez-vous , pourquoi craignez-vous ? Que votre humilité prenne enfin <a class=\"page-inline\" href=\"page-265.html\" title=\"p. 265\">‖</a>une sainte hardiesse , & que votre modestie se laisse vaincre. Voici celui qui est désiré par toutes les nations , qui frappe à votre porte. Levez-vous , courez , & ouvrez au Tout-puissant. Si donc les Saints parloient de la sorte , c'est qu'ils connoissent beaucoup mieux que nous , les effets d'une humilité aussi profonde qu'étoit celle de la sainte Vierge. C'est qu'ils entroient mieux que nous dans les sentimens de la plus humble de toutes les créatures , qui se voyoit élevée en gloire au-dessus de tous les Anges.",

          "texte": "C'est un sentiment tout-à-fait indigne de la sainteté & de la foi de la sainte Vierge , de dire , comme quelques-uns ont fait , qu'elle se hâte d'aller voir Elisabeth , pour connoître la vérité de ce que l'Ange lui avoit dit touchant sa grossesse miraculeuse. Ainsi ce n'étoit en aucune sorte , dit saint Ambroise , par un défaut de créance , ni par quelque doute qui lui restât dans l'esprit sur ce que l'Ange venoit de lui déclarer , qu'elle témoigna de l'empressement pour aller rendre visite à sa cousine. Mais elle agit en cela par un mouvement du Saint-Esprit , qui la conduisoit intérieurement chez Elisabeth , afin que le Fils de Dieu qui s'étoit déjà incarné en elle , sanctifiât par sa présence son Précurseur , qui étoit encore enfermé dans les entrailles de sa mère. Elle y alla par un sentiment de la joie qu'elle eut , de ce qu'il avoit plu à Dieu de lever l'opprobre de la stérilité d'une <a class=\"page-inline\" href=\"page-266.html\" title=\"p. 266\">‖</a>personne qui lui étoit chère. Enfin la charité la pressa d'aller rendre à la mère du saint Précurseur de JESUS-CHRIST les assistances dont elle pouvoit avoir besoin dans sa grossesse , à cause de ce grand âge où elle étoit. Elle va donc <em>dans les montagnes</em> , qui étoient celles de la Judée , & qui commençant , selon saint Jérôme , depuis Emmaüs , ou Nicopolis , s'élevoient insensiblement d'un côté jusqu'à la montagne des Oliviers , & d'un autre vers le midi de Jérusalem , jusqu'à la ville d'Hébron. Ce fut-là que la sainte Vierge se hâta d'aller <em>en une ville de la tribu de Juda</em> , que l'Evangéliste ne nomme point , & que quelques-uns ont cru être Hébron même , quoiqu'on ne puisse en rien assurer.",

          "texte": "D'où vient qu'elle parle de <em>la puissance</em> de Dieu dans le mystère de l'Incarnation , puisqu'il n'y paroît que de l'humiliation & de la foiblesse ? Un Dieu se fait homme. Le Tout-puissant devient un enfant. Le Fils de Dieu même devient le fils de Marie ; & <em>le Seigneur</em> reconnoît <em>sa servante</em> pour <em>sa mère.</em> Qu'y a-t-il en tout cela qui nous marque qu'il est tout-puissant ? Cependant nous pouvons dire que sa puissance a éclaté dans ce mystère d'une manière admirable ; & que <em>ce qui a paru en Dieu une foiblesse</em> , comme dit saint Paul , <em>a été plus fort que</em> la force <em>de tous les hommes.</em> Car il n'y avoit que le Tout-puissant qui pût user de moyens si rabaissés pour vaincre le fort armé. Il n'y avoit que le Seigneur & le Dieu de gloire qui pût choisir une fille foible & petite selon le monde , afin d'accomplir en elle la plus ancienne des prophéties , qui marquoit que <em>la femme briseroit la tête du serpent</em> , c'est-à-dire , comme l'expliquent les saints Pères , celui qui naîtroit de la sainte Vierge. Considérons donc avec une profonde reconnoissance la vérité de ces paroles de la sainte Vierge : Que <em>celui qui est tout-puissant</em> a daigné se rabaisser jusqu'à une simple créature , pour <em>faire en elle des choses</em> vraiment <em>grandes</em> & admirables. Car qu'y a-t-il de plus grand , qu'une vierge qui conçoit un fils sans perdre sa virginité ; qu'une créature qui devient la mère de son Créateur ; qu'une fille qui sert d'instrument à Dieu pour triompher du démon qui avoit vaincu le plus parfait de tous les hommes ; & qu'enfin le salut des hommes commence par une femme , comme sa perte étoit venue de la femme ? C'est en cela que Dieu a fait éclater , non-seulement <em>sa puissance</em> , mais encore <em>la sainteté de son nom.</em> Car rien n'a fait plus paroître combien Dieu est saint , que de <a class=\"page-inline\" href=\"page-272.html\" title=\"p. 272\">‖</a>ce qu'après avoir on</em> de JESUS-CHRIST. Car l'Eglise a pris sa naissance au milieu d'eux , & les Apôtres qui ont été les <em>colonnes de l'Eglise</em> , faisoient partie d'Israël.",
