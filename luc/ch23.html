        {
          "texte": "<em>Ils commencèrent à l'accuser en disant : Voici un homme que nous avons trouvé qui pervertissoit notre nation, & qui empêchoit de payer le tribut à César, & qui dit être le Roi & le</em> CHRIST.",

        {
          "texte": "Elie avoit été accusé anciennement par Achab, de renverser Israël, parce qu'il vouloit retirer ce peuple de l'idolâtrie. De même les Prêtres & les Docteurs de la loi accusent ici J. C. de <em>pervertir</em> ou de <em>renverser leur nation</em>, parce qu'il leur enseignoit une doctrine qui tendoit à les retirer de la corruption où ils vivoient, & que l'Evangile qu'il leur prêchoit ne s'accordoit point avec les traditions de leurs Anciens, opposées à la vérité & à l'esprit de la loi. Ils mentoient donc, & leur mensonge étoit d'autant plus énorme, qu'ils s'efforçoient de lui donner plus de poids, en assurant <em>qu'ils avoient trouvé</em> JESUS-CHRIST dans l'action même dont ils l'accusoient ; c'est-à-dire, qu'ils étoient témoins oculaires de ce qu'ils osoient avancer contre le Sauveur.",

        {
          "texte": "Le second chef d'accusation étoit encore plus visiblement faux. Car le Fils de Dieu ayant été interrogé malignement par les Pharisiens sur le payement du tribut, il les avoit confondus de telle sorte par sa réponse, qu'ils ne purent rien trouver à reprendre dans ses paroles, & que l'admiration qu'elles leur causèrent, les réduisit au silence. Il confirma même par son exemple ce qu'il avoit dit, lorsqu'il ordonna à saint Pierre de payer le tribut de deux drachmes qu'on lui demandoit, quoiqu'il eût fait voir à cet Apôtre qu'il devoit en être exempt.",
          "marges": [

          ],
          "p": 665
        },
        {
          "texte": "Quant à la troisième accusation, quoiqu'il fût vrai <em>qu'il se disoit être le</em> CHRIST, & même <em>Roi</em>, elle renfermoit néanmoins une très-grande malignité. Car s'il déclaroit qu'il étoit le CHRIST, c'est-à-dire le Messie, attendu depuis si long-temps par tous les Juifs, il leur donnoit lieu de le reconnoître par tous les signes de son avénement marqué dans tous les Prophètes. Et s'il leur parloit de son royaume, ce n'étoit jamais comme d'un royaume temporel, mais comme d'un royaume à venir & d'un royaume tout céleste, qui ne devoit point par conséquent donner le moindre soupçon aux Rois de la terre. C'est pourquoi <a class=\"page-inline\" href=\"page-666.html\" title=\"p. 666\">‖</a>Hérode, qui persécuta le premier J. C. à cause de la qualité de <em>Roi des Juifs</em>, que les Mages lui donnèrent dès sa naissance, se trompa très-grossièrement, en le soupçonnant de venir au monde pour le détrôner : & l'Eglise s'adressant à ce Prince même pour lui reprocher son aveuglement, lui dit avec très-grande raison ces excellentes paroles tirées d'un Ancien : <em>Prince impie, pourquoi crains-tu la venue du</em> CHRIST ? <em>Celui qui vient nous donner un royaume dans le ciel, ne pense point à ôter les royaumes de la terre.</em>",

        {
          "texte": "<em>Alors Pilate dit aux Princes des Prêtres & au peuple : Je ne trouve rien de criminel en cet homme. Mais eux insistant de plus en plus, ajoutèrent : Il soulève le peuple par sa doctrine, &c.</em>",
          "marges": [],
          "p": 666
        },
        {
          "texte": "Après que Pilate a demandé à J. C. <em>s'il étoit le Roi des Juifs</em>, & que J. C. a reconnu la vérité de ce qu'il disoit ; il est étonnant que ce Gouverneur, sans se mettre en peine de cette déclaration, s'en aille, comme il est marqué ici, <em>dire aux Princes des Prêtres, & au peuple</em>, qui s'étoient tenus hors le palais : Qu'<em>il ne trouvoit point de crime dans cet homme.</em> Car il semble qu'un Officier des Romains auroit dû s'intéresser davantage dans une chose qui attaquoit la majesté & l'autorité de l'Empire ; puisque c'étoit l'Empereur qui disposoit du royaume de la Judée ; & que quiconque usurpoit une telle dignité, se rendoit coupable d'un attentat contre l'autorité impériale. Mais cette difficulté s'éclaircit sans peine par l'Evangile de saint Jean, où il est marqué que ce que les Juifs avoient tû malicieusement à Pilate en accusant J. C. de <em>s'être dit Roi</em>, J. C. le déclara à ce Gouverneur, pour lui ôter tout mauvais soupçon de sa conduite. Car il lui dit nettement, en lui avouant qu'il étoit Roi : Que <em>son royaume n'étoit pas de ce monde.</em> Et il ajouta : Qu'<em>il étoit né, & étoit venu dans le monde, afin de rendre témoignage à la vérité</em> ; faisant entendre par-là, que son royaume étoit tout spirituel, & qu'il étoit Roi pour faire régner la vérité dans le monde. Ce fut donc ce qui donna lieu à Pilate de juger que la qualité qu'il prenoit de <em>Roi des Juifs</em>, ne préjudicioit en aucune sorte à l'autorité de l'Empereur. Mais de plus, l'extérieur pauvre & modeste de J. C. l'empêchoit de le soupçonner d'avoir le moindre dessein d'usurper le royaume de la Judée. Ainsi négligeant cette vaine accusation, & les autres qui en dépendoient, il dit aux Juifs, très-sincèrement, Qu'il ne trouvoit aucun crime en lui.",

          "marges": [],

        {
          "texte": "Cet Officier ne demandoit qu'un prétexte pour se dispenser de connoître d'une affaire, où il remarquoit plus de passion que de justice, & à laquelle les principaux d'entre les Juifs s'intéressoient avec une si grande chaleur. Ainsi quoique ce ne lui fût pas une raison pour se désister du jugement de J. C. de ce qu'on le regardoit comme étant de Galilée, dont Hérode surnommé Antipas, qui fit mourir saint Jean-Baptiste, étoit Tétrarque, avec le nom & la qualité de Roi ; il fut néanmoins bien aise d'avoir trouvé ce prétexte de lui renvoyer un homme qu'il jugeoit être innocent, & d'être par là déchargé de toute la haine des Juifs qui vouloient le faire mourir. Hérode étoit en ce même temps à Jérusalem, sans doute pour la célébration de la Pâque, étant Juif de religion, & fils d'un père prosélyte, c'est-à-dire, associé à la religion des Juifs. Comme il étoit politique, il ne songea guère, en voyant JESUS, à l'occasion que Dieu même lui présentoit de justifier un innocent, reconnu tel par Pilate, & il pensa seulement à satisfaire sa curiosité, & le désir qu'il avoit depuis long-temps, de voir un homme qui faisoit tant de prodiges, dans l'espérance qu'il eut que l'ayant entre ses mains, il l'engageroit à faire quelque miracle en sa présence, pour obtenir sa liberté. Mais il jugeoit bien humainement de celui qu'il ne connoissoit pas. Et s'il l'eût connu, il au<a class=\"page-inline\" href=\"page-668.html\" title=\"p. 668\">‖</a>roit dû regarder comme l'un des grands miracles de J. C. de ce qu'il souffroit qu'on le conduisît ainsi de tribunal en tribunal, pour paroître comme un criminel devant tous ces Juges différens, lui qui d'une seule parole avoit renversé par terre tous ses ennemis, au moment qu'ils se présentèrent pour le prendre. C'étoit donc l'humilité & la patience de J. C. qui devoit le faire alors regarder comme un homme tout miraculeux, après <em>tant</em> de marques éclatantes qu'il avoit données de sa puissance. Ainsi il voulut punir la vaine curiosité de ce Prince, en <em>ne lui répondant point, quelques demandes qu'il lui fit</em>, qui ne tendoient toutes apparemment qu'à satisfaire sa vanité, & qu'à tenter Dieu ; puisque c'est, dit S. Augustin, le tenter de lui demander des signes & des prodiges, non pour quelque utilité, mais pour la seule curiosité de l'esprit.",

          "p": 667
        },
        {
          "texte": "Quelques accusations que les Princes des Prêtres & les Docteurs de la loi avançassent contre J. C., & quelque chaleur qu'ils fissent paroître pour le décrier comme un séditieux dans l'esprit d'Hérode, ce Prince ne témoigna, non plus que toute sa Cour, que du mépris pour sa personne sacrée. Il le regarda comme indigne d'être accusé d'aspirer à la royauté, à cause de cet extérieur humble & négligé qu'il voyoit en lui. Et le grand silence qu'il garda toujours sans lui répondre la moindre chose, lui donna lieu même de le traiter comme s'il avoit perdu l'esprit. <em>Il le fit</em> donc <em>revêtir d'une robe blanche</em>, ou, selon le grec, d'une robe magnifique & éclatante, comme s'il avoit voulu se moquer de lui, & témoigner qu'il le regardoit en quelque façon, plutôt comme un roi de théâtre, que comme un Roi véritable. Il le renvoya ensuite à Pilate, tant pour lui rendre la même déférence dont il avoit bien voulu user à son égard, que pour marquer qu'il ne trouvoit rien en J. C. qui méritât aucune condamnation. Et cette conduite qu'Hérode & Pilate tinrent l'un à l'égard de l'autre servit à les réconcilier ; parce qu'ils étoient fort brouillés, peut-être à cause de la cruauté que Pilate avoit exercée sur les Galiléens dont on a parlé, qui étoient de la juridiction d'Hérode ; & peut-être aussi à cause de la jalousie, qui étoit ordinairement entre les Princes des Juifs, & les Gouverneurs Romains. Mais ce qui mérite toute notre admiration, est de voir cette incomparable douceur & ce silence de J. C., qui se laisse ainsi conduire de la maison du Grand-Prêtre, chez Pilate ; de Pilate, chez Hérode ; & d'Hérode, chez Pilate ; comme s'il avoit été le plus foible de tous les hommes, voulant bien même passer pour un fou aux yeux des Grands de la terre ; <a class=\"page-inline\" href=\"page-669.html\" title=\"p. 669\">‖</a>& accomplissant par cette folie apparente les plus grands desseins de sa sagesse éternelle, & les mystères les plus importans de notre rédemption. Car il falloit que cet Homme-Dieu fût ainsi traité par les hommes, afin que les hommes superbes apprissent d'un si grand exemple, à s'anéantir eux-mêmes pour parvenir, comme lui, à une gloire qui ne doit être que le prix des humiliations des membres, aussi-bien que de leur chef.",

        {
          "texte": "<em>Je ne l'ai trouvé coupable d'aucun des crimes dont vous l'accusez, ni Hérode non plus : car je vous ai renvoyés à lui, &c.</em>",

        {
          "texte": "Il falloit que J. C. fût déclaré juridiquement innocent par les deux plus grandes Puissances qui fussent dans la Judée, par le Gouverneur des Romains, & par le Prince des Juifs, avant qu'il fût condamné à la mort, afin qu'il parût à tout le monde qu'il mouroit injustement. Et ainsi cette déclaration si authentique de son innocence devenoit la condamnation publique des Juifs, dont la haine toute gratuite contre J. C. ne pouvoit être attestée par des témoins d'une autorité plus irréprochable ; puisqu'ils étoient l'un & l'autre également intéressés à s'élever contre lui, si les crimes de révolte dont on l'accusoit avoient eu quelque fondement. Ces paroles de Pilate, <em>Et ecce nihil dignum morte actum est ei</em>, paroissent obscures ; car on ne voit pas précisément s'il parle d'Hérode, ou de J. C. ; c'est-à-dire, s'il veut marquer que le roi Hérode n'avoit rien fait à J. C. qui pût faire croire <em>qu'il le jugeât digne de mort</em>, ou s'il entend seulement que JESUS, au jugement même de ce Prince, n'avoit rien fait qui méritât qu'on le fît mourir. On a marqué ces deux sens, l'un dans le texte, qui est celui que les Interprètes ont préféré, & l'autre au bas de la page. Mais dans le fond, ils reviennent à peu près à la même chose ; c'est-à-dire, à faire connoître l'innocence de celui dont les Juifs demandoient la mort, & qu'un Magistrat payen, avec un Roi Juif, vouloit au contraire renvoyer libre, comme n'ayant point mérité la mort qu'ils vouloient lui faire souffrir.",

    {
      "n": 28,
      "p": 661,
      "lat": "Conversus autem ad illas, Jesus dixit : Filiæ Jerusalem, nolite flere super <a class=\"page-inline\" href=\"page-662.html\" title=\"p. 662\">‖</a>me, sed super vos ipsas flete, & super filios vestros :",
      "fr": "Mais JESUS se retournant vers elles, leur dit : Filles de Jérusalem, ne pleurez point sur moi, mais <a class=\"page-inline\" href=\"page-662.html\" title=\"p. 662\">‖</a>pleurez sur vous-mêmes & sur vos enfans :",
      "note": [
        {
          "texte": "<em>JESUS se retournant vers elles, leur dit : Filles de Jérusalem, ne pleurez point sur moi, mais pleurez sur vous-mêmes, & sur vos enfans. Car il viendra un temps auquel on dira : Heureuses les stériles, &c.</em>",
          "marges": [],
          "p": 670
        },
        {
          "texte": "Il est naturel aux femmes d'être touchées de compassion du mal des autres. Mais il pouvoit même y en avoir parmi celles-ci, qui pleurassent véritablement l'injustice qu'on faisoit à J. C. qu'elles regardoient, non-seulement comme un juste, mais comme leur bienfaicteur. Cependant le Fils de Dieu ne veut point qu'elles le pleurent ; c'est-à-dire, qu'il ne veut point qu'elles s'attachent humainement à verser des larmes sur son sujet. Car, comme il étoit venu dans le monde pour souffrir tous ces outrages ; il vouloit que celles d'entre ces femmes qui le regardoient comme innocent, élevassent leur esprit pour remonter jusqu'à la cause d'un traitement si terrible, qui étoient les péchés des hommes. Et quant à celles qui ne pleuroient que par un pur mouvement de tendresse ou de foiblesse attachée au sexe, il leur déclaroit qu'elles avoient bien d'autres sujets de pleurer, tant sur elles-mêmes que sur leurs enfans, c'est-à-dire, sur les Juifs mêmes qui le traitoient de la sorte, & sur ceux qui en naîtroient, à cause des malheurs épouvantables qui devoient fondre sur toute cette nation impénitente, principalement dans le temps du siège de Jérusalem. Ainsi il peut arriver qu'on pleurera un homme juste dans tous les maux qu'on lui voit souffrir injustement, lorsqu'on néglige de se pleurer soi-même sur ses propres injustices, & qu'on n'envisage point les châtimens ri<a class=\"page-inline\" href=\"page-671.html\" title=\"p. 671\">‖</a>goureux que Dieu nous prépare ; comme alors il en préparoit d'effroyables aux enfans mêmes de ces femmes qui pleuroient la mort du Sauveur.",
          "marges": [],
          "p": 670
        },
        {
          "texte": "Pour marquer plus vivement l'excès des malheurs dont le peuple Juif seroit accablé, J. C. déclare à ces femmes, qu'on regarderoit alors comme <em>heureuses, celles qui seroient stériles</em> ; parce que comme les enfans sont un grand sujet d'attache à leurs mères, celles-là seroient plus heureuses dans le temps de tous ces malheurs, qui n'ayant point ces sortes d'attaches, ne sentiroient point comme déchirer leurs propres entrailles dans la mort cruelle de leurs enfans, & qui se verroient plus libres pour s'enfuir, n'étant point alors retenues par tous ces liens de la nature, si difficiles à rompre à une mère pleine de tendresse. Ce qu'il ajoute, Qu'<em>on dira alors aux montagnes, Tombez sur nous, &c.</em> sert à exprimer d'une manière encore plus forte quelle devoit être la terreur dont seroient frappés les Juifs, lorsque fuyant la colère des Romains, ils désireroient de se cacher sous la terre, & d'être plutôt écrasés sous les montagnes, que de tomber vifs entre les mains de leurs ennemis. On vit en effet quelque chose de semblable, lorsqu'après la prise de Jérusalem plusieurs se cachèrent dans des égouts, & s'ensevelirent tout vivans dans des lieux sombres & souterrains, où néanmoins la justice de Dieu les alla chercher, pour les livrer à l'épée des Romains, selon la triste relation qu'en a faite leur propre historien.",
          "marges": [
            "Joseph. Bell. Jud. l. 6. c. 46."
          ],
          "p": 671
        }
      ],
      "noteVersets": [

    {

      "fr": "car il viendra un temps auquel on dira : Heureuses les stériles, & les entrailles qui n'ont point porté d'enfans, & les mamelles qui n'en ont point nourri.",

      "lat": "Tunc incipient dicere montibus : Cadite super nos ; & collibus : Operite nos.",
      "fr": "Ils commenceront alors à dire aux montagnes : Tombez sur nous ; & aux collines : Couvrez-nous.",
      "note": "",

    },
    {
      "n": 31,
      "p": 662,
      "lat": "Quia si in viridi ligno hæc faciunt, in arido quid fiet ?",
      "fr": "Car s'ils traitent de la sorte le bois vert, comment le bois sec sera-t-il traité ?",
      "note": [
        {
          "texte": "<em>S'ils traitent de la sorte le bois vert, comment le bois sec sera-t-il traité ?</em>",
          "marges": [],
          "p": 671
        },
        {
          "texte": "C'étoit une espèce de proverbe parmi les Hébreux, de nommer les bons <em>du bois vert</em>, & les méchans <em>du bois sec.</em> Ainsi un homme de bien est représenté dans les livres saints sous la figure d'un arbre vert, & d'un arbre plein de vigueur, qui porte son fruit dans son temps ; au lieu que les hommes qui ne font point de bonnes œuvres y sont comparés à des arbres secs, ou à des arbres stériles, qui ne sont dignes que d'être coupés & jetés au feu. C'est donc en suivant cette parabole, que le Fils de Dieu parle de foi, comme d'un arbre vert plein de vigueur, & chargé de fruit ; & du peuple Juif, comme d'un bois sec, qui n'étoit bon qu'à être brûlé. <em>Si l'on traite ainsi</em>, disoit-il, <em>le bois vert</em>, c'est-à-dire, si la justice de Dieu permet que les hommes outragent de cette sorte son propre Fils, que doivent attendre ces hommes mêmes, qui comme <em>un bois sec</em>, & comme des arbres stériles & inutiles pour le royaume des cieux, sont destinés au <a class=\"page-inline\" href=\"page-672.html\" title=\"p. 672\">‖</a>feu éternel ? Il est vrai que J. C. a souffert tous ces mauvais traitemens, & s'est fait une victime de propitiation pour nos péchés. Mais si toutes les souffrances de J. C. nous deviennent inutiles par notre faute, & si n'étant que du bois stérile par nous-mêmes, nous négligeons de participer au suc divin du tronc sur lequel nous sommes entés par la grâce du baptême, nous serons infailliblement retranchés, & jetés au feu. C'est la manière figurée dont le Fils de Dieu s'exprime sur ce sujet, lorsqu'il dit ailleurs : <em>Je suis la vraie vigne, & mon Père est le vigneron. Il retranchera toutes les branches qui ne portent point de fruit en moi...... Je suis le cep de la vigne, & vous en êtes les branches. Celui qui demeure en moi, & en qui je demeure, porte beaucoup de fruit. Car vous ne pouvez rien faire sans moi. Celui qui ne demeure pas en moi, sera jeté dehors comme un sarment inutile. Il séchera, & on le ramassera pour le jeter au feu & le brûler.</em>",
          "marges": [
            "Ps. 1. 3.",
            "Ezechiel. 20. 47.",
            "Matt. 3. 10.",
            "Joan. 15. 1. &c."
          ],
          "p": 671
        },
        {
          "texte": "Voilà donc quel est <em>le bois vert</em>, & le <em>bois sec.</em> Le bois vert est proprement le cep de la vigne, & les branches qui participent à son suc : c'est-à-dire, J. C. & tous ses membres vivans, qui <em>demeurent en lui</em> par la charité, & <em>en qui il demeure</em> lui-même par son Esprit. Le bois sec, sont <em>les branches qui ne portant point de fruit en</em> J. C., sont <em>retranchés & se sèchent</em> : c'est-à-dire, les méchans qui se rendant indignes de la participation de l'esprit du Fils de Dieu, sont stériles en toutes sortes de bonnes œuvres, & ne méritent que d'être jetés dans le feu, qui est préparé par la divine justice aux réprouvés.",
          "marges": [],
          "p": 672
        }
      ]
    },

      "n": 32,

      "fr": "Lorsqu'ils furent arrivés au lieu appelé Calvaire, ils y crucifièrent JESUS, & ces <em>deux</em> voleurs, l'un à droite & l'autre à gauche.",
      "note": "",
      "marges": [

        "Joan. 19. 17."
      ]
    },
    {
      "n": 34,
      "p": 662,
      "lat": "Jesus autem dicebat : Pater, dimitte illis, non enim sciunt quid faciunt. Dividentes verò vestimenta ejus, miserunt sortes.",
      "fr": "Et JESUS disoit : Mon Père, pardonnez-leur, car ils ne savent ce qu'ils font. Ils partagèrent ensuite ses vêtemens, & les jetèrent au sort.",
      "note": [
        {
          "texte": "<em>Et</em> JESUS <em>disoit : Mon Père pardonnez-leur ; car ils ne savent ce qu'ils font.</em>",
          "marges": [],
          "p": 672
        },
        {
          "texte": "JESUS-CHRIST fait véritablement ici la fonction de Grand-Prêtre de la loi nouvelle, par rapport à ce qui est dit de celui de l'ancienne loi, Qu'entrant dans le second tabernacle une fois l'année, il y portoit avec soi du sang, qu'il offroit pour les ignorances du peuple. Le Fils de Dieu offroit donc son sang à son Père, étant sur la croix, & il le prie de pardonner à ceux qui le crucifioient. Et en cela, non-seulement il pratiqua le premier ce qu'il avoit dit à ses disciples, de <em>prier pour ceux qui les persécuteroient</em>, mais il accomplit encore la prédiction qu'un Prophète avoit faite long-temps auparavant : Que <em>s'étant livré à la mort, & ayant été mis au rang des scélérats, il a prié pour les violateurs de la loi.</em> Or la raison pour laquelle il lui fait cette prière est celle-ci : <em>Parce</em>, dit-il, <em>qu'ils ne savent ce qu'ils font.</em> C'est-là <em>l'ignorance du peuple</em> Juif, pour laquelle le Grand-Prêtre de la loi nouvelle offre son sang à son Père. Mais est-il possible qu'ils <a class=\"page-inline\" href=\"page-673.html\" title=\"p. 673\">‖</a>ne fussent point ce qu'ils faisoient, eux dont il est dit : Que <em>Pilate savoit bien que c'étoit par envie que les Princes des Prêtres lui avoient mis</em> JESUS-CHRIST <em>entre les mains</em> ? Il est vrai que la jalousie les portoit à contredire la doctrine & toutes les œuvres du Fils de Dieu ; & ils étoient en cela très-criminels. Mais il est très-vrai aussi qu'ils ne le connurent point pour le Fils de Dieu ; puisque s'ils l'avoient connu, comme dit saint Paul, <em>ils n'eussent jamais crucifié le Seigneur & le Roi de gloire.</em> C'est ce qui porta saint Pierre dans la seconde prédication qu'il fit aux Juifs après la guérison miraculeuse du boiteux, à leur dire : Qu'<em>il savoit bien</em> que lorsqu'ils avoient fait mourir l'Auteur de la vie, <em>ils l'avoient fait par ignorance, aussi-bien que leurs Sénateurs.</em> Leur ignorance consistoit donc en ce qu'ils ne croyoient point effectivement que celui qu'ils crucifioient fût Fils de Dieu. Car l'extérieur pauvre & méprisable qu'ils voyoient en lui, les trompoit ; & étant maîtres de sa personne pour en faire tout ce qu'ils vouloient, ils le regardoient comme un autre homme, bien éloignés de juger de sa divinité par la douceur même de sa patience. Ainsi, quoique leur orgueil qui les empêchoit de le connoître, les rendît très-coupables, il y avoit néanmoins en eux de <em>l'ignorance.</em> Et quelque criminelle qu'elle pût être, elle n'étoit pas incurable au sang d'un Dieu qui mouroit actuellement sur la croix, & qui l'offroit à son Pere pour ces mêmes Juifs.",
          "marges": [
            "Hebr. 9. 7.",
            "Matt. 5. 44.",
            "Isai. 53. 12.",
            "Matt. 15. 10.",
            "1. Cor. 2. 8.",
            "Act. 3. 17."
          ],
          "p": 672
        },
        {
          "texte": "On peut dire encore avec un Ancien, qu'ils étoient comme des frénétiques, & qu'un esprit ennemi de leur salut, qui les possédoit, faisoit souffrir à leur ame une plus cruelle persécution que celle qu'ils faisoient souffrir au corps du Sauveur : qu'ainsi ils étoient d'autant plus dignes de compassion, qu'ils ne sentoient pas le mal qu'ils souffroient, & avoient d'autant plus de besoin de sa prière pour en être délivrés. On doit regarder comme un effet de cette prière toute-puissante la conversion de tant de Juifs, qui <em>furent touchés de componction en leur cœur</em>, après que saint Pierre leur eut prouvé très-fortement par l'Ecriture : Que JESUS, <em>qu'ils avoient crucifié, étoit le Seigneur & le</em> CHRIST. Et quand le Sauveur fit cette prière, il voyoit, dit S. Augustin, au milieu de ceux qui lui étoient étrangers, ceux qui devoient être un jour à lui. C'étoit donc pour eux qu'il demandoit le pardon, dans le temps même qu'il n'en recevoit que des injures : <em>Videbat quosdam suos inter multos alienos : illis jam petebat veniam, à quibus adhuc accipiebat injuriam.</em>",
          "marges": [
            "August. de temp. serm. 61.",
            "Act. 2. 37.",
            "August. in Joan. tract. 31."
          ],
          "p": 673
        }
      ]
    },
    {
      "n": 35,
      "p": 662,
      "lat": "Et stabat populus spectans, & deridebant eum Principes cum eis, dicentes : Alios salvos fecit, se salvum faciat, si hic est Christus Dei electus.",
      "fr": "Cependant le peuple se tenoit là, & regardoit ; & les Sénateurs aussi bien que le peuple se moquoient de lui, en disant : Il a sauvé les autres, qu'il se sauve maintenant lui-même, s'il est le CHRIST l'élu de Dieu.",

      "fr": "Il y avoit aussi au-dessus de lui une inscription en grec, en latin & en hébreu, où étoit écrit : CELUI-CI EST LE ROI DES JUIFS.",
      "note": ""
    },
    {
      "n": 39,
      "p": 663,
      "lat": "Unus autem de his qui pendebant latronibus, blasphemabat eum, dicens : Si tu es Christus, salvum fac temetipsum, & nos.",
      "fr": "Or l'un de ces deux voleurs qui étoient * crucifiés <em>avec lui</em>, le blasphémoit, en disant : Si tu es le CHRIST, sauve-toi toi-même, & nous avec toi.",
      "note": [
        {
          "texte": "<em>Or l'un de ces deux voleurs qui étoient crucifiés avec</em> <a class=\"page-inline\" href=\"page-674.html\" title=\"p. 674\">‖</a><em>lui, le blasphémoit, en disant : Si tu es le</em> CHRIST<em>, sauve-toi toi-même avec nous. Mais l'autre le reprenant, lui disoit : N'avez-vous donc point la crainte de Dieu ? &c.</em>",
          "marges": [],
          "p": 673
        },
        {
          "texte": "Il est dit dans saint Matthieu & dans saint Marc, Que <em>les voleurs qui étoient crucifiés avec</em> JESUS-CHRIST, <em>lui faisoient les mêmes reproches</em> que tout le reste des Juifs. Ainsi il peut bien être arrivé, selon la remarque de saint Ambroise, que l'un d'eux ayant d'abord insulté à JESUS-CHRIST, fut converti tout-d'un-coup par un effet tout-puissant de la grâce de celui qui mouroit pour son salut. Et il n'est point surprenant qu'étant alors vraiment converti, il ait obtenu le pardon de son péché, de cet Homme-Dieu, qui pardonnoit à ceux-mêmes qui lui insultoient : <em>Nec mirum, si converso culpam ignoscebat, qui insultantibus veniam relaxabat.</em> Ce fut donc alors que changeant en un moment de langage, & prenant tout haut la défense du Sauveur, il dit à son compagnon : <em>N'avez-vous pas non plus de crainte de Dieu ?</em> Ce qui est de même que s'il lui eût dit : Comment pouvez-vous imiter l'inhumanité de tous ces peuples, en insultant sans aucune crainte de Dieu à cet Innocent & à ce Juste, <em>vous qui souffrez</em> actuellement <em>le même supplice</em> que lui ; mais avec cette grande différence, que <em>nous autres nous souffrons ce qui est dû à nos crimes</em>, au lieu que celui à qui vous osez ainsi insulter <em>n'est coupable d'aucun mal ?</em>",
          "marges": [
            "Matt. 27. 44.",
            "Marc. 15. 32.",
            "Ambr. in hunc loc."
          ],
          "p": 674
        },
        {
          "texte": "Rien n'a été plus glorieux à ce voleur, que d'avoir connu la sainteté de JESUS-CHRIST au milieu de tous les outrages & des blasphèmes des Juifs. Et rien n'a fait éclater d'une manière plus sensible ce que peut la grâce du Rédempteur, que cet exemple d'un criminel, qui ayant lui-même blasphémé le Fils de Dieu avec tous les autres, découvre & adore sur la croix sa divinité, que ni l'accomplissement des prophéties, ni tant de miracles, ni sa doctrine admirable, n'avoient pu faire connoître aux Princes des Prêtres, aux Pharisiens, & aux Docteurs de la loi. JESUS-CHRIST met dans le cœur & dans la bouche de ce voleur converti, la vérité qui condamnoit tous ces riches superbes & incrédules, & il en fait un Prédicateur évangélique, qui devoit couvrir de confusion tous ceux qui étoient présens, s'ils l'entendirent. Tels étoient les Prédicateurs qui convenoient à ce temps de sa passion, qui étoit un temps de ténèbres. Il falloit que ce qu'il y avoit de plus savant dans la Religion judaïque, fût instruit par un scélérat, devenu pénitent & fidelle sur la croix. Il falloit qu'après avoir rejeté la vérité qui leur étoit annoncée par la bouche de Dieu même, ils l'entendissent <a class=\"page-inline\" href=\"page-675.html\" title=\"p. 675\">‖</a>alors de la bouche d'un voleur, qui leur reprochoit à tous indirectement du haut de sa croix l'infidélité & l'orgueil de leur conduite.",
          "marges": [],
          "p": 674
        }

      "noteVersets": [
        39,
        40

      "nb": [
        "℣. 39. lettr. pendus."

    },
    {
      "n": 40,
      "p": 663,
      "lat": "Respondens autem alter increpabat eum, dicens : Neque tu times Deum, quòd in eadem damnatione es ?",
      "fr": "Mais l'autre le reprenant, lui disoit : N'avez-vous donc point de crainte de Dieu, <em>non plus que les autres</em>, vous qui vous trouvez condamné au même supplice ?",
      "note": ""
    },
    {
      "n": 41,
      "p": 663,
      "lat": "Et nos quidem justè ; nam digna factis recipimus : hic verò nihil mali gessit.",
      "fr": "Encore pour nous c'est avec justice ; puisque nous souffrons la peine que nos crimes ont méritée ; mais celui-ci n'a fait aucun mal.",
      "note": ""
    },
    {
      "n": 42,
      "p": 663,
      "lat": "Et dicebat ad Jesum : Domine, memento meî, cùm veneris in regnum tuum.",
      "fr": "Et il disoit à JESUS : Seigneur, souvenez-vous de moi lorsque vous serez venu en votre royaume.",
      "note": [
        {
          "texte": "<em>Et il disoit à</em> JESUS : <em>Seigneur, souvenez-vous de moi lorsque vous serez venu en votre royaume. Et</em> JESUS <em>lui répondit : Je vous dis en vérité, que vous serez aujourd'hui avec moi dans le paradis.</em>",
          "marges": [],
          "p": 675
        },
        {
          "texte": "Qui ne sera étonné d'entendre cet homme parler à JESUS de <em>son royaume</em>, dans le temps même qu'il le voyoit attaché à une croix ? Et que ne peut point la lumière de la foi, pour dissiper tous les nuages de la prévention la plus forte dans un cœur qu'elle s'est assujetti ? Il reconnoît donc JESUS pour son Dieu, pour son <em>Seigneur</em>, & pour son <em>Roi</em>, lorsque tous les autres le traitent comme un scélérat. Et dans la vue ou le sentiment de sa grande indignité, il se contente de le prier de vouloir bien <em>se souvenir</em> seulement <em>de lui, quand il seroit arrivé en son royaume.</em> Ainsi il le regardoit comme un Roi, mais comme un Roi d'un royaume qui n'étoit pas de ce monde, & d'un royaume à venir. Il ne lui demande pas, comme saint Jacques & saint Jean, une place honorable dans ce royaume. Il s'en jugeoit très-indigne. Mais il le prie de <em>se souvenir</em> d'un pécheur, qui n'avoit confiance qu'en sa bonté. Il le prie de ne le pas oublier dans son royaume, sachant que l'oubli de Dieu à l'égard des hommes, est la marque de leur réprobation. Et cette prière si humble partant d'un cœur pénétré de la grandeur de celui à qui il parloit, & de sa propre misère, mérita une réponse très-consolante du Fils de Dieu, qui l'assura de son vivant même, de son salut éternel ; ce qui peut-être n'est arrivé à aucun homme sur la terre : <em>Je vous dis en vérité</em>, lui dit-il, <em>que vous serez aujourd'hui avec moi dans le paradis.</em> Il ajoute le serment à la promesse, pour lui ôter tout sujet de défiance dans ce sentiment qu'il avoit de ses péchés. Il lui accorde dans l'instant même ce qu'il ne lui demandoit que pour <em>l'avenir</em>, puisqu'il l'en assure pour <em>ce même jour.</em> Et il ne lui promet pas seulement de <em>se souvenir de lui</em>, comme il l'en avoit prié ; mais il lui déclare qu'il l'associera dans la participation des plaisirs célestes dont lui-même doit jouir : car c'est la force de ces paroles : <em>Vous serez aujourd'hui avec moi, dans le paradis.</em> Il n'entendoit pas <em>par le paradis</em>, le ciel, où les hommes ne pouvoient entrer qu'après qu'il y auroit élevé son humanité sacrée au jour de l'Ascension : mais il entendoit le lieu, quel qu'il pût être, où tous les justes & les saints des siècles passés seroient en la compagnie du Fils de Dieu. Car du <a class=\"page-inline\" href=\"page-676.html\" title=\"p. 676\">‖</a>moment qu'ils jouirent de sa présence, ils furent en paradis ; c'est-à-dire, dans la joie & dans des délices que l'esprit de l'homme, tant qu'il se trouve environné de cette mortalité, ne peut point comprendre.",
          "marges": [],
          "p": 675
        },
        {
          "texte": "Voilà donc un homme tout couvert de crimes, lavé dans le sang de J. C. en un moment. Et voilà, comme le remarque saint Augustin, le premier arrêt que le Fils de Dieu prononce de dessus le tribunal de sa croix. Car cette croix a été, dit ce grand Saint, le tribunal de JESUS souffrant. Il étoit au milieu de deux voleurs, comme le Juge de l'un & de l'autre. Il sauve celui d'entre eux qui croit & qui confesse sa divinité. Et il condamne celui qui persiste dans l'impiété de son cœur. Ainsi il marquoit dès ce temps-là, ce qu'il fera souverainement à l'égard de tous les vivans & de tous les morts, dont il doit mettre les uns à sa droite, & les autres à sa gauche. Le voleur qui fut converti, figuroit ceux qui doivent être à sa droite ; & le larron blasphémateur étoit l'image de tous ceux qui doivent être à sa gauche.",
          "marges": [
            "August. in Joan. tract. 31."
          ],
          "p": 676
        }
      ],
      "noteVersets": [
        42,
        43
      ]

    {
      "n": 43,
      "p": 663,
      "lat": "Et dixit illi Jesus : Amen dico tibi : Hodie mecum eris in paradiso.",
      "fr": "Et JESUS lui répondit : Je vous dis en vérité, que vous serez aujourd'hui avec moi dans le paradis.",
      "note": ""
    },

      "p": 663,
      "lat": "Erat autem ferè hora sexta, & tenebræ factæ sunt in universam terram usque in horam nonam.",
      "fr": "Il étoit environ la sixième heure du jour, & toute la terre fut couverte de ténèbres jusqu'à la neuvième heure.",
      "note": "",

    },
    {
      "n": 45,
      "p": 663,
      "lat": "Et obscuratus est sol : & velum templi scissum est medium.",
      "fr": "Le soleil fut obscurci, & le voile du temple se déchira par le milieu.",
      "note": "",
      "marges": [
        "Matt. 27. 51."
      ]
    },
    {
      "n": 46,
      "p": 663,
      "lat": "Et clamans voce magnâ, Jesus ait : Pater, in manus tuas commendo spiritum meum. Et hæc dicens, expiravit.",
      "fr": "Et JESUS jetant un grand cri, dit ces paroles : <em>Mon</em> Père, je remets mon * ame entre vos mains. Et en prononçant ces mots, il expira.",
      "note": [
        {
          "texte": "JESUS <em>jetant un grand cri, dit ces paroles : Mon Père, je remets mon ame entre vos mains.</em>",
          "marges": [],
          "p": 676
        },
        {
          "texte": "Saint Ambroise dit, que l'Evangéliste a marqué exprès que le Fils de Dieu <em>jeta un grand cri</em> avant qu'il mourut, pour nous témoigner que ce n'étoit point par nécessité ni par foiblesse qu'il mouroit, mais par volonté & par un effet tout libre de cet amour qui l'avoit porté à descendre du ciel en terre pour nous sauver de nos péchés ; ensorte qu'il parut Dieu véritablement jusques dans sa mort, par cette force toute divine qu'il fit éclater alors : <em>In qua voce magna, Dei professio gloriosa, usque ad mortem, se pro nostris descendisse peccatis annunciat.</em> Et ces dernières paroles de J. C. par lesquelles <em>il remet son ame entre les mains de son Père</em>, nous marquent encore la liberté avec laquelle il mettoit, dit S. Ambroise, comme en dépôt entre ses mains son ame sainte, qui alloit être séparée de son corps, afin qu'il la conservât : ce qui peut avoir rapport à ce qu'il dit dans les Pseaumes par la bouche & en la personne de David, en parlant comme homme, & en s'adressant aussi à son Père : <em>Vous ne laisserez point</em>, dit-il, <em>mon ame dans l'enfer</em>, c'est-à-dire dans les limbes, quand j'y serai descendu pour en retirer les justes. Ainsi le Fils attribue au Père ce qu'il pouvoit également par lui-même, puisqu'il <em>avoit</em>, comme il dit ailleurs, <em>le pouvoir de quitter sa vie</em>, & qu'il <em>avoit le pouvoir de la reprendre.</em> Mais il étoit homme, & l'homme étant uni <a class=\"page-inline\" href=\"page-677.html\" title=\"p. 677\">‖</a>hypostatiquement au Fils, il étoit juste que l'Homme-Dieu parlât au Père, comme au principe de la très-sainte Trinité.",
          "marges": [
            "Ambr. in hunc loc.",
            "Ps. 15. 10.",
            "Joan. 10. 18."
          ],
          "p": 676

      "marges": [
        "Ps. 30. 6."
      ],
      "nb": [
        "℣. 46. lettr. esprit."
      ]
    },
    {
      "n": 47,
      "p": 663,
      "lat": "Videns autem Centurio quod factum fuerat, glorificavit Deum, dicens : <a class=\"page-inline\" href=\"page-664.html\" title=\"p. 664\">‖</a>Verè hic homo justus erat.",
      "fr": "Alors le Centenier ayant vu ce qui étoit arrivé, glorifia Dieu, <a class=\"page-inline\" href=\"page-664.html\" title=\"p. 664\">‖</a>en disant : Certainement cet homme étoit juste.",
      "note": [
        {
          "texte": "<em>Alors le Centenier ayant vu ce qui étoit arrivé, glorifia Dieu, en disant : Certainement cet homme étoit juste. Et toute la multitude de ceux qui assistoient à ce spectacle, considérant tout ce qui se passoit, &c.</em>",
          "marges": [],
          "p": 677
        },
        {
          "texte": "Un Centenier étoit un officier de guerre, qui avoit le commandement sur cent hommes. Pilate avoit ordonné à celui-ci d'accompagner JESUS-CHRIST avec quelques-uns de ses soldats jusqu'au lieu de son supplice, pour empêcher le tumulte. Lorsqu'il eut donc entendu le Fils de Dieu jeter ce grand cri, en s'adressant à son Père, dans le moment qu'il expira ; lorsqu'il eut senti la terre trembler, qu'il eut vu les pierres se fendre, & le soleil obscurci, <em>il glorifia Dieu</em>, c'est-à-dire, qu'il rendit gloire à celui qu'on venoit de crucifier, en <em>déclarant</em> que bien loin d'être, comme les Juifs l'avoient dit, un criminel & un scélérat, <em>il étoit véritablement un homme juste</em>, & même, selon un autre Evangéliste, Fils de Dieu. « O cœurs des Juifs plus durs que les pierres, s'écrie saint Ambroise ! Les rochers se fendent, & les cœurs de ces obstinés s'endurcissent. Le Juge leur reproche leur injustice ; le Centenier ouvre son cœur à la foi. Judas condamne lui-même son propre crime ; tous les élémens sont renversés ; la terre tremble ; les sépulcres sont ouverts ; & les Juifs demeurent dans leur dureté comme immobiles, pendant que tout l'Univers est ébranlé.",
          "marges": [
            "Matt. 27. 54.",
            "Joan. 18. 30.",
            "Ambros. in hunc locum."
          ],
          "p": 677
        },
        {
          "texte": "Il faut néanmoins entendre par ces Juifs, dont parle ici saint Ambroise, les principaux d'entre les Juifs, c'est-à-dire, les Pharisiens, les Prêtres, les Sénateurs & les Docteurs de la loi. Car pour le peuple, comme la plupart ne s'étoient portés à demander la mort du Sauveur, que par le conseil des Princes des Prêtres & des Sénateurs, qui leur avoient persuadé de préférer Barabbas à JESUS-CHRIST ; il y en eut un grand nombre sur qui ces prodiges, dont nous venons de parler, firent une vive impression. Et c'est d'eux qu'on doit entendre ce qu'ajoute l'Evangile : Que <em>toute la multitude de ceux qui assistoient à ce spectacle</em> de la mort du Fils de Dieu, <em>s'en retournèrent en se frappant la poitrine, après avoir vu toutes ces choses</em> ; c'est-à-dire, qu'ils reconnoissoient l'injustice du traitement qu'on avoit fait à ce juste, & qu'ils témoignoient par cette action extérieure la douleur sincère, & le regret véritable qu'ils sentoient au fond du cœur, d'avoir pris part à une si grande injustice.",
          "marges": [
            "Matth. 27. 20."

          "p": 677

        48

      "note": ""
    },

      "p": 664,

      "fr": "Or il y avoit un Sénateur * appelé Joseph, homme vertueux & juste,",

        "℣. 51. l. qui attendoit aussi le royaume de Dieu."

      "lat": "Hic accessit ad Pilatum, & petiit corpus Jesu.",
