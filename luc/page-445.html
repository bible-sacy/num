t le prochain de ce Juif blessé à mort, lorsqu'il ne le regarda point comme un étranger : <em>Eique se præstitit proximum, quem non deputavit alienum</em> ; c'est-à-dire, que nul ne doit être regardé comme étranger par celui qui sait qu'il est redevable de la charité envers tous.", "marges": ["August. de doctr. chr. l. 1. c. 30.", "August. in Joan. tract. 43[?]"]}, {"versets": [], "texte": "Mais outre ce sens littéral de la parabole, ou de l'histoire du Samaritain, les saints Pères y ont découvert sous l'écorce de la lettre évangélique, tout le mystère de l'Incarnation du Fils de Dieu. Et saint Augustin témoigne, que notre Seigneur J. C. nous donne lieu de reconnoître qu'il est lui-même ce Samaritain, qui a secouru celui qui avoit été laissé tout couvert de plaies & à demi-mort dans le chemin ; c'est-à-dire, qu'il est véritablement à notre égard ce <em>prochain</em> par excellence, qui <em>a usé de miséricorde</em> envers nous, lorsque nous étions réduits à l'extrémité d'un état mortel. Mais il y a, dit le même Saint, cette grande différence entre lui & nous ; qu'il use de miséricorde à notre égard par un pur effet de son infinie bonté ; au lieu que nous autres, nous l'exerçons réciproquement entre nous, pour obtenir sa miséricorde : c'est-à-dire, que s'il a pitié de nous, c'est afin que nous", "marges": ["Id. de doctr. Chr. l. 1. c. 30.", "idem. de verb. Domini serm. 37."]}], "texteGeneral": []}};
