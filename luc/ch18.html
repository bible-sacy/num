          "texte": "Encore que le précepte de la prière s'adresse à tous les fidelles , qui sont unis au corps de JESUS-CHRIST comme ses membres , on peut néanmoins remarquer dans les saintes Ecritures , que ce précepte regarde encore plus particulièrement les veuves , & les engage à s'acquitter de ce devoir avec d'autant plus d'ardeur , qu'étant , en quelque façon , destituées de tout secours & <em>abandonnées , elles ne doivent , comme dit saint Paul , espérer qu'en Dieu.</em> C'est la raison pour laquelle le Sauveur voulant nous montrer qu'il <em>est nécessaire de prier toujours</em> , & de <em>ne se point décourager</em> dans la prière , nous propose ici l'exemple d'une veuve , qui se trouvant accablée par la puissance d'une partie , imploroit la protection d'un juge , & venoit souvent le solliciter pour lui demander justice. Notre partie c'est le démon , c'est le monde , c'est la chair , c'est nous-mêmes. Et toute ame , dit saint Augustin , qui se regarde au milieu du siècle , comme destituée & abandonnée , tant qu'elle est hors de sa patrie qui est le ciel , se considère véritablement comme veuve , & Dieu comme le défenseur de sa viduité ; c'est pourquoi elle a sans cesse recours à lui , pour lui demander par une prière fervente , qu'il la protège tant au-dedans qu'au-dehors d'elle , contre tous ses ennemis qui s'efforcent de la perdre.",

          "texte": "<em>Le Publicain au contraire se tenant bien loin , n'osoit pas même lever les yeux au ciel , mais il frappoit sa poitrine , en disant : Mon Dieu , ayez pitié de moi qui suis un pécheur. Je vous déclare que celui-ci s'en retourna chez lui justifié , &c.</em>",
          "marges": [],
          "p": 595
        },
        {
          "texte": "On voit dans le Publicain un caractère tout opposé à celui du Pharisien. <em>Il se tenoit loin</em> , c'est-à-dire , à l'entrée du temple , par le sentiment qu'il avoit de sa propre indignité. Il ne voyoit en lui-même que des sujets d'humiliation ; & sa conscience lui reprochant ses péchés , il s'éloignoit par respect , autant qu'il pouvoit de ce lieu saint , où Dieu habitoit parmi les hommes , comme dans son sanctuaire. <em>Il craignoit même de lever les yeux vers le ciel</em> , par une sainte confusion qu'il ressentoit d'avoir offensé celui qui y avoit établi le trône de sa puissance. Et il n'osoit , dit saint Augustin , le regarder , pour mériter d'autant plus d'être regardé de celui qui tient ses yeux attentifs pour considérer les ames des humbles. Il ne vouloit point regarder le ciel , parce qu'il se regardoit lui-même pour se déplaire dans ses injustices , & se rendre digne par sa pénitence de plaire à Dieu. Il frappoit aussi <em>sa poitrine</em> pour marquer le brisement de son cœur , & le repentir qu'il avoit de ses péchés , & pour commencer à les punir. Et se sentant tout plongé dans la misère , il se contentoit de dire à Dieu : Qu'il <em>eût pitié d'un pécheur tel qu'il étoit.</em> Voilà donc , dit saint Augustin , une vraie prière ; une prière vraiment humble , & accompagnée de componction. Et ainsi il ne faut point s'étonner si Dieu pardonne à ce pénitent qui se <a class=\"page-inline\" href=\"page-596.html\" title=\"p. 596\">‖</a>reconnoît pécheur , & qui ne se pardonne point à lui-même. Car on ne doit pas s'imaginer , comme le remarque le même Saint , que parce que ce Pharisien se vantoit de ne ressembler pas aux autres hommes , ni même à ce Publicain qui étoit présent , il ne fut point en effet pécheur. Il pouvoit bien n'avoir pas commis ces grands péchés qu'il condamnoit dans les autres : mais le seul élèvement de son cœur étoit un grand crime devant Dieu : <em>Quòd si sine ullis peccatis esset , ipsa superbia crimen erat....</em>",
          "marges": [
            "August. de verb. Domini serm. 36. cap. 2.",
            "Idem. in Psal. 31. to. 8. p. 79."
          ],
          "p": 595
        },
        {
          "texte": "Nous voyons donc , continue ce saint Evêque , deux hommes plaider en quelque façon leur cause devant le juge souverain des consciences. L'un se loue comme étant juste , & accuse avec orgueil tous les autres comme étant pécheurs. L'autre se reconnoît criminel , & confesse avec une profonde humilité sa misère. Ecoutons présentement ce que ce juge suprême prononce sur ce sujet : <em>Je vous déclare</em> , dit JESUS-CHRIST , <em>que ce fut le Publicain qui retourna justifié en sa maison , & non pas le Pharisien</em> ; ou comme le traduisent saint Augustin , & d'autres anciens , que ce premier <em>s'en retourna plus juste que le dernier : Video Publicanum justificatum magis de templo descendere quàm Pharisæum.</em> Car l'humble confession du Publicain lui fit mériter d'être justifié véritablement aux yeux de Dieu : au lieu que la présomption du Pharisien ne lui fit remporter du temple , que sa vaine complaisance en une fausse justice , qui paroissoit seulement à ses propres yeux & à ceux des hommes. Prenons donc garde de n'imiter pas cette superbe confession du Pharisien , qui rendoit grâces à Dieu , mais qui sembloit , dit saint Augustin , ne rien souhaiter de plus que ce qu'il avoit , & se regarder comme étant plein de justice , & n'ayant plus besoin de dire au Seigneur : <em>Pardonnez-nous nos péchés.</em> Cette plénitude présomptueuse d'un cœur enflé de l'idée de sa justice , est infiniment éloignée de l'état dont parle la sainte Vierge , lorsqu'elle dit dans son Cantique : Que <em>Dieu remplit de ses biens ceux qui en sont affamés</em> : & rien n'est plus redoutable , que de se trouver du nombre de ces <em>riches</em> dont elle parle au même endroit , lorsqu'elle ajoute : Qu'<em>il renvoie vides ceux qui sont riches.</em> Car ces faux justes , qui se regardent comme étant remplis des richesses de la vertu , ne demandent point ce qu'ils croient avoir déjà ; & n'étant point <em>affamés</em> ni <em>altérés de la justice</em> , ils <em>ne seront point rassasiés.</em>",
          "marges": [
            "August. de verb. Dom. ser. 36. p. 3.",
            "Luc. 1. 33.",
            "Matth. 5. 6."
          ],
          "p": 596
        },
