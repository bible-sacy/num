 que l'on a quitté ! Quel esclavage , en comparaison de la liberté des enfans de Dieu , dont on jouissoit auparavant ! On l'envoie <em>garder les pourceaux</em> ; ce qui est une expression qui marque le dernier mépris que fait de lui le maître dont il s'est rendu l'esclave , & l'état le plus rabaissé où il le réduit. Car cet animal si sale , qui ne se plaît que dans la boue & dans l'ordure ; est une image de l'état impur de l'ame du pécheur : & si quelque chose est capable de couvrir de honte ces hommes abandonnés à leurs plaisirs , qui font gloire très-souvent de leur propre confusion , est d'être assurés par la vérité de cette parabole , qu'ils sont devant Dieu & aux yeux des Saints , plus rabaissés & plus méprisables , que ne le font au jugement des grands du monde ceux qui gardent les pourceaux. Mais l'expression littérale de l'Evangile nous fait même entendre , selon saint Jérôme , quelque chose de plus fort. Car proprement il est dit qu'il fut envoyé <em>paître</em> les pourceaux. Et c'est à ces animaux impurs que ce Saint compare les démons mêmes , qui se nourrissent en quelque sorte du sang des bêtes , & des victimes qu'ils se font offrir par les hommes ; mais à qui , dit-il , l'homme même est une victime bien plus", "marges": ["Tertull. de pudic. cap. 9.", "Hieron. ep. 146.", "August. quæst. Evangel. l. 2. q. 33.", "Ephes. 6. 12."]}], "texteGeneral": []}};
