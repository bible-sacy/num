    {

      "lat": "Et factum est, cùm esset in quodam loco orans, ut cessavit, dixit unus ex discipulis ejus ad eum : Domine, doce nos orare, sicut docuit & Joannes discipulos suos.",

      "note": [
        {
          "texte": "<em>Un jour, comme il étoit en prière en un certain lieu, après qu'il eut cessé de prier, l'un de ses disciples lui dit : Seigneur, apprenez-nous à prier, ainsi que Jean l'a appris à ses disciples, &c.</em>",
          "marges": [],
          "p": 460
        },
        {
          "texte": "Il est dit ici que ce fut un des disciples, qui touché sans doute par l'exemple de J. C., qu'il voyoit souvent prier, & qui sortoit même actuellement de la prière, lui demanda qu'il voulut bien leur apprendre aussi à prier : au lieu que dans saint Matthieu il semble que c'est J. C. qui leur enseigne de lui-même la manière de prier, en leur donnant plusieurs autres instructions dans le célèbre sermon qu'il leur fit sur la montagne. Mais il peut être arrivé, ou que saint Matthieu se soit contenté de rapporter cette prière que notre Seigneur donna pour modèle à ses disciples, sans marquer l'occasion à laquelle il la donna ; ou même que la leur ayant apprise, sur la demande que lui en fit ce disciple, il en parla de nouveau sur la montagne, à l'occasion de ce qu'il disoit touchant la manière pleine d'ostentation dont les hypocrites affectoient de prier au coin des rues, afin d'être vus des hommes.",
          "marges": [
            "Matt. 6. 9."
          ],
          "p": 460
        },
        {
          "texte": "Il est étonnant qu'on ne voie point dans l'Evangile, que les Apôtres ni les disciples ayent jamais prié, quoiqu'ils fussent si souvent témoins de la prière de leur divin maître. Aussi il leur reprocha dans le jardin des oliviers, où ils auroient dû plutôt prier, & où même il les en avoit pressés, qu'ils n'avoient pu veiller avec lui dans la prière pendant seulement une heure. Car il les trouva toujours dormans, & accablés de sommeil : ce qui <a class=\"page-inline\" href=\"page-461.html\" title=\"p. 461\">‖</a>donne lieu d'être moins surpris de la faute où tomba depuis S. Pierre, qui après s'être vanté de mourir pour J. C., & lui avoir entendu dire, Qu'il falloit <em>veiller & prier, pour n'entrer point dans la tentation</em>, négligea d'avoir recours à ce remède, qui auroit été capable de le préserver d'une telle chute.",
          "marges": [
            "Matt. 26. 40. 41. 43.",
            "v. 35. [?]"
          ],
          "p": 460
        },
        {
          "texte": "On voit cependant que la prière étoit en très-grand usage parmi les justes de l'ancienne loi. David, Daniel, Tobie, Esther, & tant d'autres nous en ont laissé dans les Ecritures d'excellens modèles, que l'Eglise met tous les jours dans la bouche de ses enfans. Mais les Apôtres, accoutumés à la présence corporelle de J. C., & appuyés sur l'assistance de celui qui étoit toujours visible à leurs yeux, faisoient paroître en quelque façon moins de foi que les Anciens. Ce fut pour cette raison qu'il leur déclara un jour : Qu'il <em>leur étoit avantageux qu'il s'en allât</em>, & qu'il les quittât, <em>afin qu'il leur envoyât son</em> Saint-Esprit, qui <em>leur apprendroit toute vérité</em>, & particulièrement celle qui regarde la nécessité de la prière.",
          "marges": [
            "Joan. 16. 7. 13."
          ],
          "p": 461

        {
          "texte": "Cependant le Fils de Dieu met dans l'esprit du disciple dont on a parlé, de lui demander qu'il voulut bien leur apprendre la manière de prier, <em>ainsi que Jean l'avoit appris à ses disciples</em> ; afin que ce lui fut une occasion de donner cet excellent modèle de prière à toute l'Eglise. Nous ne voyons point ailleurs que saint Jean-Baptiste ait donné à ses disciples aucunes instructions sur la prière. Mais nous ne pouvons douter qu'il ne l'ait fait, puisque les disciples de J. C. l'assurent ici, & se servent même de l'exemple du serviteur, pour porter le maître à leur accorder ce qu'ils demandoient. Quant à la prière que le Sauveur leur prescrit, quoique saint Luc semble avoir omis une partie de celle qui est rapportée dans saint Matthieu, elle est néanmoins la même. Et il est assez ordinaire qu'un Evangéliste dise en abrégé ce qu'un autre dit plus au long ; ainsi qu'on le voit encore en ce qui regarde les béatitudes, qui ne sont qu'au nombre de quatre dans saint Luc, quoiqu'elles soient au nombre de huit dans S. Matthieu. C'est donc la même chose en substance, quoique plus en abrégé dans saint Luc. Comme on l'a déjà expliqué ailleurs, il suffit d'y renvoyer.",

      "note": [
        {
          "texte": "<em>Si quelqu'un d'entre vous avoit un ami, & qu'il l'allât trouver au milieu de la nuit, pour lui dire : Mon ami, prêtez-moi trois pains, parce qu'un de mes amis, qui est en voyage, vient d'arriver chez moi, & je n'ai rien à lui donner, &c.</em>",
          "marges": [],
          "p": 461

        {
          "texte": "J. C. après avoir enseigné à ses disciples à prier, leur apprend ici la persévérance dans la prière : & il se sert pour cela d'une <a class=\"page-inline\" href=\"page-462.html\" title=\"p. 462\">‖</a>parabole, ou d'une comparaison familière d'un homme, qui étant surpris pendant la nuit par l'arrivée imprévue d'un ami, iroit trouver un autre ami pour le prier de lui prêter quelques pains, & le presseroit si fort de lui faire cette grâce, qu'il l'obligeroit par son importunité à lui accorder ce qu'il lui auroit refusé d'abord, à cause de l'heure indue, sa maison étant fermée, & tout son monde couché. Tout est aisé à entendre, pour ce qui regarde le sens littéral de la parabole. Mais on en peut faire l'application de cette sorte. Nous n'avons point, comme dit admirablement saint Amboise, un meilleur ami que celui qui a livré son propre corps pour l'amour de nous : <em>Quis amicior nobis, quàm qui pro nobis corpus suum tradidit ?</em> C'est celui-là, dit saint Bernard, qu'on peut appeler notre grand ami, puisque nul autre que lui ne nous a jamais témoigné un plus grand amour, & qu'étant plus riche sans comparaison qu'aucun autre, il est plus puissant pour nous assister. S'il se compare en quelque façon à un homme, qui refuse d'abord son ami, & qui enfin ne lui accorde ce qu'il demande, qu'étant vaincu par son importunité ; ce n'est pas qu'il n'ait par lui-même la volonté d'écouter notre prière : car, comme dit excellemment saint Augustin, il ne nous exhorteroit pas avec tant de force à demander, s'il n'avoit dessein de nous donner ce qu'il veut que nous lui demandions : & il a même une plus grande volonté de nous donner que nous de recevoir ; un plus grand désir de nous faire miséricorde, que nous d'être délivrés de notre misère. C'est donc qu'il veut nous faire connoître plus sensiblement par cette sorte de comparaison, quoiqu'infiniment disproportionnée à l'ardeur de son amour, que pour obtenir un aussi grand bien que celui que nous demandons, qui n'est autre que lui-même, puisqu'il n'a rien de plus grand à nous donner, il est besoin de demander avec instance, de chercher persévéramment, & de frapper, jusqu'à ressembler en quelque sorte à cet homme, qui n'obtint ce qu'il vouloit que par son importunité, & par une espèce de violence : <em>Pulsare usque ad similitudinem improbitatis.</em> David demandoit <em>pendant la nuit</em>, dit S. Ambroise, à cet ami tout-puissant, <em>les pains</em> dont il est parlé ici, lorsqu'il disoit au Seigneur, <em>Qu'il se levoit au milieu de la nuit pour le louer</em> ; & ailleurs, <em>Qu'il lavoit son lit & l'arrosoit de ses larmes toutes les nuits.</em> Il ne craint point de réveiller & d'importuner cet ami dans son sommeil, parce qu'il savoit que celui qui garde Israël veille toujours ; & qu'il étoit persuadé que cette importunité & cette espèce de violence qu'on fait à Dieu par ses larmes, par ses veilles, & par ses gémissemens, lui est agréable à <a class=\"page-inline\" href=\"page-463.html\" title=\"p. 463\">‖</a><em>Hæc vis Deo grata est</em>, dit Tertullien. Appliquons-nous donc à la prière jour & nuit selon que nous y exhorte S. Ambroise, & demandons à celui qui veut bien nous appeler dans l'Evangile <em>ses amis</em>, qu'il nous accorde le pardon de nos péchés, afin qu'étant comme des voyageurs, lassés & fatigués du chemin, nous soyons nourris d'un pain qui fortifie notre cœur, & qui nous soutienne. C'est nous qui sommes à nous-mêmes cet <em>ami qui est en voyage</em>, tandis que nous sommes engagés dans le cours de cette vie pénible, & exposée à tant de périls. Nous n'avons point de plus proches que nous mêmes ; & c'est pour nous que nous demandons ces pains dont il est parlé dans la parabole : <em>Ego quidem</em>, dit saint Bernard, <em>amicum venientem ad me non alium intelligo, quàm me ipsum. Nemo quippe carior mihi, nemo germanior est.</em>",

        {
          "texte": "Ces trois pains peuvent nous marquer, selon l'explication de saint Augustin, la très-sainte Trinité, dont chaque personne divine, le Père, le Fils, & le Saint-Esprit, doit être éternellement le pain, la nourriture, & la vie des Saints dans le ciel ; <em>Cibus & panis æternus, & Pater, & Filius, & Spiritus Sanctus.</em> Commencez donc à vous nourrir ici-bas, & à vivre de ce qui doit vous nourrir & vous donner une vie divine dans toute l'éternité. Dieu n'a rien de plus excellent à vous donner que soi-même. Seriez-vous assez avare pour vouloir encore chercher autre chose ? Et qu'y a-t-il qui soit capable de vous contenter, si Dieu même ne le peut pas ? <em>Quid tibi sufficit, cui Deus non sufficit ?</em> Mais il est besoin, ajoute le même Saint, que vous ayez la charité, la foi, & l'espérance ; afin que Dieu même, qui se donne à vous, vous puisse être doux & agréable. Et ces trois pains vous sont nécessaires pour vous soutenir dans le voyage de cette vie. Ils sont eux-mêmes des dons de Dieu, c'est-à-dire, que c'est à Dieu, comme à celui qui vous a aimés jusqu'à livrer son propre Fils à la mort, que vous devez les demander avec une sainte ardeur, & une fidelle persévérance, puisqu'il n'appartient qu'à lui de vous les donner.",

e, <em>le pain vivant descendu du ciel, sans lequel on ne peut avoir la vie en soi</em>, & avec lequel <em>on ne meurt point, lorsqu'on s'en nourrit</em> véritablement.",

      "note": [
        {
          "texte": "<em>Lorsqu'il disoit ces choses, une femme élevant sa voix du milieu du peuple, lui dit : Heureuses sont les entrailles qui vous ont porté, & les mamelles qui vous ont nourri ! &c.</em>",
          "marges": [],
          "p": 464
        },
        {
          "texte": "Lorsque les Pharisiens & les Docteurs de la loi s'efforçoient de décrier les miracles du Sauveur par des impostures & des blasphèmes, une femme du milieu du peuple sert d'organe au Saint-Esprit, pour confondre leur malice. La simplicité de cette femme lui servoit à lui faire voir & à admirer ce qu'il y avoit de surnaturel dans la conduite de JESUS-CHRIST : au lieu que la jalousie aveugloit ces hommes superbes, qui aimoient mieux attribuer au démon & au prince des démons ce qu'il faisoit de divin en faveur des hommes, qu'à la puissance de Dieu. Autant donc que ces Pharisiens étoient criminels, de s'aveugler volontairement pour décrier les œuvres miraculeuses de J. C., autant cette femme étoit digne de louanges, de n'avoir pas seulement admiré avec tous les peuples ce qu'il faisoit & ce qu'il leur enseignoit d'une manière si divine, mais d'avoir même osé rendre un témoignage si public de son admiration, lorsque ceux qui gouvernoient la Religion des Juifs se déclaroient avec tant d'animosité contre sa doctrine & sa conduite.",

          "p": 464
        },
        {
          "texte": "Aussi Tertullien se sert du même passage que nous expliquons, pour prouver que la sainte Vierge étoit véritablement sa mère. Car il faut bien remarquer avec ce grand homme, & avec saint Augustin, que la réponse que le Fils de Dieu fait à cette femme, en lui disant : <em>Mais plutôt heureux sont ceux qui entendent la parole de Dieu, & qui la pratiquent</em>, ne tend pas, comme ont osé l'enseigner plusieurs hérétiques, à nier la maternité de Marie, c'est-à-dire, le bonheur qu'elle avoit d'être mère de J. C., selon la chair ; mais à préférer seulement à cette maternité charnelle, une autre sorte de maternité qui étoit selon l'Esprit, & qui consistoit à accomplir fidellement la volonté de son Père qui est dans le ciel. Et que nous enseignoit-il en cela autre chose, dit saint Augustin, sinon que la proximité que nous avons avec lui selon l'esprit & selon la grâce, est préférable à celle qui seroit seulement selon la chair ; & que les hommes ne sont pas heureux pour être unis à des Saints seulement selon le sang, mais pour avoir une véritable union avec eux, en pratiquant leur doctrine, & en imitant leurs mœurs ? Marie a donc été plus heureuse en recevant la foi de JESUS-CHRIST dans son cœur, qu'en concevant la chair de J. C. dans son sein. Et en effet, de quoi a servi aux parens du Fils de Dieu selon la chair, qui ne crurent point en lui, cette affinité temporelle ? Ainsi il n'auroit non plus servi de rien à Marie d'être la mère du Sauveur du monde, si elle n'avoit été plus heureuse encore de le porter dans son cœur, que de le porter dans sa chair : <em>Sic & materna propinquitas nihil Mariæ profuisset, nisi felicius Christum corde quàm carne gestasset.</em>",

      "note": [
        {
          "texte": "<em>Si donc votre corps est tout éclairé, n'ayant aucune partie ténébreuse, tout sera lumineux, & il vous éclairera comme une lampe brillante.</em>",
          "marges": [],
          "p": 466
        },
        {
          "texte": "Nous avons vu en expliquant saint Matthieu, que le Fils de Dieu entend par cet <em>œil</em> dont il parle ici, l'intention avec laquelle nous agissons, qui étant pure & ne tendant qu'à ce qui doit être sa fin, rend bonnes toutes les œuvres qui y sont conformes. Ce que saint Luc ajoute présentement à ce qui est rapporté dans saint Matthieu, paroît obscur, en ce qu'il semble que ce soit une répétition inutile de la même chose, & comme une conséquence qui ne conclut rien du principe d'où elle est tirée, sinon le principe même. On pourroit peut-être expliquer la Vulgate par le texte grec de cette sorte : <em>Si votre corps</em>, qui signifie toute la suite de vos actions, <em>est tout éclairé</em> ; c'est-à-dire, si toutes vos œuvres ont pour fondement la vérité, & pour principe la charité, <em>sans qu'il y ait une partie ténébreuse</em>, ou sans que la cupidité y ait part, <em>tout sera lumineux</em> ; c'est-à-dire, que toute votre conduite ne sera plus que comme un corps de lumière sans tache, & qu'il deviendra à votre égard <em>comme une lampe, dont l'éclat brillant vous éclairera.</em> Car alors ce n'est pas <em>l'œil</em> seulement & l'intention de votre cœur qui sert à vous éclairer : mais toutes vos œuvres étant lumière elles-mêmes, par la participation de cette première lumière qui les a rendues lumineuses, deviennent comme une lampe éclatante, qui ne vous sert pas seulement à vous-même, mais encore aux autres. Et il est vrai en effet que toute la <a class=\"page-inline\" href=\"page-467.html\" title=\"p. 467\">‖</a>vie d'un juste qui agit par le principe de la charité, lui sert pour le soutenir ; une de ses œuvres lui étant comme un moyen pour passer plus facilement à une autre, & tout ce qu'il fait lui facilitant ce qu'il a à faire. Mais elle sert encore beaucoup aux autres, pour les porter à glorifier l'auteur souverain de ce qu'il y a de bon dans toutes ces œuvres ; <em>toute grâce excellente & tout don parfait venant d'en haut</em>, comme dit saint Jacques, <em>& descendant du Père des lumières.</em> Et c'est en cela que la parole de JESUS-CHRIST se vérifie, lorsqu'il dit à ses disciples : <em>Que votre lumière luise devant les hommes, afin que voyant vos bonnes œuvres, ils glorifient votre Père qui est dans le ciel.</em>",

      "note": [
        {
          "texte": "<em>Pendant qu'il parloit, un Pharisien le pria de dîner chez lui : & lui y étant entré, & s'étant mis à table, le Pharisien commença à dire en lui-même : Pourquoi ne s'est-il point lavé avant le dîner ?</em>",
          "marges": [],
          "p": 467
        },
        {
          "texte": "On a vu dans saint Matthieu & dans saint Marc, que les Pharisiens & tous les Juifs ne mangeoient point sans avoir souvent lavé leurs mains ; & que suivant en cela la tradition des Anciens avec une attache superstitieuse, ils négligeoient les préceptes les plus importans ; tout occupés de la pureté qui n'étoit qu'extérieure, & indifférens pour celle du cœur. C'est la même chose qui arrive ici à ce Pharisien, lorsqu'ayant prié JESUS-CHRIST de dîner chez lui, il le voit se mettre à table sans avoir lavé ses mains. Car il commença à murmurer & à dire secrètement en lui-même, qu'il n'auroit pas dû manger sans s'être lavé auparavant. JESUS-CHRIST répond aussitôt à sa pensée. Et il semble que cela seul auroit dû suffire pour convaincre ce Pharisien, que celui dont il blâmoit la conduite, étoit au moins quelque grand Prophète ; puisqu'il pénétroit ainsi le fond des cœurs. Mais l'orgueil des Pharisiens, des Prêtres & des Docteurs de la loi étoit tel, que ce qui auroit été capable d'en convertir beaucoup d'autres, servoit au contraire à les endurcir. C'est la raison pour laquelle le Sauveur ne craignit point, quoiqu'il fut à la table de ce Pharisien, de le traiter <em>d'insensé</em>, en lui découvrant le fond de son cœur tel qu'il étoit, c'est-à-dire, <em>plein de rapine & d'iniquité</em>, plein d'avarice, d'injustices & d'hypocrisie. Et il ne pouvoit, dit saint Augustin, lui témoigner un plus grand amour qu'en le traitant durement, & qu'en le piquant d'une manière très-vive, comme un malade accablé de léthargie, qui avoit besoin d'être réveillé de son assoupissement. <em>Magis objurgando pepercit. Insensés</em>, dit-il, <em>celui qui a fait le dehors n'a-t-il pas fait aussi le dedans ?</em> C'est-à-dire : Pourquoi paroissez-vous si scrupu<a class=\"page-inline\" href=\"page-468.html\" title=\"p. 468\">‖</a>leux à purifier le dehors, dans le temps même que vous négligez si fort le dedans ? Dieu n'est-il pas créateur du dedans, comme du dehors ? Et croyez-vous qu'il ne soit pas sans comparaison plus jaloux de la pureté du cœur, que de la netteté de l'extérieur ? Ce ne sont point les impuretés extérieures qui salissent l'homme ; mais ce sont celles qui sortent du cœur, comme des effets de sa volonté criminelle.",

          "marges": [],
          "p": 468
        },
        {
          "texte": "JESUS-CHRIST venoit de dire aux Pharisiens, Que <em>leur cœur étoit rempli de rapine & d'iniquité.</em> Après donc leur avoir représenté l'état déplorable où ils étoient devant Dieu, il ne les abandonne pas entièrement ; mais il leur propose un excellent remède pour se purifier des souillures de leur cœur ; c'étoit celui-ci : <em>Donnez l'aumône, & toutes choses vous seront pures.</em> Cependant, dit saint Augustin, les Pharisiens n'avoient point été lavés par le baptême de JESUS-CHRIST, & n'avoient point la foi en ce Fils unique de Dieu, qui marchoit au milieu d'eux sans qu'ils le connussent. Comment donc leur dit-il ici : <em>Donnez l'aumône, & toutes choses vous seront pures ?</em> Si ces Pharisiens qui s'étoient rendus dociles à sa voix, avoient fait l'aumône, toutes choses leur seroient-elles devenues pures, sans qu'il eut été besoin qu'ils crussent en lui ? Ou s'il est vrai au contraire, qu'ils ne pouvoient devenir purs, à moins qu'ils ne crussent en celui qui purifie le cœur par la foi ; que veut donc dire : <em>Donnez l'aumône, & toutes choses vous seront pures ?</em> Considérons ce qui suit, & nous trouverons peut-être que le Fils de Dieu s'explique lui-même. Après qu'il leur eut parlé de la sorte, ils songèrent aussitôt sans doute aux aumônes qu'ils faisoient. Et quelles aumônes, ajoute saint Augustin ? Des aumônes qui surpassoient celles de la plupart des Chrétiens ; puisqu'ils donnoient si exactement la dixme des moindres choses selon qu'elles sont marquées ici. Considérant donc tant d'aumônes qu'ils distribuoient, ils crurent peut-être que notre Seigneur JESUS-CHRIST leur donnoit en vain ce précepte, comme s'ils ne s'en fussent pas déjà acquittés ; & ils se railloient intérieurement de lui, dit ce Père, comme d'un homme qui parloit en l'air. Mais lui connoissant leurs plus secrètes pensées, ajouta dans le moment : <em>Malheur à vous, Pharisiens, qui payez la dixme de la menthe, &c.</em> ce qui est de même que s'il leur eut dit : Je fais vos aumônes dont vous vous glorifiez, & toutes les dixmes que vous payez : <em>mais vous négligez en même-temps la justice &</em> <a class=\"page-inline\" href=\"page-469.html\" title=\"p. 469\">‖</a><em>l'amour de Dieu.</em> Ce n'est pas là faire l'aumône, ainsi que je vous l'ordonne. Il faut pratiquer avant toutes choses, la justice, la charité, & la miséricorde. <em>Faites</em> donc <em>l'aumône</em> ; faites miséricorde. Et qu'est-ce que faire miséricorde ? Si vous le comprenez bien, commencez à la faire par vous-mêmes. Car comment pourriez-vous être miséricordieux envers un autre, étant cruels envers vous ? Faites une aumône véritable, ayant d'abord compassion de votre ame par le soin avec lequel vous travaillerez à plaire à Dieu. Si vous négligez cette aumône si nécessaire, donnez de vos biens tant que vous voudrez ; <em>payez</em>, non la dixme, mais la moitié de vos revenus ; ne vous réservez, si vous voulez, que la neuvième partie, donnant tout le reste aux pauvres : vous ne faites rien, lorsque vous vous oubliez vous-mêmes.",
          "marges": [
            "Ibid. c. 1.",
            "ib. c. 3.",
            "Ib. c. 4."
          ],
          "p": 468
        },
        {
          "texte": "Telle est la manière dont saint Augustin a développé le sens des paroles de J. C. que nous expliquons. Mais il semble qu'on peut dire encore, selon un sens assez naturel de ces paroles du Sauveur : Qu'invitant les Pharisiens à faire l'aumône après les avoir accusés de <em>rapine</em>, & d'<em>iniquités</em>, il leur enseignoit à commencer, comme Zachée, par les restitutions & par les aumônes, qui étant déjà de dignes fruits de pénitence & de foi, auroient ensuite la force de <em>les purifier</em>, en leur attirant de plus grandes grâces, & leur faisant mériter que le Fils de Dieu leur dit ainsi qu'au même Zachée : <em>Ceux-ci sont aussi enfans d'Abraham : & c'est pour cela qu'ils ont reçu le salut.</em>",

      "p": 459,

      "note": [
        {
          "texte": "<em>Alors un des Docteurs de la loi prenant la parole, lui dit : Maître, en parlant ainsi vous nous traitez injurieusement nous-mêmes.</em>",
          "marges": [],
          "p": 469
        },
        {
          "texte": "Il y avoit une grande liaison entre les Pharisiens & les Docteurs de la loi, qui s'appuyoient mutuellement. Les Pharisiens observoient très-exactement les décisions des Docteurs, à qui il appartenoit d'enseigner, & d'interpréter la loi. Et ces Docteurs relevoient par de grands éloges la sainteté des Pharisiens, qui faisoient profession d'une vie plus austère & plus régulière que les autres Juifs. Ainsi l'union qui étoit entre eux les portoit à conspirer tous ensemble contre J. C., dont les maximes si pures & si relevées ne s'accordoient nullement avec les ordonnances toutes humaines de ces Docteurs relâchés, & dont la profonde humilité & la lumière si pénétrante condamnoient l'orgueil & la justice apparente des Pharisiens, ces faux dévots. C'est donc pour cette raison, <em>qu'un des Docteurs de la loi</em>, voyant les reproches si sensibles que le Fils de Dieu faisoit aux Pharisiens touchant leur hypocrisie & tout le reste de leur conduite, l'in<a class=\"page-inline\" href=\"page-470.html\" title=\"p. 470\">‖</a>terrompit pour lui dire, <em>Qu'en parlant ainsi contre les Pharisiens, il les traitoit injurieusement eux-mêmes</em>, qui étoient unis de conduite, & de sentimens avec eux. Aussi J. C. qui étoit venu dire aux hommes la vérité, sans flatter personne, ne ménagea pas non plus ceux qui se regardoient comme les maîtres des autres ; mais il leur parla avec toute la force qu'il savoit être nécessaire pour abaisser cette enflure de leur cœur.",

      "note": [
        {
          "texte": "<em>Malheur à vous, Docteurs de la loi, qui vous êtes saisis de la clef de la science, & qui n'y étant point entrés vous-mêmes, l'avez encore fermée à ceux qui vouloient y entrer.</em>",
          "marges": [],
          "p": 470
        },
        {
          "texte": "Les Anciens ont entendu, par cette <em>clef de la science</em>, l'interprétation des Ecritures. Et c'est une métaphore prise du langage ordinaire, où l'on dit, que pour entrer en un lieu fermé, il faut en avoir la clef. Les livres saints étoient fermés au commun des hommes, à cause de l'obscurité qui leur en cachoit l'intelligence. Et c'étoit à ceux qui avoient été établis sur la chaire de Moyse, comme parle J. C., à leur ouvrir, pour le dire ainsi, ces livres sacrés, en leur expliquant ce qu'ils n'y pouvoient entendre. Aussi c'étoit autrefois une coutume parmi les Hébreux, de mettre une clef entre les mains de celui à qui on donnoit le pouvoir d'interpréter & la loi & les Prophètes ; comme pour marquer par cette sorte de cérémonie, qu'on l'en mettoit en possession.",

          "p": 470

      "note": [
        {
          "texte": "<em>Comme il leur parloit de la sorte, les Pharisiens & les Docteurs de la loi commencèrent à le presser avec de fortes instances, & à l'accabler par la multitude des choses sur lesquelles ils l'obligeoient de répondre.</em>",
          "marges": [],
          "p": 471
        },

          "texte": "Il est dit d'Etienne le premier martyr, qu'étant plein de grâce & de force, il faisoit de grands prodiges ; & que quelques-uns de la synagogue ayant voulu disputer contre lui, ils ne pouvoient résister à la sagesse & à l'esprit qui parloit par ce grand Saint. Quel effet donc ne dut point produire sur l'esprit des Pharisiens & des Docteurs de la loi, la force toute divine avec laquelle le maître même leur parla, pour leur découvrir leur hypocrisie & toute la corruption de leur cœur, puisque les paroles du disciple eurent tant de force pour confondre ses ennemis ? Aussi ils entrèrent dans une telle fureur contre J. C., que ne gardant plus aucune mesure, ils commencèrent à lui parler tous ensemble, & à lui faire tumultuairement mille demandes, auxquelles ils le pressoient de répondre. Car comme ils le regardoient avec des yeux pleins d'une jalousie diabolique, qui les empêchoit de connoître sa divinité, ils s'imaginoient l'embarrasser comme un autre homme par la multitude des questions qu'ils lui faisoient, & l'engager dans quelque sorte de surprise, qui pourroit leur donner lieu de l'accuser. <em>Ils lui dressoient donc des piéges</em>, dit l'Evangéliste. Mais plutôt <em>c'étoit à leur propre sang</em>, comme dit le Sage, <em>qu'ils tendoient des embûches</em> ; & s'ils <em>dressoient des piéges</em>, c'étoit <em>pour perdre leurs propres ames.</em> Car que pouvoit toute la malice, avec toute la fureur de ces phrénétiques, contre la sagesse de l'Homme-Dieu ? C'étoient des flots de la mer, qui vont se briser contre un rocher, & qui ne produisent que de l'écume.",
