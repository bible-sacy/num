rs. Vous êtes, Marthe, occupée à plusieurs choses : mais une seule est nécessaire ; & c'est celle-là que Marie a choisie. Le travail qui embrasse beaucoup de choses passera : mais la charité qui nous attache à l'unique chose nécessaire demeure toujours : <em>Transit labor multitudinis, & remanet caritas unitatis.</em> Ce que Marie a choisi ne lui sera donc point ôté. Et par conséquent ce que vous avez choisi, Marthe, vous sera ôté. Mais il ne vous sera ôté, qu'afin que ce qu'il y a de meilleur vous soit donné. On vous ôtera le travail présent, pour vous établir dans le repos ».", "marges": ["ib. ser. 26. c. 2.", "ib. ser. 27. c. 2.", "Joan. 1. 1.", "ib. v. 14.", "Ps. 72. 28."]}, {"versets": [], "texte": "Travaillons donc, dit saint Ambroise, à avoir nous-mêmes ce qui ne pourra nous être ôté ; à écouter la parole éternelle, non comme en passant, mais avec un cœur vraiment attentif. Car la semence de cette divine parole est ôtée du cœur de ceux où elle est semée, comme le long du chemin. Soyez possédés uniquement, comme Marie, du désir de la sagesse. Car c'est l'exercice le plus grand & le plus parfait. Que le soin du ministère extérieur ne vous détourne point de la connoissance de la parole", "marges": ["Ambr. in hunc loc."]}], "texteGeneral": []}};
