  const SACY_PAGE = {"meta": {"livre": "luc", "livreFr": "Évangile de saint Luc", "livreAbr": "Lc", "imageUrl": "https://bible.sacy.be/pngs-nt-1-trimmed/trimmed-marc_et_luc/trimmed-marc_et_luc-557.png", "facSlug": "luc", "prev": 543, "next": 545}, "page": {"fichier": 557, "p": 544, "imprime": 544, "chapitre": 15, "coupureDebut": true, "coupureFin": true, "sommaire": "", "titres": [], "versets": [], "margesBible": [], "notesBas": [], "commentaire": [{"versets": [], "texte": "l'enfant prodigue ne dit à son père qu'une partie de ce qu'il avoit prémédité. Il lui témoigne qu'il avoit péché contre le ciel & contre lui , & qu'il n'étoit pas digne d'être appelé son fils ; parce qu'il reconnoissoit effectivement avoir dérogé à cette glorieuse qualité par une vie si indigne : mais il s'arrête tout court , & n'ajoute point ce qu'il avoit résolu d'abord de lui dire , Qu'il le mît au rang de ses serviteurs. Car lorsqu'il manquoit de pain , dit ce Saint , il eut souhaité d'être au moins comme l'un de ceux qui servoient dans la maison de son père. Mais après avoir reçu le baiser de ce père si aimable , il conçoit des sentimens plus généreux , & ne parle plus d'être du nombre des mercenaires. Il ose même , dit saint Jérôme , le nommer son père dans le temps qu'il reconnoît être indigne d'être appelé son fils ; & ce nom échappe en quelque façon à l'instinct de la nature : <em>Ex naturæ voce.... in nomen trepidus veritatis erumpit.</em>", "marges": ["Hieron. ut supr."]}, {"versets": [22, 23, 24], "texte": "<em>Alors le père dit à ses serviteurs : Apportez promptement sa première robe , & l'en revêtez , & mettez-lui un anneau au doigt , & des souliers à ses pieds. Amenez aussi le veau gras , & le tuez , &c.</em>", "marges": []}, {"versets": [], "texte": "Par cette <em>première robe</em> , dont il est parlé ici , nous pouvons entendre tout simplement une robe conforme à la qualité de cet enfant , & dont il avoit accoutumé d'être vêtu avant que d'avoir quitté la maison de son père. <em>L'anneau qu'on mettoit au doigt</em> , étoit en orient une marque de dignité , comme il paroît par plusieurs endroits de l'Ecriture. Et les <em>souliers</em> , selon quelques-uns , n'étoient pas portés en ces pays-là par toutes sortes de personnes. Mais peut-être aussi qu'il en est parlé sans autre raison , sinon à cause que celui qui revenoit étoit alors dans l'état le plus misérable & le plus pauvre qu'on puisse imaginer. Les Pères ont entendu dans le sens spirituel par cette <em>première robe</em> , celle qu'Adam perdit en péchant ; celle qui est appelée ailleurs la robe nuptiale , sans laquelle on ne peut point se trouver au festin du Roi ; celle dont le Fils de Dieu nous avertit de ne nous pas dépouiller , <em>de peur que nous ne marchions nus & que nous n'exposions aux yeux des autres notre confusion & notre nudité.</em> C'est cette robe que nous avons tous reçue dans notre baptême , selon ce que dit l'Apôtre : Que <em>tous ceux qui ont été baptisés en</em> J. C. <em>ont été revêtus de</em> J. C. ; ou comme il dit autre part , qu'ils <em>ont été revêtus de l'homme nouveau , créé selon Dieu , dans une justice , & dans une sainteté véritable.</em> C'est donc cette sainteté & cette justice que nous recevons dans le baptême par un effet de l'Incarnation & de la mort de J. C. Car c'est lui qui est le nouvel Adam , <em>créé</em> , selon son humanité ,", "marges": ["Gen. 41. 42.", "Jacob. 2. 2.", "Ambr. in hunc loc.", "Hieron. & Aug. ut supr.", "Matt. 21. 22.", "Apoc. 16. 15.", "Galat. 3. 27.", "Ephes. 4. 24."]}], "texteGeneral": []}};
