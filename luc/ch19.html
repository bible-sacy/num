        {
          "texte": "C'est une continuation de la métaphore dont se servoit J. C. , pour représenter quel seroit le châtiment des Juifs incrédules & rebelles à l'Evangile , qui refusèrent toujours de se soumettre à son empire. Car comme les Rois punissent de mort la rebellion de leurs sujets , aussi celui que les Juifs avoient rejeté , quoiqu'il fut leur Roi à un titre incontestable , ne pouvoit manquer de punir leur obstination selon les règles de sa justice. Il est vrai que lorsqu'il <a class=\"page-inline\" href=\"page-609.html\" title=\"p. 609\">‖</a>lorsqu'il est sur la croix, il demande à Dieu son père qu'il leur pardonne, parce qu'ils ne savent ce qu'ils font. Et en priant de la sorte, il envisageoit principalement ceux qui devoient se reconnoître, & recevoir sa miséricorde. Mais ici il prononce en Juge un arrêt contre toute la nation, & il prédit ce qui devoit certainement arriver un jour. Car il <em>les fit amener</em> en quelque façon à Jérusalem où il alloit, & <em>les fit tous mourir devant lui ;</em> lorsque par un effet tout visible de sa justice, ils s'y rassemblèrent à l'occasion de la grande Fête sous l'empire de Vespasien, & y furent renfermés au nombre de plus de douze cents mille personnes, pour y devenir devant le temple, & dans le temple même, les victimes de la colère de Dieu. Mais on peut bien ajouter que ce qui leur arriva dans cette effroyable désolation, n'étoit encore qu'une image du châtiment éternel qui leur étoit préparé en l'autre monde, pour n'avoir pas reconnu le temps favorable de la visite du Seigneur. Ils rejetèrent le règne de J. C., qui étoit un règne de miséricorde & de grâce. Mais en refusant qu'il régnât au fond de leurs cœurs, ils n'ont pas pu empêcher qu'il n'ait <em>exercé à leur égard,</em> selon l'expression du Roi prophète, <em>un règne de fer, & qu'il ne les ait brisés comme un vase du Potier.</em> Qu'est-ce en effet que toute la force des hommes superbes, qui se révoltent contre le règne de J. C., & qui ne peuvent se
