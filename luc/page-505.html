ré de Dieu. C'étoit donc entendre bien mal en quoi consistoit la véritable observation du sabbat ; ou pour mieux dire, c'étoit se tromper bien visiblement soi-même, & les autres avec soi, de prétendre faire ainsi servir le commandement de Dieu touchant le jour du sabbat, à détruire dans l'esprit des peuples la gloire même de Dieu, lorsqu'elle se manifestoit en ces saints jours d'une manière si éclatante. Aussi il est remarquable, que ce chef de la synagogue n'osa pas s'adresser à J. C. & qu'il feignit même de respecter en quelque façon ses miracles, en disant aux peuples de venir les jours destinés au travail <em>pour être guéris</em> : car il n'étoit pas en son pouvoir de nier des œuvres si merveilleuses, & si visibles à tout le monde.", "marges": []}, {"versets": [], "texte": "Mais le Fils de Dieu qui pénétroit le fond des cœurs, prit la parole pour ces peuples qu'on vouloit tromper, & il appela d'abord <em>hypocrite</em>, ce chef de la synagogue ; parce qu'il savoit que ce n'étoit point le zèle & la gloire du Seigneur, & de la sanctification du sabbat, mais la jalousie qui l'animoit, & qui le faisoit parler. Il étoit donc hypocrite, en ce qu'il feignoit vouloir faire rendre gloire à Dieu en ce saint jour, & qu'il s'efforçoit en même-temps de détruire la gloire éclatante des actions de son Fils ;", "marges": []}], "texteGeneral": []}};
