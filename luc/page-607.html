'entre les morts , l'a fait asseoir à sa droite dans le ciel , au-dessus de toutes les Principautés & de toutes les puissances.... a mis toutes choses sous ses pieds , & l'a établi le chef de toute l'Eglise.</em> Tel est <em>le royaume</em> incorruptible décrit dans les prophéties de Daniel dont il est allé prendre possession dans les cieux , <em>pays</em> sans doute terriblement <em>éloigné</em> à notre égard. Or il est allé en ce pays éloigné pour <em>en revenir</em> , mais il ne reviendra que long-temps après , c'est-à-dire , à la fin du monde ; & c'est peut-être ce qui contribue à rendre encore ce <em>voyage d'une si grande longueur.</em>", "marges": ["Bible de Vitré. Append. ad Chron. sac. pag. 84.", "Ephes. 1. 17. 20.", "Dan. 7. 13."]}, {"versets": [], "texte": "Les <em>dix serviteurs</em> qu'il <em>appela</em> avant qu'il partît , nous marquent , & les Apôtres , & tous les autres Ministres de la loi nouvelle , qu'il a rendus en quittant la terre pour monter au ciel , les dépositaires de ses trésors , & des dons de son Esprit , afin qu'ils <em>les fissent profiter</em> par un saint commerce de charité , pour l'intérêt de leur maître , en répandant dans toute la terre par la prédication de la parole , & par l'exercice des œuvres apostoliques , ce qu'ils n'avoient pas reçu pour eux seuls , mais pour tous les peuples. <em>Ses citoyens qui le haïssoient , & qui envoient des députés après lui</em> pour déclarer qu'ils <em>ne vouloient point que cet homme</em> , pour lequel ils témoignoient un si grand mépris , <em>régnât sur eux</em> , sont l'image toute visible des Juifs , & sur-tout", "marges": []}], "texteGeneral": []}};
