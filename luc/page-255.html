m> ou <em>dans ses entrailles</em> , c'est-à-dire de sa propre substance ; & qu'ensuite <em>elle enfantera un fils</em> ; c'est-à-dire , que celui qui naîtra d'elle sera véritablement son fils , ne passant pas seulement par elle , comme ont voulu l'enseigner quelques hérétiques , mais ayant été réellement formé dans elle de son plus pur sang , comme dans sa mère. Or il est visible que l'Ange se servant des mêmes paroles qu'on a déjà rapportées d'Isaïe , <em>Ecce Virgo concipiet & pariet filium</em> , donnoit lieu à la sainte Vierge de faire réflexion sur cette ancienne prophétie , qui marquoit si clairement la naissance du fils tout miraculeux qu'on lui promettoit , & qui ne blesseroit point sa virginité : <em>Ecce virgo concipiet.</em> Le nom même de JESUS , que l'Ange lui marque , comme le nom propre qu'elle devoit lui donner , prouvoit que ce fils seroit le CHRIST & le Messie ; puisque ce nom signifioit , selon S. Matthieu , que <em>c'étoit lui qui devoit sauver son peuple</em> , en le délivrant <em>de ses péchés</em> ; ce qui ne pouvoit convenir qu'à celui-là seul , qui selon la prédiction du même Isaïe , devoit se nommer <em>Emmanuel</em> , c'est-à-dire , <em>Dieu avec nous.</em> Car il n'y avoit qu'un Homme-Dieu , à qui cette qualité put appartenir ; puisqu'il n'y avoit", "marges": ["Isai. 7. 14.", "Matth. 1. 21."]}], "texteGeneral": []}};
