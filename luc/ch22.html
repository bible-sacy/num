        {

          "marges": [],
          "p": 642
        },
        {
          "texte": "Ce désir ardent que le Fils de Dieu témoigne avoir eu de manger cette dernière Pâque avec eux, fait connoître que pendant le cours de toute sa vie mortelle, il fut toujours occupé de la pensée de ce qui seroit comme le fruit & la fin de tous ses travaux. Mais pourquoi donc désiroit-il avec tant d'ardeur de manger cette dernière Pâque ? Et quelle étoit cette Pâque qu'il souhaitoit si ardemment de manger avec ses Apôtres ? Etoit-ce la Pâque judaïque, où l'agneau étoit immolé, & mangé dans chaque famille, en mémoire du miracle par lequel les Israélites avoient été autrefois sauvés de la mort, & délivrés de la servitude des Egyptiens ? Non sans doute. Celui qui étoit venu pour faire cesser les figures, & dissiper toutes les ombres de la loi, ne pouvoit pas témoigner un si grand désir d'une chose qui alloit être abolie. S'il désiroit donc la célébration de cette Pâque, c'étoit à cause qu'elle devoit être la dernière, qui feroit place à la vérité qu'elle figuroit : c'étoit à cause qu'il envisageoit dans l'institution du Sacrement de son corps & de son sang, l'immolation mystique du véritable Agneau pascal ; & dans sa mort qui étoit prochaine, l'immolation réelle de ce même Agneau divin, dont tous les autres qui avoient été immolés & mangés durant tant de siècles depuis la sortie d'Egypte, n'avoient été que des images très-imparfaites. Il désiroit donc, & il avoit toujours désiré de pouvoir manger cette dernière Pâque avec ses <a class=\"page-inline\" href=\"page-643.html\" title=\"p. 643\">‖</a>disciples, afin d'avoir lieu de leur donner, avant que de les quitter par sa mort, le plus saint gage & la preuve la plus divine de son amour. Il désiroit de mourir pour eux, puisque c'étoit ce désir unique qui l'avoit porté à descendre en quelque sorte du haut du ciel par son Incarnation. Mais il vouloit avant même qu'il souffrit la mort, leur prouver par le témoignage le plus authentique, combien l'amour qui le portoit à mourir pour leur salut, devoit être gravé dans leur cœur. Car en s'immolant d'une manière mystique, lorsqu'il leur donne son corps à manger, & son sang à boire dans l'auguste sacrement de l'Eucharistie, il prévient en quelque façon la mort qu'il devoit souffrir, & les engage par ce don si précieux de lui-même, à l'aimer véritablement, comme celui qui les avoit aimés le premier d'un amour plus fort que la mort ; lui qui vouloit bien mourir pour les sauver, & qui trouvoit en mourant même ce moyen si admirable, de demeurer avec eux par une présence très-réelle, jusques à la consommation des siècles, & de les nourrir de sa propre chair.",

      "fr": "Puis il prit le pain, & ayant rendu grâces il le rompit, & le leur donna, en disant : Ceci est mon corps, qui est donné pour vous : faites ceci en mémoire de moi.",
      "note": [
        {
          "texte": "<em>Faites ceci en mémoire de moi.</em>",
          "marges": [],
          "p": 643
        },
        {
          "texte": "Comme l'on a expliqué dans saint Matthieu ce qui regarde l'institution du saint Sacrement de l'autel, & qu'on s'est même servi de ce qu'il y a de particulier dans saint Luc, pour éclaircir davantage ce grand mystère, nous ne nous arrêterons qu'à ce qui peut y avoir été omis. Cette parole de JESUS-CHRIST, <em>Faites ceci en mémoire de moi</em>, renferme un grand sens. Car lorsqu'il la dit à ses Apôtres, il leur donne le pouvoir d'offrir comme lui, le sacrifice de son corps ; il les établit Prêtres & sacrificateurs de la loi nouvelle, non pour égorger comme dans l'ancienne loi, des bêtes, mais pour immoler d'une manière mystique l'Agneau divin, devenu l'hostie de propitiation pour les hommes. Et non-seulement il leur donne le pouvoir d'offrir à Dieu cet auguste sacrifice, figuré par toutes les anciennes victimes ; mais il leur en fait même un commandement exprès, aussi-bien qu'à leurs successeurs, selon le saint Concile de Trente, qui déclare que l'Eglise catholique l'a toujours ainsi entendu, & enseigné. Ce passage du Concile servant à l'intelligence des paroles que nous expliquons, mérite d'être rapporté ici tout entier. « Comme sous l'ancien Testament, dit-il, il n'y avoit point, selon le témoignage de l'Apôtre saint Paul, de perfection, à cause de l'impuissance du sacerdoce Lévitique, il a fallu, selon la vo<a class=\"page-inline\" href=\"page-644.html\" title=\"p. 644\">‖</a>lonté de Dieu, le Père des miséricordes, <em>qu'un autre Prêtre se levât selon l'ordre de Melchisedech</em>, savoir JESUS-CHRIST notre Seigneur, qui put <em>conduire à une parfaite</em> justice tous ceux qui devoient être sanctifiés. C'est donc lui qui étant notre Dieu & notre Seigneur, devoit s'offrir une seule fois à Dieu son Père sur l'autel de la croix par le sacrifice de sa mort, pour y opérer une éternelle rédemption. Mais parce que son sacerdoce ne devoit pas être éteint par sa mort, il voulut dans le dernier souper de cette nuit, où il devoit être trahi, laisser à l'Eglise son épouse bien-aimée un sacrifice visible, selon que la nature des hommes l'exigeoit, par lequel le sacrifice sanglant de sa mort, qu'il devoit offrir une seule fois sur la croix, fût représenté & perpétué dans le souvenir des hommes, jusques à la fin des siècles, & sa vertu salutaire nous fût appliquée pour la rémission des péchés que nous commettons tous les jours. C'est pour cela que déclarant, <em>qu'il avoit été établi Prêtre éternel selon l'ordre de Melchisedech</em>, il offrit à Dieu son Père son corps & son sang sous les espèces du pain & du vin, les donna sous les mêmes symboles à manger & à boire aux Apôtres, qu'il établissoit alors les Prêtres du nouveau Testament, & leur commanda, tant à eux-mêmes qu'à leurs successeurs dans le sacerdoce, de les offrir, en leur disant : <em>Faites ceci en mémoire de moi</em>, selon que l'Eglise catholique l'a toujours entendu & enseigné. Car après qu'il eut célébré l'ancienne Pâque, que la multitude des enfans d'Israël immoloit en mémoire de leur sortie d'Egypte, il institua la nouvelle Pâque, lorsqu'il ordonna à l'Eglise de l'immoler par le ministère des Prêtres sous des signes visibles <em>en mémoire</em> du passage qu'il a fait de ce monde vers son Père, lorsqu'il nous a rachetés par l'effusion de son sang, & que nous ayant arrachés de la puissance des ténèbres, il nous a transférés dans son royaume.",

          "p": 643
        },
        {
          "texte": "L'Eglise est si persuadée que JESUS-CHRIST en disant à ses Apôtres, <em>Faites ceci en mémoire de moi</em>, les établit & ordonna Prêtres, afin qu'ils offrissent, eux & les autres Prêtres, son corps & son sang ; que le même Concile de Trente se crut obligé de prononcer anathème contre ceux qui annonceroient le contraire. Mais nous pouvons ajouter ici avec les Interprètes, que si l'ordre que le Fils de Dieu donna aux Apôtres, d'offrir son corps & son sang par l'immolation mystique du sacrifice de nos autels ; le commandement qu'il leur fit en <a class=\"page-inline\" href=\"page-645.html\" title=\"p. 645\">‖</a>même-temps, selon saint Matthieu, saint Marc & saint Paul, de manger ce même corps, & de boire ce même sang, ne regardoit pas les seuls Apôtres, mais encore tous les fidelles, à qui l'Apôtre donne cet avertissement en général, de ne manger de ce pain, & de ne boire de ce calice qu'après qu'ils se seront éprouvés eux-mêmes, de peur que s'ils en mangeoient, & s'ils en buvoient indignement, ils ne mangeassent & bussent leur propre condamnation.",

      "fr": "Il prit de même la coupe <a class=\"page-inline\" href=\"page-636.html\" title=\"p. 636\">‖</a>après souper, en disant : Cette coupe est * la Nouvelle Alliance en mon sang, qui * sera répandu pour vous.",

          "texte": "C'est le même sens que nous avons expliqué dans saint Matthieu, quoique l'expression dont se servent & saint Matthieu & saint Marc, paroisse un peu différente de ces paroles de saint Luc que nous expliquons. JESUS-CHRIST dit dans saint Matthieu, comme dit saint Marc : <em>Ceci est mon sang, le sang de la nouvelle alliance, qui sera répandu pour plusieurs.</em> Mais il dit ici dans saint Luc : <em>Cette coupe est la nouvelle alliance en mon sang, qui sera répandu pour vous.</em> Ce qui signifie, que comme la première alliance ou <em>le premier Testament ne fut confirmé qu'avec le sang</em>, la nouvelle alliance que je veux faire avec les hommes, doit être aussi confirmée avec le sang : <em>Et de même qu'il a été nécessaire que ce qui n'étoit que figure des choses célestes, fût purifié par le sang des animaux ; les célestes mêmes doivent l'être par des victimes plus excellentes que n'ont été les premières.</em> Ainsi <em>mon sang</em> même, <em>qui sera répandu pour vous sur la</em> croix, <em>est</em> dès maintenant <em>dans cette coupe</em> que je vous présente, comme le sceau de <em>la nouvelle alliance</em> que Dieu mon Père va contracter avec les hommes. Car <em>cette coupe est la nouvelle alliance en mon sang</em>, & mon sang dans cette coupe est la nouvelle alliance, sont deux expressions qui signifient la même chose. On peut voir dans saint Matthieu ce que nous avons dit de plus sur ce sujet important.",

          "marges": [],
          "p": 645
        },
        {
          "texte": "Au lieu donc de cette <em>domination</em> toute séculière, & de cette vaine affectation d'un titre emprunté de <em>bienfaicteur</em>, le Fils de Dieu exigeoit de ses Apôtres, & de tous leurs successeurs, une vraie humilité du cœur, qui les abaissât très-sincèrement au-dessous de ceux qui seroient soumis à leur conduite ; & un fonds inépuisable de charité, qui les rendît véritablement, & non dans la seule idée, les pères & <em>les bienfaicteurs</em> des peuples, à l'exemple de celui dont il est dit : <em>Qu'il alloit par-tout en faisant du bien à tout le monde, & en guérissant toutes sortes de personnes.</em> Car ces deux vertus, de l'humilité & de la charité, sont vraiment essentielles aux Pasteurs, qui sans cela ressemblent aux Grands du monde, à qui JESUS-CHRIST leur déclare ici, qu'ils doivent être très-opposés, & de sentimens & de conduite.",

      "note": [
        {
          "texte": "<em>Car lequel est le plus grand de celui qui est à table, ou de celui qui sert ? N'est-ce pas celui qui est à table ? Et néanmoins je suis au milieu de vous, comme celui qui sert. C'est vous autres qui êtes toujours demeurés, &c.</em>",
          "marges": [],
          "p": 646
        },
        {
          "texte": "Rien n'est plus fort que l'exemple de celui qui parle, pour prouver la vérité qu'il avance. JESUS-CHRIST étoit le Roi de ce royaume tout céleste dont il parloit aux Apôtres. Et voulant leur faire connoître d'une manière plus convaincante, <a class=\"page-inline\" href=\"page-647.html\" title=\"p. 647\">‖</a>combien l'empire & l'orgueil étoient opposés à la divine politique de ce royaume de son Eglise, il leur représente la conduite qu'il tenoit lui-même au milieu d'eux, pour en établir les fondemens. Il se sert donc pour cela de la comparaison d'un Grand, ou d'un Prince qui est à table, & de ceux qui sont debout pour le servir. <em>Lequel</em>, leur dit-il, <em>est le plus grand de celui qui est à table, ou de celui qui sert</em> ? N'est-il pas visible que <em>c'est celui qui est à table</em> ? De-là il conclut infailliblement, que ceux qui seroient comme les plus grands dans le royaume de son Eglise, devoient être les plus humbles, & se regarder comme les derniers & les serviteurs des autres : puisque lui-même, qui en étoit le chef & le Roi, se conduisoit <em>au milieu d'eux tous, ainsi que le serviteur</em>, qui est toujours prêt à rendre service. Car en effet, dans tout le cours de son ministère, il parut uniquement occupé à servir les hommes dans leurs différens besoins, ne pensant qu'à eux, & non à soi-même, & n'étant venu dans le monde, comme il dit ailleurs, que <em>pour servir, & non pour être servi</em> par les hommes, lui qui pouvoit, quand il vouloit, être servi par les Anges. Mais dans le temps même qu'il leur parloit, il leur imprima encore plus fortement cette vérité par la manière dont il s'abaissa à leurs pieds pour les laver, selon qu'il est rapporté dans saint Jean.",

          "marges": [],
          "p": 649
        },
        {
          "texte": "JESUS-CHRIST songe à affermir de plus en plus les Apôtres sur le fondement d'une vraie humilité. C'est pour cela qu'il leur fait voir le péril où ils étoient exposés par la haine de leur ennemi, qui ne cherchoit qu'à les perdre. Il s'adresse en particulier à Pierre, comme au chef, & il lui déclare : Que <em>satan avoit demandé</em> à Dieu <em>le pouvoir de les cribler</em> tous, <em>comme on crible le froment</em> ; c'est-à-dire, de les tourmenter, de les agiter, & même de les renverser. Car le démon, de quelque haine qu'il soit animé, ne peut point exécuter sa mauvaise volonté contre les hommes, s'il n'en reçoit le pouvoir de Dieu, comme il le reçut anciennement pour tourmenter Job. Or si l'usage qu'il fait de cette permission que Dieu lui donne, est criminel de sa part, ayant pour principe la haine qu'il porte aux hommes, & la jalousie que lui cause leur bonheur : cette même permission qui lui est donnée, est toujours juste de la part de Dieu. Car il sait, selon les conseils <a class=\"page-inline\" href=\"page-650.html\" title=\"p. 650\">‖</a>de sa bonté ou de sa justice, tirer de la malice même du démon, ou l'épreuve de la vertu de ses serviteurs, comme en la personne de Job, ce prodige de patience, donné pour exemple à tous les siècles futurs ; ou un sujet d'humiliation pour ceux qui, comme saint Pierre, se confient trop en eux-mêmes ; ou un châtiment de l'infidélité des autres qui ont mérité, comme Judas, d'être livrés à la puissance de leur ennemi.",

          "p": 650
        },
        {
          "texte": "Il est vrai qu'il commit un grand péché en renonçant JESUS-CHRIST : & tel fut l'effet de la permission que satan avoit demandée, de <em>le cribler comme on crible le froment.</em> Mais le Fils <a class=\"page-inline\" href=\"page-651.html\" title=\"p. 651\">‖</a>de Dieu fait homme pour l'amour de nous, <em>prie pour lui, afin que sa foi ne périsse point</em> ; & c'est par l'effet de cette prière toute-puissante du médiateur de la loi nouvelle, qu'encore que Pierre se rende coupable d'une grande infidélité, il ne perd pas néanmoins tout-à-fait la foi, selon que l'a cru saint Ambroise : & que même s'étant relevé aussitôt après de sa chute, il est affermi pour toujours d'une manière inébranlable dans cette foi, étant devenu par sa dignité le chef de l'Eglise, la colonne & la base de la vérité. « Pierre est comme criblé ou vanné, dit ce Père, afin qu'il nie JESUS-CHRIST.... Mais combien le secours qu'il reçoit de JESUS-CHRIST est-il plus puissant encore que le trouble qu'il a reçu de sa tentation ? <em>Quantò majus est patrocinium, quàm perturbationis illius tentamentum</em> ? Et ainsi il a plus gagné qu'il n'a perdu : <em>Et ideò plus quàm passus est acquisivit.</em> Car il est établi le chef de l'Eglise, après qu'il a été tenté par le démon. Et c'est ce que le Sauveur voulut lui marquer, en lui disant : <em>Lors donc que vous serez converti, ayez soin d'affermir vos frères</em> ». Chose étonnante ! Le Fils de Dieu prédit à saint Pierre qu'il sera tenté, qu'il tombera : & en même-temps il lui fait entendre, que non-seulement il se relevera de sa chute, mais qu'il sera même chargé d'affermir les autres. En quoi sa principauté est marquée bien clairement. Il est donc tenté, afin qu'étant affermi par sa propre chute, il soit encore plus en état de soutenir & de fortifier ses frères. C'est en effet ce qu'on vit aussitôt après la descente du Saint-Esprit, puisqu'il parut le premier à la tête du Collège apostolique, pour prêcher devant les Juifs la divinité de celui qu'ils venoient de faire mourir, & qu'il inspira par l'exemple de son courage de la fermeté à tous les disciples.",

tle=\"p. 655\">‖</a>de vaincre, & de nous apprendre à vaincre avec lui la tristesse. Car ce n'est pas une force, mais une espèce de stupidité, de ne pas sentir la douleur de ses plaies. Et cet Homme Dieu sachant porter nos infirmités dont il s'est chargé, devient véritablement en cet état notre maître, pour nous apprendre à surmonter comme lui, & la mort & la tristesse avec toutes les horreurs de la mort.",

          "texte": "Nous voyons dans saint Matthieu & dans saint Marc, que ce fut après que JESUS eut déclaré au Grand-Prêtre, Qu'il étoit le CHRIST, le Fils de Dieu, que les Juifs commencèrent à le frapper sur le visage, & à lui dire qu'il devinât qui étoit celui qui l'avoit frappé. Ainsi il y a bien de l'apparence que saint Luc n'a pas rapporté ceci en son lieu. Et en effet, il est assez vraisemblable que ces Juifs ne se portèrent à outrager J. C. jusqu'à ce point que de lui cracher au visage, & de lui donner des soufflets, que lorsqu'ils crurent, après avoir entendu de sa propre bouche qu'il étoit le Fils de Dieu, n'avoir plus rien à ménager à son égard ; parce qu'ils le considéroient comme un impie, & comme un blasphémateur convaincu publiquement de ce crime. Il est vrai que si J. C. ne leur avoit pas donné, comme on l'a marqué sur saint Matthieu, des preuves incontestables de sa divinité & de sa toute-puissance, ils auroient été en droit de le traiter avec les derniers outrages. Mais le témoignage si convaincant que sa doctrine toute céleste & ses œuvres miraculeuses rendoient à sa Personne divine, ne leur laissoit aucun lieu d'excuse. Et l'aveu qu'il fit alors au Grand-Prêtre, en lui déclarant qu'il étoit véritablement le Fils de Dieu, n'étoit qu'une conséquence aisée à tirer de tout ce qu'il avoit dit & fait jusqu'alors, si l'envie diabolique qui possédoit & les Prêtres & les Pharisiens, & les Docteurs de la loi, ne les avoit aveuglés.",

      "note": [
        {
          "texte": "<em>Si je vous le dis, vous ne me croirez point</em> <a class=\"page-inline\" href=\"page-658.html\" title=\"p. 658\">‖</a><em>Et si je vous interroge, vous ne me répondrez point, & ne me laisserez point aller.</em>",

          "p": 657

          "texte": "JESUS étant interrogé par les Juifs, s'il étoit le CHRIST, n'avoit garde de le leur cacher, puisque toute la fin de son incarnation étoit de se faire reconnoître pour le Fils de Dieu, & pour le Messie attendu depuis si long-temps, comme le Sauveur de son peuple. Mais il connoissoit la véritable disposition de ces Docteurs & de ces Prêtres qui l'interrogeoient ; & il savoit qu'ils n'avoient aucun dessein de s'instruire de la vérité, mais de trouver seulement un prétexte pour le perdre, comme ils l'avoient résolu. Ainsi il leur fait entendre par ces paroles, qu'il voyoit à nu le fond de leur cœur, & que la demande qu'ils lui faisoient ne tendoit qu'à se procurer une occasion spécieuse de satisfaire leur jalousie contre lui. <em>Si je vous déclare</em>, leur dit le Sauveur, <em>que je suis le</em> CHRIST, <em>vous ne me croirez point</em> : c'est-à-dire, vous ajouterez encore moins de foi à mes paroles qu'à mes œuvres, qui ont dû vous en convaincre. <em>Et si je vous interroge</em>, c'est-à-dire, si je vous fais quelques demandes, & vous propose quelques passages de l'Ecriture, comme j'ai fait autrefois, pour vous prouver ma divinité & ma mission, <em>vous ne me répondrez point</em> non plus, comme vous ne l'avez point fait alors. Car <em>vous n'avez pas dessein</em> de connoître la vérité, ni <em>de me laisser aller</em>, mais de me faire mourir. Il leur prouvoit en leur parlant de la sorte, qu'il étoit véritablement ce qu'ils témoignoient vouloir savoir de lui-même, c'est-à-dire, <em>le</em> CHRIST & <em>le Fils de Dieu.</em> Car il faisoit voir très-clairement qu'il pénétroit toutes leurs pensées, par un effet de cette divine lumière qui étoit en lui. Mais après qu'il leur eut ainsi prouvé sa divinité, en leur découvrant à nu le fond caché de leur cœur, il leur déclara ouvertement, que <em>le Fils de l'homme</em> qu'ils traitoient alors avec un si grand mépris, <em>seroit assis à la droite de la puissance de Dieu</em>, parce <em>qu'il étoit lui-même Fils de Dieu.</em> Et en leur parlant ainsi, il les rendit tout-à-fait inexcusables, puisqu'il ne leur cacha point ce qu'il étoit, & qu'il n'y eut que leur propre orgueil qui les empêcha de se rendre à un témoignage soutenu par tant de preuves, qui auroient dû par elles-mêmes les convaincre de ce qu'il étoit.",
