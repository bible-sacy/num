          "marges": [],

        {
          "texte": "D'où vient que le Fils de Dieu ayant à élire ses douze Apôtres, se retire sur une montagne, & y passe toute la nuit en prières? Est-ce qu'il avoit besoin de prier, pour connoître ceux qu'il devoit choisir & en faire ses Apôtres? Celui qui étoit la lumière du monde, & qui par sa nature divine étoit le terme de la connoissance du Père, son Verbe & sa Sagesse éternelle, auroit-il pu ignorer quelque chose des secrets de l'esprit de Dieu, qui procède de lui comme de son Père? Non sans doute. Mais il agissoit comme chef de son Eglise qu'il vouloit former; & il apprenoit, en priant comme homme, la manière dont les hommes devoient prier, pour l'élection de ceux qui sont destinés à remplir les premières places de son royaume sur la terre. Il monte donc sur une montagne, pour nous montrer qu'il faut s'élever vers Dieu, & quitter la terre, & toutes les pensées terrestres, tous les sentimens de la chair & du sang, quand il s'agit d'établir des Ministres dans l'Eglise, pour la conduite spirituelle des peuples. Il prie long-temps, pour nous faire voir que la prière, & une prière persévérante, est un moyen nécessaire pour pouvoir connoître ceux qu'il a lui-même choisis & destinés par sa volonté suprême à cet important emploi qui regarde le salut des ames. Car il n'y a proprement que ceux que Dieu a choisis, qui doivent être établis Pasteurs des peuples; l'élection de ces Pasteurs étant un droit qui lui appartient, & que l'homme ne peut usur<a class=\"page-inline\" href=\"page-376.html\" title=\"p. 376\">‖</a>per par un effet de sa propre présomption, sans sacrilége. Enfin il prie pendant la nuit, peut-être pour nous faire souvenir que nous ne sommes par nous-mêmes que ténèbres, & que nous devons sans cesse dire à Dieu avec David: <em>Eclairez, Seigneur, mes ténèbres, puisque c'est de vous que je puis attendre toute ma lumière.</em> Que s'il est vrai que nous prions, pour le dire ainsi, pendant la nuit, tant que nous sommes dans cette région de l'ombre de la mort, nous pouvons bien regarder avec encore plus de raison comme une nuit très-obscure pour nous, le secret impénétrable des conseils de Dieu, qui ne peut être découvert que par son esprit, & qui ne l'est jamais que par un effet de la prière.",

          "marges": [],
          "p": 376
        },
        {
          "texte": "Il ne faut pas s'étonner si J. C. guérissoit avec une si grande bonté tous les malades. Car il étoit descendu du ciel, pour venir en qualité de médecin guérir les plaies des pécheurs. Et c'étoit pour procurer cette guérison spirituelle aux hommes, qu'il s'abaissoit jusqu'à guérir toutes leurs infirmités corporelles, qui <a class=\"page-inline\" href=\"page-377.html\" title=\"p. 377\">‖</a>étoient autant d'images de celles des ames, qu'il étoit venu principalement guérir dans le monde. Ainsi étant sur le point d'annoncer aux peuples ce qu'il y avoit de plus parfait dans les maximes de son Evangile; c'est-à-dire, les béatitudes évangéliques, qui renversoient tous les sentimens naturels de l'homme corrompu par le péché; il voulut auparavant se concilier l'autorité par les miracles; il voulut s'acquérir la créance dans l'esprit des peuples par cet empire souverain qu'il avoit sur la nature, afin qu'ils devinssent plus susceptibles de ce qu'il devoit leur dire de si élevé touchant la perfection des ames.",
          "marges": [],
          "p": 376
        },
        {
          "texte": "Chacun s'empressoit de <em>le toucher</em>, parce qu'ils étoient sensibles au mal qu'ils souffroient, & qu'ils avoient une entière conviction de cette <em>vertu toute divine qui sortoit de</em> JESUS-CHRIST pour la guérison des maladies, voyant que <em>tous</em> ceux qui le touchoient étoient aussitôt guéris. D'où vient donc que l'on s'empresse si peu de <em>le toucher</em> présentement par la foi, pour la guérison des plaies secrètes de nos ames? C'est sans doute, que nous ne sommes nous-mêmes que très-foiblement <em>touchés</em> du sentiment de ces plaies spirituelles, & que notre foi, à l'égard du Médecin tout-puissant, à qui il est si facile de les guérir, est aussi très-foible & très-languissante. Cette femme de l'Evangile, devenue si célèbre par l'humilité & par l'ardeur de sa foi, n'auroit point été guérie de la perte de son sang, si elle n'eût cru fortement que J. C. pouvoit la guérir, & si dans cette assurance elle ne s'étoit approchée par derrière pour toucher le bas de sa robe. Car ce fut cet attouchement, encore plus de son cœur rempli de foi, que de sa main, qui eut la force de faire <em>sortir de J. C. une divine vertu</em> qui la guérit dans l'instant.",

      "note": [
        {
          "texte": "<em>Vous serez bienheureux lorsque les hommes vous haïront, lorsqu'ils vous sépareront, lorsqu'ils vous traiteront injurieusement, lorsqu'ils rejetteront votre nom comme mauvais, à cause du Fils de l'homme.</em>",
          "marges": [],
          "p": 377
        },
        {
          "texte": "Il étoit très-important que le Fils de Dieu affermît & ses Apôtres, & tous ses disciples, qui se devoient succéder dans la suite de tous les siècles, comme une des tentations les plus sensibles qui pouvoient jamais éprouver leur piété. Il le fait de la manière du monde la plus capable de les consoler, en attachant même une béatitude à la souffrance de ce qu'il y a de plus odieux, qui est d'être rejeté des hommes comme des méchans, & séparé de leur société comme des personnes empestées. Et ce qu'il leur dit, il le leur a confirmé par son propre exemple, lorsqu'il a souffert le premier d'être traité de Samaritain, c'est-à-dire, <a class=\"page-inline\" href=\"page-378.html\" title=\"p. 378\">‖</a>d'hérétique & de possédé du démon, & qu'il l'a souffert de la part de son propre peuple qu'il combloit de biens. Rien n'est plus pénible à un serviteur de Dieu, que de se voir non pas seulement <em>haï des hommes</em> du siècle; ce qu'il sait être le caractère de ceux qui se veulent attacher à JESUS-CHRIST, mais encore d'être même <em>séparé</em> quelquefois <em>& rejeté</em> par ses propres frères, & de voir <em>son nom en horreur</em> à ceux qui le traitoient de <em>méchant</em> & de scélérat, lorsqu'il n'a que la charité & la vérité dans le cœur. C'est donc alors qu'il est nécessaire de se souvenir de cette déclaration que J. C. nous a faite: Que c'est être <em>bienheureux</em> de se voir <em>haï, traité injurieusement, & rejeté par les hommes, à cause du Fils de l'homme. S'ils ont appelé le père de famille, Béelzebub</em>, dit-il ailleurs; <em>combien se porteront-ils plutôt à traiter de même ses domestiques?</em> C'est donc une gloire, c'est un bonheur pour les disciples d'être traités comme leur maître. On voit dans saint Jean que du vivant même de J. C. cette prédiction qu'il leur avoit faite, <em>Qu'on rejetteroit leur nom comme mauvais à cause du Fils de l'homme</em>, fut accomplie: car dès le temps qu'il guérit miraculeusement l'aveugle-né, il est marqué: Que les Juifs avoient déjà conspiré & résolu que quiconque reconnoîtroit JESUS pour le CHRIST, seroit chassé de la synagogue. C'est ainsi que <em>le nom</em> de disciple de J. C. a commencé à être <em>rejeté comme mauvais</em>; premièrement par les Juifs, superstitieusement attachés à leur Synagogue, à laquelle ils ne pouvoient voir préférer l'Eglise; en second lieu par les idolâtres, qui animés par les démons, ne pouvoient souffrir la destruction du paganisme; & enfin par les faux frères, dont saint Paul s'est plaint dès son temps, lorsqu'il raconte tous les périls qu'il avoit courus, & entre autres ceux où il s'étoit vu de la part des hommes charnels de l'Eglise, à qui il donne le nom de faux frères: <em>Periculis in falsis fratribus.</em>",

        {
          "texte": "Comme J. C. a déclaré par la première des béatitudes, Que <em>le royaume des cieux appartient aux pauvres</em>, il ne faut pas s'étonner s'il prononce ici sa malédiction contre les riches, & s'il les exclut par conséquent de ce royaume, qui ne nous ayant été ouvert que par un Dieu fait homme, & devenu pauvre pour l'amour de nous, ne peut être pour les riches, s'il est vrai qu'il soit le domaine & l'héritage des pauvres. Mais comme ces pauvres que J. C. établit les héritiers de son royaume, sont <em>les pauvres de cœur & d'affection</em>, & non pas tous ceux qui sont pau<a class=\"page-inline\" href=\"page-379.html\" title=\"p. 379\">‖</a>vres des biens de la terre; aussi ces riches contre lesquels il prononce sa malédiction, & qu'il rejete du royaume destiné aux pauvres, sont ceux dont le cœur est attaché à leurs richesses, <em>qui y mettent leur confiance</em>, comme il dit lui-même ailleurs, & qui négligent, selon saint Ambroise, d'en faire l'usage pour lequel elles leur ont été données. Ce ne sont donc pas, ajoute ce Saint, les richesses en elles-mêmes, que le Fils de Dieu condamne, mais l'attache criminelle à ces richesses: <em>Non census igitur, sed affectus in crimine est.</em>",

          "texte": "La raison que J. C. rend de la réprobation de ces mauvais riches est étonnante: Malheur à vous, leur dit-il, <em>parce que vous avez votre consolation en ce monde.</em> Qui auroit cru, si le Fils de Dieu ne nous l'avoit déclaré, qu'il suffit à un homme riche, pour être éternellement malheureux en l'autre monde, d'avoir eu sa consolation en celui-ci? Qui ne tremblera, en considérant ce funeste effet des richesses, qui portent avec elles la malédiction, si les hommes qui les possèdent ne veillent sans cesse pour en détacher leur cœur, s'ils ne s'en servent pour soulager les besoins des pauvres, s'ils en prennent occasion pour satisfaire tous leurs plaisirs, pour jouir paisiblement des douceurs de la vie présente, & pour éloigner de soi tout ce qu'il y a de mortifiant & de pénible, en renonçant à porter leur croix après J. C. selon qu'il l'a ordonné à tous ses disciples? Un saint Roi avoit bien compris cette grande vérité, lorsqu'il disoit: Si les richesses vous viennent en abondance, prenez garde de n'y mettre pas votre cœur: <em>Divitiæ si affluant, nolite cor apponere.</em> Car plus les riches se sont attachés à leurs trésors pendant qu'ils vivoient, plus ils sentent un épouvantable vide à leur mort, selon la déclaration qu'en a faite ce même Prince animé de l'esprit de Dieu par ces paroles: <em>Dormierunt somnum suum: & nihil invenerunt omnes viri divitiarum in manibus suis.</em>",

      "lat": "Væ vobis qui saturati estis , quia esurietis ! Væ vobis qui ridetis nunc ; quia lugebitis & flebitis !",
      "fr": "Malheur à vous qui êtes rassasiés , parce que vous aurez faim ! Malheur à vous qui riez maintenant , parce que vous serez réduits aux pleurs & aux larmes !",
      "note": [
        {

          "marges": [],
          "p": 379
        },
        {
          "texte": "La vie présente n'est pas le temps d'être <em>rassasié</em>, mais d'être dans la faim & dans la soif, comme les Saints y ont été, & comme saint Paul disoit de soi-même: Qu'il avoit <em>souffert la faim & la soif, les jeûnes réitérés, le froid & la nudité. Malheur à vous</em>, disoit un Prophète, à vous <em>qui êtes dans l'abondance.... qui mangez les agneaux les plus excellens, & des veaux choisis de tout le troupeau.... qui buvez le vin à pleines coupes, & vous parfumez des huiles de senteur les plus précieuses.</em> Telles sont les suites funestes <a class=\"page-inline\" href=\"page-380.html\" title=\"p. 380\">‖</a>de l'état des riches, à qui il paroît pénible de jeûner au milieu de l'abondance, & qui abusant des biens que le Seigneur leur a donnés, vivent toujours dans la bonne chère, tandis que les pauvres meurent de faim. Mais quelle sera la fin terrible & l'étrange catastrophe de cet état qu'ils regardent maintenant comme si heureux? <em>Vous verrez bientôt</em>, dit le Seigneur par la bouche d'un de ses Prophètes, <em>que mes serviteurs mangeront, & que vous serez dans la faim; que mes serviteurs boiront, & que vous serez dans la soif: que mes serviteurs se réjouiront, lorsque vous serez couverts de confusion: que mes serviteurs chanteront mes louanges dans le ravissement de leur cœur, lorsque vous pousserez vous autres de grands cris dans l'amertume de votre cœur, & de tristes hurlemens dans le brisement de votre esprit.</em> Cependant si la certitude de la foi nous persuade cette vérité, nos sens obsédés de tous les objets qui nous environnent, & notre chair toute plongée dans l'amour de la vie présente, s'y opposent. Et c'est dans ce combat continuel de la foi contre les sens, que consiste tout l'exercice du Chrétien, qui a appris de la doctrine apostolique de saint Paul, à ne pas vivre selon la chair, s'il veut acquérir la vraie vie, mais à travailler sans cesse à faire mourir par l'esprit de Dieu les passions de cette chair qui s'opposent à son salut.",

    {
      "n": 26,
      "p": 372,
      "lat": "Væ cùm benedixerint vobis homines ; secundum hæc enim faciebant pseudoprophetis patres eorum.",
      "fr": "Malheur à vous , lorsque * les hommes diront du bien de vous ; car c'est ce que leurs pères faisoient à l'égard des faux prophètes.",
      "note": [
        {
          "texte": "<em>Malheur à vous lorsque les hommes diront du bien de vous; car c'est ce que leurs pères faisoient à l'égrad des faux prophètes.</em>",
          "marges": [],
          "p": 380
        },
        {
          "texte": "La seconde partie de ce verset nous fait entendre comment on doit en expliquer la première. Les Juifs avoient dit anciennement mille biens des faux prophètes, parce que ces faux prophètes les trompoient, en s'étudiant à ne leur dire que des choses agréables. <em>Il s'est fait sur la terre</em>, disoit autrefois le Seigneur, <em>des choses étranges, & qu'on ne peut écouter qu'avec le dernier étonnement. Les Prophètes débitoient des mensonges comme des Prophéties; Les Prêtres leur applaudissoient; & mon peuple y trouvoit son plaisir. Quelle sera donc à la fin la punition qui l'attend?</em> Ainsi c'étoit, comme on l'a marqué ailleurs, cette conspiration des Prophètes, des Prêtres, & du peuple unis ensemble pour se tromper misérablement, que Dieu vouloit que l'on regardât comme <em>la chose</em> du monde <em>la plus étonnante</em> & la plus funeste. C'est donc <em>sur</em> cela qu'il semble que J. C. veut instruire ici ses disciples, lorsqu'il prononce <em>malheur à ceux de qui tous les hommes diroient du bien</em>; c'est-à-dire, à ceux qui, comme les faux prophètes du temps passé, s'attireroient par leurs fausses complai<a class=\"page-inline\" href=\"page-381.html\" title=\"p. 381\">‖</a>sances envers les peuples, & par le relâchement d'une morale accommodante, les vains applaudissemens des hommes. <em>Je vous l'ai dit</em>, s'écrioit autrefois saint Paul, <em>& je vous le redis encore une fois: Si quelqu'un vous annonce un Evangile différent de celui que vous avez reçu, qu'il soit anathême. Car enfin est-ce des hommes, ou de Dieu, que je desire maintenant d'être approuvé; ou ai-je pour but de plaire aux hommes? Si je voulois encore plaire aux hommes, je ne serois pas serviteur de</em> JESUS-CHRIST. Si donc par la crainte de choquer les hommes, on s'abstient de leur dire la verité, & qu'on leur enseigne au-contraire des maximes relâchées qui les flattent dans leurs desordres; on tombe infailliblement dans la malédiction prononcée ici par le Fils de Dieu, lors même qu'on se rejouit des vains applaudissemens de ceux que l'on trompe. Car le monde aime à être trompé de la sorte, & il hait ceux qui, comme le Fils de Dieu, <em>rendent témoignage contre lui, que ses œuvres sont mauvaises.</em>",
          "marges": [
            "Jerem. 5. 30. 31.",
            "Galat. 1. 9. 10.",
            "Joan. 7. 7."
          ],
          "p": 380
        },
        {
          "texte": "Que si c'est une malédiction pour un ministre de JESUS-CHRIST, de s'attirer par ses flatteries ces louanges des pecheurs & cet applaudissement <em>du monde</em>; c'est-à-dire, des hommes possedez de l'amour du monde, qui aiment, selon le Prophete, à être approuvez dans les désirs de leur cœur; c'est au-contraire un effet très-saint de la pieté des vrais fidéles, de donner de justes louanges aux Predicateurs évangeliques, qui ne songeant qu'à s'acquitter de leur ministere dans la vûe de Dieu, leur disent des choses dont ils sont touchez, parce qu'ils aiment la verité, aussi-bien lorsqu'elle reprend leurs défauts, que lorsqu'elle plaît à leur esprit. Ainsi ce n'est pas toûjours une marque qu'on merite la malédiction du Seigneur, lorsque les hommes <em>disent du bien</em> de nous; car la verité a aussi ses approbateurs. Mais c'en est une certaine, lorsqu'on cherche leur estime, à l'exemple des faux-prophetes, aux dépens de la verité de l'Evangile, dont la voye étroite & les sentiers opposez à la voye large du siecle, ont toûjours été un grand sujet de scandale pour beaucoup de faux-prophetes, & de peuples qui se sont conduits mutuellement dans le précipice. Et c'est de ceux-là seulement que le Fils de Dieu parle ici.",
          "marges": [
            "Psal. 9. 24."
          ],
          "p": 381
        }

        "℣. 26. gr. tous."

      "p": 372,

          "texte": "Ce que JESUS-CHRIST alloit dire, étoit d'une grande perfection, & le veritable esprit de l'Evangile, inconnu dans l'ancienne loi, sinon à ceux qui par une foi anticipée en JESUS-CHRIST, appartenoient dès ce tems-là à la loi nouvelle. C'est pour cela qu'il semble demander ici une attention particuliere, & ces oreilles du cœur que tous n'avoient pas. C'est proprement à ces personnes qu'il <a class=\"page-inline\" href=\"page-382.html\" title=\"p. 382\">‖</a>adresse son discours: <em>Je vous dis à vous autres qui m'écoutez, &c.</em> Tous entendoient parler J. C.: mais tous ne l'écoutoient pas avec cette humble docilité qui est l'effet d'une foi animée par la charité. Et sans cette foi, des maximes si parfaites ne pouvoient trouver d'entrée dans le cœur de l'homme. L'on a expliqué la plupart de ces grandes vérités dans saint Matthieu.",

      ]

    {
      "n": 35,
      "p": 373,
      "lat": "Verumtamen diligite inimicos vestros ; benefacite , & mutuum date , nihil inde sperantes : & erit merces vestra multa , & eritis filii Altissimi , & quia ipse benignus est super ingratos & malos.",
      "fr": "Vous donc , aimez vos ennemis : faites du bien à tous , & prêtez sans en rien espérer ; & alors votre récompense sera très-grande , & vous serez les enfans du Très-haut ; parce qu'il est bon aux ingrats mêmes , & aux méchans.",
      "note": [
        {
          "texte": "<em>Faites du bien, & prêtez sans en rien espérer.</em>",
          "marges": [],
          "p": 382
        },
        {
          "texte": "J. C. dit seulement dans saint Matthieu: <em>Donnez à celui qui vous demande, & ne rejetez point celui qui veut emprunter de vous.</em> Mais ici il dit beaucoup davantage: car il nous ordonne de <em>faire du bien</em> à notre prochain, c'est-à-dire, de l'assister de telle sorte qu'il en soit vraiment soulagé. Et il ajoute aussitôt: <em>prêtez sans en rien espérer</em>: ce qui signifie premièrement que l'on ne doit point <em>prêter à usure</em>, comme le dit un Prophète, ni <em>recevoir plus qu'on n'a donné</em>, en exigeant de son frère un intérêt que Dieu nous défend: ce qui est tout-à-fait criminel, & opposé à ce précepte que le Sauveur donne ici, de <em>faire du bien</em> à nos frères. Secondement, ces mêmes paroles de J. C. signifient que l'on doit prêter, sans même espérer que celui à qui on prête puisse faire le même plaisir dans une semblable occasion. Enfin S. Ambroise croit qu'il y a encore quelque chose de plus parfait renfermé dans ces paroles: car il témoigne que le Fils de Dieu prétend par là engager celui qui prête à un autre, à le faire, sans espérance même de recevoir à l'avenir ce qu'il a prêté, lorsque la personne à qui il fait ce plaisir se trouve par sa pauvreté hors d'état de le lui rendre. « Prêtez, dit-il, à ceux mêmes de qui vous n'espérez pas de recevoir ce que vous aurez prêté. Ce n'est point ici une perte, mais un gain pour vous; puisqu'en donnant peu, vous recevrez beaucoup: Vous donnez un peu de bien sur la terre, & vous en serez payé dans le ciel.... Ne croyez donc pas que j'envie votre avantage, puisqu'en vous ôtant un débiteur en la personne d'un pauvre, je mets Dieu même en sa place; je substitue à votre frère qui ne sauroit vous payer, JESUS-CHRIST qui ne peut manquer de payer pour lui. »",
          "marges": [
            "Matt. 5. 42.",
            "Ezech. 18. 8.",

          ],
          "p": 382
        },
        {
          "texte": "Nous voyons dans la Genèse, par l'exemple de la générosité d'Abraham, qui ne voulut rien recevoir du Roi de Sodome, après l'avoir délivré avec ses sujets de l'oppression de ses ennemis, qui lui avoient enlevé tous ses trésors, combien un Chrétien & un disciple de J. C. doit être élevé au-dessus de tout intérêt: <em>Je jure</em>, disoit ce saint Patriarche, <em>par le Seigneur, le Dieu très-haut, & le maître du ciel & de la terre, que je ne recevrai aucune des</em> <a class=\"page-inline\" href=\"page-383.html\" title=\"p. 383\">‖</a><em>choses qui sont à vous, afin que vous ne puissiez pas dire: J'ai enrichi Abraham.</em> Aussi Dieu fit voir ensuite combien ce désintéressement lui avoit été agréable, lorsqu'il l'assura qu'il seroit son protecteur, & que lui-même lui tiendroit lieu de toutes les plus grandes récompenses: <em>Ego protector tuus sum, & merces tua magna nimis.</em>",
          "marges": [
            "Gen. 14. 21. 22. 23. 15. 1."
          ],
          "p": 382
        },
        {
          "texte": "Saint Jérôme a remarqué sur ce passage de saint Luc que nous expliquons, le progrès des vérités que Dieu enseignoit aux peuples, ayant commencé d'abord par les moins parfaites. Au commencement, dit ce Père, la loi de Moyse défendoit seulement aux Juifs de prêter à d'autres Juifs avec usure, le leur permettant à l'égard des étrangers. Le Prophète roi & les autres qui l'ont suivi, ont en général défendu l'usure. Et J. C. le Seigneur de tous les Prophètes, fait ici dans l'Evangile ce nouveau précepte plus parfait que tous les autres: <em>Prêtez à ceux mêmes de qui vous n'espérez point de recevoir</em> ce que vous aurez prêté. Ainsi Dieu par sa profonde sagesse, a voulu accoutumer peu-à-peu l'homme à ce qui étoit d'une plus grande perfection, lui interdisant d'abord l'intérêt de ce qu'il auroit prêté, afin de le rendre, dit Tertullien, plus susceptible de perdre, s'il étoit besoin, le fonds même qu'il auroit prêté aux autres. Car c'étoit-là, continue-t-il, à quoi tendoit la loi de Moyse, qui travailloit seulement à préparer les hommes à recevoir l'Evangile: <em>Hanc etenim dicimus operam legis fuisse, procurantis Evangelio.</em> Elle formoit insensiblement dès-lors la foi de plusieurs, pour les mettre ensuite en état d'embrasser la parfaite pureté de la discipline chrétienne. Et ces premières ordonnances de l'ancienne loi, qui servoient ainsi à les former peu-à-peu pour les rendre dignes de quelque chose de plus grand, pouvoient être regardées, dit encore le même Auteur, comme le premier langage de la bonté de leur Dieu, qui s'abaissoit, pour le dire ainsi, jusqu'à bégayer comme eux, afin de s'en faire mieux entendre: <em>Quorumdam tunc fidem paulatim ad perfectum disciplinæ christianæ nitorem, primis quibusque præceptis balbutientis adhuc benignitatis informabat.</em>",

            "Ps. 14. 5.",
            "Ezech. 18. 8.",
            "Tertull. adversus Marcion. l. 4. c. 17."
          ],
          "p": 383

    {
      "n": 36,
      "p": 373,
      "lat": "Estote ergo misericordes , sicut & Pater vester misericors est.",

    {

      "lat": "Nolite judicare , & non judicabimini. Nolite condemnare , & non condemnabimini. Dimitte , & dimittemini.",
      "fr": "Ne jugez point , & vous ne serez point jugés. Ne condamnez point , & vous ne serez point condamnés. Remettez , & il vous sera remis.",

    },
    {
      "n": 38,
      "p": 373,
      "lat": "Date , & dabitur vobis. Mensuram bonam , & confertam , & coagitatam , & supereffluentem , dabunt in sinum vestrum ; eadem quippe mensura , quâ mensi fueritis , remetietur vobis.",
      "fr": "Donnez , & il vous sera donné. On vous versera dans le sein une bonne mesure , pressée , entassée , & qui se répandra par-dessus ; car on se servira envers vous de la même mesure dont vous vous serez servis envers les autres.",
      "note": [
        {
          "texte": "<em>Donnez, & il vous sera donné. On vous versera dans le sein une bonne mesure, pressée, entassée, & qui se répandra par-dessus: car on se servira envers vous de la mesure, &c.</em>",
          "marges": [],
          "p": 383
        },
        {
          "texte": "Dieu pouvoit nous obliger de <em>donner</em> nos biens, & d'en faire part à nos frères, sans nous promettre de récompense; puisque n'ayant rien nous-mêmes que nous n'ayons reçu du Seigneur, nous devons nous considérer, non comme les maîtres, mais comme les économes des biens qu'il nous a confiés. Car il les a <a class=\"page-inline\" href=\"page-384.html\" title=\"p. 384\">‖</a>mis entre nos mains comme en dépôt, afin que nous en usions seulement selon ses ordres. Or il est dans l'ordre de sa justice, qu'après avoir pris ce qui nous est nécessaire, nous fassions part du surplus à nos frères qui sont pauvres. Ainsi il est vrai de dire, selon l'Evangile, lorsque nous avons satisfait à ce devoir, que nous sommes à l'égard de Dieu des serviteurs inutiles. Mais sa bonté est si grande, qu'en nous obligeant de partager avec les autres les biens qu'il nous a donnés à cette seule condition, il veut bien encore s'engager par une promesse solennelle, de nous rendre avec une profusion digne de lui, ce que nous aurons distribué de ses propres biens à nos frères. Et il ne met point d'autres bornes à la récompense que nous devons en attendre, que celles que nous y aurons mises nous-mêmes, soit en donnant peu, ou en donnant libéralement. La manière dont J. C. nous exprime ici cette promesse, est une figure de ce qu'on pratique quelquefois dans le commerce, ou en mesurant des grains dans un boisseau, <em>on les presse, & on les entasse</em>, ensorte qu'il <em>s'en répand par-dessus.</em>",
          "marges": [],
          "p": 383
        },
        {
          "texte": "Ces paroles qu'il ajoute: <em>Car on se servira envers vous de la même mesure dont vous vous serez servis, &c.</em> ne se doivent pas entendre littéralement comme si la récompense qu'il nous promet devoit répondre précisément à la mesure de nos aumônes. Car qu'est-ce que nous donnons aux pauvres; & qu'est-ce que nous attendons de Dieu? Nous donnons un peu d'argent, ou un peu de pain, ou quelques habits: & nous espérons de recevoir en récompense le royaume de Dieu même. Quelle est donc la comparaison qu'il peut y avoir entre deux choses si infiniment disproportionnées? Il y a néanmoins un sens auquel il est véritable de dire, que <em>notre mesure envers nos frères, sera la mesure de Dieu envers nous</em>: c'est-à-dire, qu'encore qu'il y ait une disproportion infinie entre ce que Dieu promet aux hommes, & ce que les hommes font pour Dieu; il mesurera néanmoins ses récompenses sur la mesure de leur charité: ensorte qu'il se communiquera à eux avec d'autant plus de profusion, qu'ils n'auront rien épargné de leur côté pour procurer le soulagement de ses membres.",
