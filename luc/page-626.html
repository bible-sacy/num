e une bouche & une sagesse, à laquelle tous vos ennemis ne pourront résister, & qu'ils ne pourront contredire.</em>", "marges": []}, {"versets": [], "texte": "Il est dit dans les Actes du martyre de sainte Félicité, que cette Sainte qui étoit grosse lorsqu'elle fut arrêtée pour la foi, ayant été prise des douleurs de l'enfantement, qui lui tirèrent quelques plaintes de la bouche, l'un des gardes de la prison lui dit : Si vous criez maintenant, que ferez-vous donc étant exposée aux bêtes ? Et sainte Félicité remplie de l'esprit de Dieu lui fit sur le champ cette admirable réponse : <em>C'est moi qui souffre présentement : mais alors il y en aura un autre qui souffrira pour moi, parce que je souffrirai pour lui.</em> Voilà un exemple de l'accomplissement de ce que le Fils de Dieu dit ici à ses disciples. Il les avertit qu'ils seront <em>entraînés dans les prisons</em>, & <em>menés par force devant les Rois & les Gouverneurs pour la défense de son Nom.</em> Et il leur défend en même-temps de <em>préméditer ce qu'ils répondroient.</em> Car comme c'étoit pour sa cause, c'est-à-dire, pour l'établissement de la vérité & de sa Religion, qu'ils devoient être emprisonnés & maltraités, il leur promet de <em>leur donner une bouche & une sagesse, à laquelle tous leurs ennemis ne pourroient point résister.</em> C'étoit", "marges": ["Act. Holst. p. 26."]}], "texteGeneral": []}};
