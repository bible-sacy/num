          "marges": [],

        },
        {
          "texte": "Josephe témoigne que le temple de Jérusalem étoit orné tout autour des dépouilles des barbares, qui y étoient suspendues en l'honneur du Dieu des batailles. Mais entre les plus riches ornemens étoit cette vigne d'or, dont le grand Hérode avoit fait présent au temple, & qui, selon la remarque de Josephe, paroissoit, soit pour la grandeur, soit pour l'artifice, comme une merveille à tous ceux qui la voyoient. Les lames d'or répandues par-tout éblouissoient aussi les yeux par leur éclat. Et il s'y voyoit encore un tapis Babylonien de cinquante coudées de haut & seize de large, où l'azur, le pourpre, l'écarlate & le lin étoient mêlés avec tant d'art, qu'il donnoit de l'admiration à tous ceux qui le regardoient. C'étoient-là ces <em>riches dons</em>, que les disciples de J. C. voulurent lui faire admirer, lorsqu'il leur fit voir lui-même combien étoit vaine la confiance qu'avoient les Juifs en la beauté & en la magnificence de ce temple. Car le temps étoit arrivé que Dieu cherchoit à être adoré principalement dans le cœur de l'homme, comme dans le temple le plus digne de sa haute majesté, lui qui, comme dit saint Paul, <em>ayant fait le monde, & tout ce qui est dans le monde, & étant le Seigneur du ciel & de la terre, n'habite point dans les temples bâtis par les hommes</em> ; parce qu'il est un pur esprit, & un esprit infini qui remplit tout l'Univers. Il falloit donc que ce temple de Jérusalem, dont on ne peut lire la description dans Josephe sans étonnement, & dans la magnificence duquel tous les Juifs se glorifioient avec orgueil, fut détruit pour faire place à la Religion de J. C., & à l'édifice <a class=\"page-inline\" href=\"page-625.html\" title=\"p. 625\">‖</a>spirituel de l'Eglise. Il falloit que ces <em>riches dons</em> d'or & d'argent, & d'autre matière plus précieuse, le cédassent aux dons mêmes du Saint-Esprit, qui en comblant de grâces & de vertus les disciples du Sauveur, devoit les rendre des temples vivans de la Divinité, ornés plus       "fr": "Et il y aura en divers lieux de grands tremblemens de terre, des pestes, & des famines ; & il paroîtra des choses épouvantables, & des signes extraordinaires dans le ciel.",

          "texte": "<em>Et il paroîtra des choses épouvantables, & des signes extraordinaires dans le ciel.</em>",
          "marges": [],
          "p": 625
        },
        {
          "texte": "Le Fils de Dieu parle ici, selon la remarque des Interprètes, non des signes qui précéderont le temps du dernier avénement, mais de ceux qui devoient paroître avant la ruine de Jérusalem, comme on l'a fait voir avec beaucoup d'étendue dans les explications de saint Matthieu & de saint Marc, où tout ce qu'on lit dans ce chapitre est rapporté presque dans les mêmes termes. Quant à ces <em>choses épouvantables</em>, & à ces <em>signes extraordinaires</em> qu'on vit <em>dans le ciel</em>, ils sont marqués dans l'histoire de Josephe d'une manière qui fait voir aux plus aveugles l'accomplissement de cette prédiction de J. C. Une comète sous la figure d'une épée parut sur Jérusalem une année entière. Avant le commencement de la guerre, & au temps de la fête de Pâque, on vit la nuit pendant l'espace d'une demi-heure à l'entour de l'autel & du temple une si grande lumière, que l'on auroit cru être en plein jour. Une des portes du temple, qui étoit d'airain, & si pesante que vingt hommes pouvoient difficilement la pousser, s'ouvrit d'elle-même pendant la nuit, quoiqu'elle fut fermée avec de grosses serrures, des barres de fer & des verroux ; & on eut même beaucoup de peine à la refermer. Peu de temps après la fête on vit en l'air dans toute cette contrée des chariots pleins de gens armés traverser les nues, & se répandre à l'entour des villes, comme pour les enfermer. Le jour de la fête de la Pentecôte, les Sacrificateurs étant la nuit dans le temple intérieur pour s'acquitter de leurs fonctions, qui regardoient le culte divin, ils entendirent un bruit extraordinaire, & aussitôt après une voix qui répéta plusieurs fois, Sortons d'ici ; comme si les Anges qui jusqu'alors avoient été les protecteurs du peuple Juif, se fussent entr'exhortés à le quitter, en abandonnant le temple ; ou si Dieu même qui l'avoit rempli par sa présence, avoit déclaré par ces paroles qu'il alloit s'en éloigner, & le livrer à leurs ennemis. Mais ce qui dut causer aux habitans de Jérusalem une plus grande frayeur, fut ce qu'un simple paysan, nommé Jesus, fils d'Ananus, cria durant plusieurs années dans toute la ville, sans discontinuer un moment jour & nuit, & sans que sa voix <a class=\"page-inline\" href=\"page-626.html\" title=\"p. 626\">‖</a>en fut ni affoiblie ni enrouée : Malheur, disoit-il, malheur sur Jérusalem : Malheur sur le peuple : Malheur sur le temple ; jusqu'à ce que Jérusalem étant assiégée, cet homme ayant fait alors le tour des murailles, & prononcé tous les malheurs à son ordinaire ; comme il ajouta, & malheur sur moi, il fut frappé d'une pierre lancée par les machines des Romains, qui le renversa par terre & le tua.",

          "p": 625
        },
        {
          "texte": "C'étoit de tous ces prodiges, & de plusieurs autres qui précédèrent la ruine de Jérusalem & de son temple, que le Fils de Dieu parloit lorsqu'il déclara : Qu'il <em>paroîtroit des choses épouvantables, & des signes extraordinaires dans le ciel.</em> Tous les Juifs les virent : & ils ne firent point de réflexion à ce que JESUS leur avoit prédit avant sa mort. Ainsi au lieu de connoître sa divinité par l'accomplissement de ses prophéties à leur égard ; au lieu de juger au moins alors qu'il devoit être ce PROPHÈTE par excellence, que Moyse leur avoit prédit si long-temps auparavant devoir se lever du milieu d'eux ; & au lieu de condamner l'iniquité de leurs pères & la leur propre, <em>ils moururent</em>, comme il le leur avoit dit, <em>dans leur péché</em>, & devinrent à toute la terre & à toute la postérité un exemple du plus funeste aveuglement de l'esprit de l'homme, & du châtiment le plus redoutable de la justice de Dieu méprisée par la malice des hommes.",

      "note": [
        {
          "texte": "<em>Car je vous donnerai moi-même une bouche & une sagesse, à laquelle tous vos ennemis ne pourront résister, & qu'ils ne pourront contredire.</em>",
          "marges": [],
          "p": 626
        },
        {
          "texte": "Il est dit dans les Actes du martyre de sainte Félicité, que cette Sainte qui étoit grosse lorsqu'elle fut arrêtée pour la foi, ayant été prise des douleurs de l'enfantement, qui lui tirèrent quelques plaintes de la bouche, l'un des gardes de la prison lui dit : Si vous criez maintenant, que ferez-vous donc étant exposée aux bêtes ? Et sainte Félicité remplie de l'esprit de Dieu lui fit sur le champ cette admirable réponse : <em>C'est moi qui souffre présentement : mais alors il y en aura un autre qui souffrira pour moi, parce que je souffrirai pour lui.</em> Voilà un exemple de l'accomplissement de ce que le Fils de Dieu dit ici à ses disciples. Il les avertit qu'ils seront <em>entraînés dans les prisons</em>, & <em>menés par force devant les Rois & les Gouverneurs pour la défense de son Nom.</em> Et il leur défend en même-temps de <em>préméditer ce qu'ils répondroient.</em> Car comme c'étoit pour sa cause, c'est-à-dire, pour l'établissement de la vérité & de sa Religion, qu'ils devoient être emprisonnés & maltraités, il leur promet de <em>leur donner une bouche & une sagesse, à laquelle tous leurs ennemis ne pourroient point résister.</em> C'étoit <a class=\"page-inline\" href=\"page-627.html\" title=\"p. 627\">‖</a>Dieu même qui parloit en eux, comme c'étoit lui, selon sainte Félicité, qui souffroit en eux. Ainsi un Martyr souffrant avec joie les plus cruelles tortures du fer & du feu, & répondant aux persécuteurs avec une présence d'esprit & une sagesse qui les confondoit, étoit pour eux un mystère impénétrable. Mais cette même sagesse & cette patience d'un Martyr invincible au milieu des plus horribles tourmens, étoit pour ceux qui connoissoient l'Evangile, une preuve convaincante de la divinité de J. C. <em>Sa bouche</em>, en réduisant au silence ses ennemis ; <em>sa sagesse</em>, en les mettant hors d'état de <em>lui résister</em> ; & sa patience le rendant inaccessible à tous les traits de leur fureur, faisoient voir l'accomplissement des prédictions de son divin maître, qui avoit promis de <em>lui donner une bouche & une sagesse</em> qui surmonteroit tous ses adversaires.",
          "marges": [
            "Act. Holst. p. 26."
          ],
          "p": 626
        },
        {
          "texte": "On en vit un grand exemple aussitôt après la mort du Sauveur, dans la personne du premier de tous les Martyrs. Il est dit de lui dans les Actes des Apôtres, Que plusieurs personnes de la synagogue s'étant élevés contre Etienne, & disputant contre lui, <em>ils ne pouvoient résister à la sagesse & à l'esprit qui parloit par sa bouche.</em> Il est vrai que les payens ne demeuroient pas muets devant les Martyrs. Mais ce qu'ils leur répondoient n'avoit rien de véritable ni de solide. Et s'ils parloient, c'étoit seulement pour faire éclater davantage la vérité dans la bouche de ces Saints. C'étoit aussi, comme le remarque un Interprète, la raison la plus ordinaire pour laquelle les payens avoient recours aux supplices. Car comme ils étoient toujours vaincus par la sagesse dont Dieu remplissoit ses serviteurs, ils s'emportoient de fureur contre eux, & mettoient alors toute leur confiance dans les tortures & dans les plus cruels tourmens, espérant de pouvoir vaincre par la force de la douleur, celui qui les confondoit par la force de la vérité.",

      "note": [
        {
          "texte": "<em>Il ne se perdra pas un cheveu de votre tête. C'est par votre patience que vous posséderez vos ames.</em>",
          "marges": [],
          "p": 627
        },
        {
          "texte": "C'étoit une espèce de proverbe dont se servoit J. C., pour assurer ses disciples, que toute la cruauté de leurs ennemis ne pourroit leur faire le moindre tort. Mais n'est-il pas vrai cependant que les Martyrs de l'Eglise perdoient quelquefois chaque membre de leur corps l'un après l'autre avant que de perdre tout-à-fait la vie ? Comment donc le Fils de Dieu leur déclare-t-il, Qu'il <em>ne se perdroit pas un seul cheveu de leur tête ?</em> C'est que Dieu compte pour rien, & veut de même que ses disciples ne comptent point une perte qui est seulement temporelle & passagère. Il <a class=\"page-inline\" href=\"page-628.html\" title=\"p. 628\">‖</a>veut qu'ils jugent des choses, comme il en juge lui-même, par l'étendue infinie de l'éternité. Ce qu'ils perdent donc dans le temps présent, ils le gagnent au centuple pour l'avenir. Et ainsi cette perte étant pour eux un gain véritable, il parle d'une manière très-conforme à la vérité, lorsqu'il les assure, Qu'<em>un seul cheveu de leur tête ne se perdra pas</em> devant lui ; parce qu'il tiendra un compte exact aux saints Martyrs de ce qu'ils auront perdu pour l'amour de lui.",
          "marges": [],
          "p": 627
        },
        {
          "texte": "<em>Ce sera</em>, ajoute le Fils de Dieu, <em>par la patience que vous posséderez vos ames.</em> C'est ce qui est exprimé dans saint Matthieu & dans saint Marc par ces paroles : Que <em>celui qui persévérera</em>, ou <em>qui souffrira jusqu'à la fin, sera sauvé. Posséder son ame, & être sauvé</em>, est donc une même chose dans le langage de J. C. Car posséder, ou perdre une chose, sont les deux opposés. Ainsi tel <em>sauve</em> son ame & la <em>possède</em> véritablement pour toute l'éternité, qui souffrant tout pour l'amour de J. C., <em>persévérera jusqu'à la fin</em> dans ces souffrances ; car <em>la patience</em> est le seul prix dont on peut acheter <em>la possession</em> éternelle <em>de son ame</em> ; la patience soit au milieu des supplices que la fureur des tyrans nous fait souffrir, soit dans les maux & les différentes afflictions où la vie présente se trouve exposée.",

          "texte": "Tout ce discours du Sauveur dont nous avons expliqué une partie dans saint Matthieu, ne tendoit qu'à représenter d'une manière très-vive les effroyables malheurs qui devoient tomber un jour sur la ville de Jérusalem, & le grand péril où seroient ceux qui se trouveroient dans la Judée lorsque l'armée des Romains viendroit assiéger cette ville malheureuse. C'est pourquoi il avertit ceux qui y seroient de s'en retirer promptement, & ceux qui n'y seroient point de se bien garder d'y venir, de peur de se voir enveloppés dans la ruine générale du pays. Cependant par un terrible jugement de Dieu, tous les Juifs firent alors le contraire de ce qu'il leur dit ici ; puisqu'ils se rendirent de tous côtés à Jérusalem, & qu'il sembloit que la divine justice les poursuivit pour les réunir en un seul lieu, & les sacrifier tous ensemble à sa vengeance. Car <em>ce furent</em> véritablement <em>les jours de la vengeance</em> de Dieu, lequel ayant supporté ce peuple ingrat & cruel avec une patience étonnante, jusqu'au temps marqué par ses ordres éternels, le livra enfin à l'épée & au feu, tant <a class=\"page-inline\" href=\"page-629.html\" title=\"p. 629\">‖</a>de ses propres ennemis que de ses propres citoyens, lorsqu'ils devinrent de la manière du monde la plus horrible, les ministres de la colère de Dieu les uns à l'égard des autres, s'entretuant avec un acharnement & une brutalité, dont on ose dire que les siècles précédens n'avoient point encore vu d'exemple. Il falloit ainsi, dit J. C., que <em>ce qui est dans l'Ecriture fut accompli.</em> Car l'esprit de Dieu avoit prédit par la bouche d'Isaïe, plusieurs siècles auparavant, la ruine de Jérusalem, & en même-temps l'aveuglement déplorable de son peuple, qui au lieu d'avoir recours aux larmes de la pénitence, ne penseroit qu'à se réjouir, en disant : <em>Mangeons & buvons, nous mourrons demain.</em> Daniel avoit de même prédit cette effroyable désolation en termes très-clairs. Mais tout devient inutile à ces hommes endurcis, & livrés à la réprobation de leur propre orgueil.",

          "marges": [],
          "p": 631
        },
        {
          "texte": "On a déjà remarqué dans les explications de saint Matthieu, que le Fils de Dieu passe tout-d'un-coup de ce qui regarde la ruine de Jérusalem, aux signes & aux prodiges qui précédéroient son second avénement à la fin du monde ; & qu'il en use de cette sorte pour répondre aux différentes questions que ses disciples lui avoient faites. Ce qu'on doit bien remarquer ici, c'est qu'en même temps que JESUS-CHRIST représente de la manière la plus capable de jeter l'effroi dans le cœur des hommes, le renversement de toute la nature, & les <em>effroyables bruits que la mer fera entendre par la grande agitation de ses flots</em>, ensorte que tous les peuples <em>seront dans la</em> dernière <em>consternation</em> ; il commande à ses disciples de <em>lever la tête</em> avec confiance, & de <em>regarder en haut, parce que leur rédemption sera proche</em> alors. Ce n'est donc pas aux disciples de JESUS-CHRIST, que son avénement doit inspirer de la crainte ; puisqu'ils doivent au contraire vivre toujours, comme dit saint Paul, <em>dans l'attente de la béatitude qu'ils espèrent, & de l'avénement glorieux du Sauveur.</em> Ils gémissent ici-bas, comme des captifs sous le joug du péché, qui bien qu'il ne règne pas dans leurs cœurs, ne laisse pas de faire sentir son poids aux plus justes. Et ils aspirent à être <em>rachetés</em> de cette espèce de servitude, étant déli<a class=\"page-inline\" href=\"page-632.html\" title=\"p. 632\">‖</a>vrés de ce corps, que saint Paul appelle un corps <em>de mort.</em> C'est donc <em>le temps de leur rédemption qui approche</em>, lorsqu'ils voient paroître les signes de l'avénement du Fils de Dieu. Et ce qui cause de la frayeur aux hommes charnels, qui ont mis leur espérance dans le siècle, remplit ceux-ci de confiance, en leur montrant leur libérateur, & leur rédemption.",

      "note": [
        {
          "texte": "<em>Prenez donc garde à vous, de peur que vos cœurs ne s'appesantissent par l'excès des viandes & du vin, & par les inquiétudes de cette vie ; & que ce jour ne vous vienne tout-d'un-coup surprendre, &c.</em>",

          "p": 632
        },
        {
          "texte": "Il peut paroître un peu surprenant de ce que le Fils de Dieu parlant ici aux Apôtres & à ses disciples, leur recommande particulièrement de <em>prendre garde de ne pas laisser appesantir leurs cœurs par l'excès des viandes & du vin, & par les inquiétudes de la vie présente</em>, eux qui avoient tout quitté, & renoncé à tous les soins de la terre, pour le suivre & l'imiter dans sa pauvreté. Mais il faut se souvenir que JESUS-CHRIST en leur parlant, instruisoit tous ceux qui se rendroient ses disciples dans la suite de tous les siècles. Car ni ses Apôtres, ni les autres à qui il parloit alors, ne pouvoient pas se trouver à la fin du monde, puisque son second avénement ne devoit point arriver pendant leur vie. Ainsi ce qu'il leur disoit regardoit particulièrement ses serviteurs, qui se trouveroient dans ces derniers temps d'une désolation si universelle, qui précéderoit son dernier avénement. On peut dire néanmoins, que ces paroles s'adressent aussi à tous les Chrétiens en général, à tous ceux qui veulent songer sérieusement à leur salut. Car, quoique tous ne puissent pas être témoins de ces signes & de ces prodiges qui arriveront à la fin du monde, il est certain toutefois que le monde finit pour eux au temps de leur mort, & que c'est la disposition où ils se trouvent à cette dernière heure, qui doit fixer leur éternité de bonheur ou de malheur. Il est donc pour eux de la dernière importance, que <em>ce moment ne les</em> surprenne & ne les <em>enveloppe pas</em>, selon l'expression de JESUS-CHRIST, <em>comme un filet</em> où l'oiseau se trouve pris tout-d'un-coup sans l'avoir prévu. Or c'est pour les empêcher de tomber dans cette surprise si funeste, qu'il les avertit de veiller beaucoup sur eux-mêmes ; <em>afin que leurs cœurs ne se laissent pas appesantir par l'excès des viandes & du vin, & par les inquiétudes de la vie présente.</em> Car, quoique des serviteurs de Dieu ne se laissent point aller à ces excès si opposés à la piété, on peut néanmoins insensiblement se relâcher & tomber peu-à-peu d'une vie moins mor<a class=\"page-inline\" href=\"page-633.html\" title=\"p. 633\">‖</a>tifiée dans une vie molle & inquiète, si l'on n'a soin de se réveiller sans cesse par le souvenir de ce dernier temps, soit de notre mort, soit du second avénement. Et rien sans doute n'est plus capable que cette pensée de resserrer dans les bornes de l'abstinence chrétienne, & de dépouiller de toutes les vaines inquiétudes de cette vie ceux que la vue des objets du monde, & que l'attrait continuel de ses plaisirs met à toute heure en danger de leur salut. Car un homme qui songe à être jugé, n'est plus frappé de tous les plaisirs de la vie présente ; & ce grand objet le possède tout entier.",

          "texte": "<em>Veillez donc</em>, leur dit J. C. Mais de quoi, Seigneur, nous serviroit-il de veiller, nous qui sommes si misérables & si foibles par nous-mêmes, à moins que vous ne nous couvriez de votre protection toute-puissante ? C'est donc pour cela que vous ordonnez à vos disciples de veiller, <em>priant en tout temps</em> : parce que pourvu qu'ils joignent la prière à la vigilance, & une prière continuelle, qui consiste principalement, comme on l'a dit, dans le désir & les soupirs de leur cœur vers celui qui peut les sauver, ils n'ont rien à craindre. Ils se peuvent assurer avec le Prophète Roi, que <em>s'ils tiennent en tout temps leurs yeux élevés vers le Seigneur</em> d'où vient leur salut, <em>il dégagera lui-même leurs pieds des piéges</em> de leurs ennemis. L'on peut donc connoître, selon la remarque très-sage d'un Interprète, dans ces paroles de J. C., <em>Vigilate omni tempore orantes</em>, comment le secours divin s'accorde fort bien avec le travail & le soin de l'homme. Celui à qui on commande de veiller, n'est pas comme un instrument inanimé, qui ne se remue que par une force étrangère. Et celui à qui on ordonne de prier, est averti visiblement qu'il a besoin de la grâce de son Dieu, sans laquelle tous ses soins & toute son industrie seroient inutiles. Ainsi, c'est & en veillant & en priant, qu'on <em>devient digne d'éviter tous les malheurs</em> dont parle ici JESUS-CHRIST ; c'est-à-dire, & les tromperies des faux-christs & des faux-prophètes, & tous les maux qui doivent fondre sur les hommes dans la fin des temps.",
