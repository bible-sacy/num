arqué expressément : <em>Qu'ayant vu l'enfant , ils connurent</em> la vérité <em>de ce qu'on leur avoit dit</em> ; c'est-à-dire , qu'ils jugèrent par ces marques extérieures d'abaissement & de pauvreté , dont on leur avoit parlé , que c'étoit celui qu'ils devoient effectivement regarder comme leur Sauveur. Quelle foi ! Et quel étrange sujet de confusion pour tous ceux , qui après l'éclat de tant de miracles qu'il a faits pendant sa vie , & depuis sa mort , & après la conversion si miraculeuse de tout l'Univers , refusent encore de reconnoître ce même JESUS dans sa crèche , dans sa pauvreté , dans ses abaissemens & dans ses souffrances , pour leur chef & pour celui qui les doit sauver , s'ils n'ont pas de honte de ses humiliations & de sa croix !", "marges": []}, {"versets": [], "texte": "Il paroît que ces Bergers publièrent ce qui leur étoit arrivé , c'est-à-dire , l'apparition des Anges , & ce qu'ils leur avoient dit. Car il est marqué , que <em>tous ceux qui l'entendirent en furent dans l'admiration.</em> Ce n'étoit à la vérité que des Bergers qui publioient cette nouvelle si importante : mais plus ils étoient méprisables aux yeux du monde , plus leur témoignage fut d'un grand poids pour l'établissement de la foi d'un mystère tout en-", "marges": []}], "texteGeneral": []}};
