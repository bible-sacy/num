  const SACY_PAGE = {"meta": {"livre": "luc", "livreFr": "Évangile de saint Luc", "livreAbr": "Lc", "imageUrl": "https://bible.sacy.be/pngs-nt-1-trimmed/trimmed-marc_et_luc/trimmed-marc_et_luc-275.png", "facSlug": "luc", "prev": 261, "next": 263}, "page": {"fichier": 275, "p": 262, "imprime": 262, "chapitre": 1, "coupureDebut": true, "coupureFin": true, "sommaire": "", "titres": [], "versets": [], "margesBible": [], "notesBas": [], "commentaire": [{"versets": [], "texte": "soit. Et nous savons au contraire que sa foi a été louée par Elisabeth , lorsqu'étant remplie du Saint-Esprit , elle s'écria : <em>Vous êtes heureuse d'avoir cru.</em> L'Ange lui annonce donc la conception miraculeuse qui s'étoit faite dans une femme stérile & âgée , afin que lorsqu'il ajoute à un miracle un autre miracle , il la comble en même-temps d'une double joie.", "marges": ["Luc. 1. 41. 45."]}, {"versets": [], "texte": "Mais ne pourroit-on pas dire aussi sans blesser en aucune sorte l'humble foi de la sainte Vierge , que la profondeur du mystère de l'Incarnation étoit telle , que son humilité même sembloit engager l'Ange à la confirmer dans la créance d'une chose qu'elle regardoit comme élevée infiniment au-dessus d'elle ? Car quelle surprise pour la plus humble de toutes les créatures , d'entendre dire tout-d'un-coup qu'elle deviendroit la mère de Dieu , & qu'elle alloit concevoir par une voie si divine <em>le Fils du Très-haut</em> ? C'étoit sans doute un miracle de la puissance de Dieu , qu'une femme stérile & aussi avancée en âge qu'Elisabeth , eut conçu dans sa vieillesse. Mais qu'étoit-ce en comparaison de ce prodige au-dessus de tous les prodiges , que non-seulement une vierge conçût sans perdre sa virginité , mais qu'elle conçut le Fils du Très-haut dans son chaste sein ? Et quel miracle fut-ce encore à cette humble Vierge , de l'avoir cru sans cesser d'être humble , & étant même devenue encore plus humble ? Disons donc avec le saint Ange , dans la profonde admiration de tant de prodiges : <em>Qu'il n'y a rien d'impossible à Dieu</em> , puisque Dieu même a pu se faire homme ; puisqu'une vierge a pu devenir la mère de Dieu ; puisqu'une simple créature étant élevée jusqu'au comble de gloire de la divine maternité , s'est regardée plus que jamais comme un néant devant Dieu.", "marges": []}, {"versets": [], "texte": "On a quelque peine à expliquer ce que dit l'Ange , qu'Elisabeth étoit la cousine de la sainte Vierge. Saint Ambroise a cru que c'étoit assez pour les appeler <em>cousines</em> , qu'elles fussent toutes deux Juives ; parce que tous les Juifs se regardoient comme parens , selon que le dit saint Paul , Qu'<em>il eut désiré d'être anathème & séparé de J. C. pour ses frères , qui étoient d'un même sang que lui , selon la chair</em> , c'est-à-dire , pour les Juifs. Mais quoique la sainte Vierge & Elisabeth fussent de différentes tribus , le père ou l'ayeul d'Elisabeth , qui étoit de la tribu de Lévi , pouvoit bien avoir épousé une femme qui étoit comme la Vierge de la tribu de Juda , & de la famille de David ; puisqu'il n'étoit pas défendu d'épouser des femmes d'une autre tribu , pourvu qu'elles ne fussent pas héritières , comme on l'a marqué ailleurs.", "marges": ["Ambros. in Luc. ibid. 3. init.", "Rom. 9. 3."]}, {"versets": [38], "texte": "<em>Alors Marie lui dit : Voici la servante du Seigneur ,</em>", "marges": []}], "texteGeneral": []}};
